# JSON处理配置 - 控制JSON响应解析和字符过滤行为
json_processing:
  # 字符过滤配置
  character_filtering:
    # 是否启用严格的控制字符过滤
    strict_control_chars: true
    # 是否启用扩展ASCII字符过滤
    filter_extended_ascii: true
    # 是否启用Unicode替换字符过滤
    filter_unicode_replacement: true
    # 允许的控制字符列表（除了换行符和制表符）
    allowed_control_chars: ["\n", "\t"]
    # 允许的Unicode范围
    allowed_unicode_ranges:
      # 中文字符范围
      chinese: [0x4E00, 0x9FFF]
      # 中文标点符号范围
      chinese_punctuation: [0x3000, 0x303F]
      # 全角字符范围
      fullwidth: [0xFF00, 0xFFEF]
      # 拉丁字母扩展范围
      latin_extended: 
        - [0x00C0, 0x00FF]
        - [0x0100, 0x017F]
        - [0x0180, 0x024F]
      # 阿拉伯文范围
      arabic: [0x0600, 0x06FF]
      # 西里尔文范围
      cyrillic: [0x0400, 0x04FF]
      # 希腊文范围
      greek: [0x0370, 0x03FF]
      # 希伯来文范围
      hebrew: [0x0590, 0x05FF]
      # 泰文范围
      thai: [0x0E00, 0x0E7F]
      # 韩文范围
      korean: [0xAC00, 0xD7AF]
      # 日文平假名范围
      japanese_hiragana: [0x3040, 0x309F]
      # 日文片假名范围
      japanese_katakana: [0x30A0, 0x30FF]
  
  # JSON修复配置
  json_repair:
    # 是否启用深度JSON修复
    enable_deep_repair: true
    # 是否启用字段优先提取
    enable_field_based_extraction: true
    # 是否启用保守修复策略
    enable_conservative_fix: true
    # 最大修复尝试次数
    max_repair_attempts: 3
    # 是否启用日志记录
    enable_logging: true
  
  # 响应处理配置
  response_processing:
    # 是否检查Content-Length
    check_content_length: true
    # 是否尝试恢复不完整响应
    enable_response_recovery: true
    # 响应超时时间
    timeout: "30s"
    # 最大响应大小（字节）
    max_response_size: 1048576  # 1MB

# HTML转换器配置 - 控制Markdown到HTML转换和内容分页的样式参数
html_converter:
  # 基础配置
  card:
    width: 1080          # 卡片宽度
    height: 1440         # 卡片高度
    padding: 60          # 内边距（与分页算法保持一致）
  
  # 分页配置
  pagination:
    available_width: 1000  # 可用宽度
    max_content_height: 1360  # 最大内容高度
    min_card_height: 800      # 最小卡片高度
    max_card_height: 4320     # 最大卡片高度
    min_bottom_padding: 10    # 最小底部留白（减少底部空白）
  
  # 字体配置 - 清晰大字号风格
  fonts:
    family: "'PingFang SC', 'Helvetica Neue', Arial, sans-serif"  # 字体系列
    title_size: 48       # 标题字体大小（大字号，加粗）
    subtitle_size: 40    # 副标题字体大小（大字号，加粗）
    body_size: 36        # 正文字体大小（大字号，清晰易读）
    list_size: 36        # 列表字体大小
    quote_size: 34       # 引用字体大小
  
  # 行高配置 - 提升可读性
  line_heights:
    title: 1.3           # 标题行高倍数
    subtitle: 1.3        # 副标题行高倍数
    body: 1.8            # 正文行高倍数（增大行高，提升可读性）
  
  # 边距配置 - 优化间距
  margins:
    title_bottom: 32     # 标题下边距（增加间距）
    subtitle_bottom: 28  # 副标题下边距
    body_bottom: 20      # 正文下边距（增加间距）
  