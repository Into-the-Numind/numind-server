# 卡片配置 - 统一的卡片渲染和分页配置中心
card:
  # 基础尺寸配置（所有组件共用）
  dimensions:
    width: 1080   # 标准尺寸: 1080×1440（3:4比例）
    height: 1440  # 基础高度，实际使用动态高度
    padding:
      top: 50     # 标准内边距: 60px 50px
      right: 50
      bottom: 50
      left: 50
  
  # 渲染器配置
  rendering:
    enable_flow_renderer: true      # 是否启用流式分页渲染器（优先于环境变量）
    quality: 85            # 图片质量（1-100）
    format: "webp"         # 图片格式
    zoom: 1.0              # 缩放比例
    timeout: 90            # 超时时间（秒）- 本地环境建议设置为90秒
    max_concurrent: 3      # 最大并发渲染数（避免Chrome实例过多导致资源耗尽，建议2-5）
    
  # 分页算法参数
  pagination:
    algorithm: "line_based"         # 分页算法：line_based（逐字符→逐行→逐页）或 dynamic
    char_width_factor: 1.05         # 字符宽度系数（估算每个字符的像素宽度，影响换行与行数）
    overflow_tolerance: 0.05        # 溢出容错比例（保留配置；当前贪心分页未使用，可后续接入）
    high_utilization_threshold: 85.0 # 高利用率阈值（保留配置；当前贪心分页未使用，可后续接入）
    min_chars_per_line: 20          # 最少每行字符数下限（仅作为安全兜底）
    list_item_spacing: 8            # 列表项额外行距（渲染细节，分页按正文行高估算）
    
  # 动态分页特有参数
  dynamic_pagination:
    min_height: 720          # 最小卡片高度
    max_height: 4320         # 最大卡片高度（3倍标准高度）
    min_bottom_padding: 40   # 最小底部留白，确保文字不被遮挡
    max_images_per_card: 5   # 每张卡片最大图片数
    max_text_length: 2000    # 每张卡片最大文本长度
    base_height: 1440        # 基础高度（用于规范化）
    base_image_height: 400   # 基础图片高度
    image_margin_top: 20     # 图片上边距
    image_margin_bottom: 20  # 图片下边距

  # 统一的字体和样式配置
  typography:
    # 段落处理策略配置
    paragraph_strategy: "markdown"  # "markdown"(默认，空行分段) 或 "single_newline"(单换行即段落)
    # 字体族配置
    font_family: "'SourceHanSerifSC', 'STFangsong', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif"
    base_font_size: 36        # 基础字体大小（全局 body 备用，内容按下方 sizes/line_heights）
    line_height_ratio: 1.1   # 基础行高比例（全局 body 备用）
    
    # 字体大小配置
    sizes:
      title: 120             # 标题字号（仅封面H1使用；正文卡片不渲染H1）
      subtitle: 36           # 副标题字号（##/###）
      h3: 36                 # 三级标题字号（###），默认与subtitle一致
      body: 36               # 正文字号
      list: 36               # 列表字号
      quote: 36              # 引用字号
      tag: 36                # 标签字号
      number: 36             # 数字字号
    
    # 行高配置
    line_heights:
      title: 160             # 标题行高（像素）。分页按：行高倍数=160/120 计算
      subtitle: 60           # 副标题行高（像素）。分页与渲染同源
      h3: 60                 # 三级标题行高（像素），默认与subtitle一致
      body: 60               # 正文行高（像素）。分页与渲染同源
      list: 60               # 列表行高（像素）
      quote: 60              # 引用行高（像素）
      tag: 60                # 标签行高（像素）
      number: 60             # 数字行高（像素）
    
    # 间距配置
    spacing:
      base_margin: 0         # 基础段后距（默认应用到 title/subtitle/body，下面的 margins 可覆盖）
      global_multiplier: 1.0 # 统一设为 1.0，避免旧路径的倍数干扰，确保分页=渲染
      # 各元素类型的间距调整（可选，用于精确控制）
      # adjustments:
      #   title:
      #     margin_top_multiplier: 1.0    # 标题上边距倍数
      #     margin_bottom_multiplier: 1.0 # 标题下边距倍数
      #     line_height_multiplier: 1.0   # 标题行高倍数
      # 边距配置 - 优化间距
      margins:
        title_bottom: 40     # 标题段后距（像素，仅封面H1卡片有效）
        subtitle_bottom: 0   # 副标题段后距（像素，分页最后一行才计入）
        h3_bottom: 0         # 三级标题段后距（像素），默认与subtitle一致
        body_bottom: 60      # 正文段后距（像素，分页最后一行才计入）
    
    # 颜色配置
    colors:
      text: "#333333"        # 主文本颜色（深灰）
      secondary: "#1278B8"   # 次要文本颜色（蓝色）
      accent: "#1E90FF"      # 强调色（蓝色）
      
    # 对齐配置
    alignments:
      title: "justify"       # 标题对齐
      subtitle: "justify"    # 副标题对齐
      body: "justify"        # 正文对齐
      list: "justify"        # 列表对齐
      quote: "justify"       # 引用对齐
      tag: "left"            # 标签对齐
      number: "justify"       # 数字对齐
      
    # 其他样式配置
    styles:
      list_indent: 20        # 列表缩进（渲染用的左缩进；不改变分页可用宽度）

  # 页码配置
  page_number:
    enabled: true            # 是否启用页码显示
    font_size: 24           # 页码字号
    color: "#666666"        # 页码颜色
    font_weight: "normal"   # 页码粗细：normal, bold
    position:
      bottom: 30            # 距离底部边距
      right: 50             # 距离右侧边距
    format: "{current}/{total}"  # 页码格式：{current}当前页，{total}总页数

# 特殊渲染规则配置
special_rules:
