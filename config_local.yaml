# 本地环境
# 通用配置
runmode: debug               # Gin 开发模式, 可选值有：debug, release, test
addr: :9091                  # HTTP 服务器监听地址
jwt:
  secret: Rtg8BPKNEf2mB4mgvKONGPZZQSaJWNLijxR42qRgq0iBb5 # JWT 签发密钥
  expire-hours: 24 # JWT 过期时间，单位：小时

# HTTPS 服务器相关配置
tls:
  addr: :9092 # HTTPS 服务器监听地址
  cert: /etc/ssl/certimate/youshu.asia/cert.crt # 证书
  key: /etc/ssl/certimate/youshu.asia/cert.key # 证书 Key 文件

# GRPC 相关配置
grpc:
  addr: :9090 # GRPC 服务器监听地址

# MySQL 数据库相关配置
db:
  host: 49.233.219.254:13306  # MySQL 机器 IP 和端口，默认 127.0.0.1:3306
  username: numind # MySQL 用户名(建议授权最小权限集)
  password: Numind2025 # MySQL 用户密码
  database: numind # 系统所用的数据库名
  max-idle-connections: 100 # MySQL 最大空闲连接数，默认 100
  max-open-connections: 100 # MySQL 最大打开的连接数，默认 100
  max-connection-life-time: 10s # 空闲连接最大存活时间，默认 10s
  log-level: 4 # GORM log level, 1: silent, 2:error, 3:warn, 4:info

# 日志配置
log:
  disable-caller: false # 是否开启 caller，如果开启会在日志中显示调用日志所在的文件和行号
  disable-stacktrace: false # 是否禁止在 panic 及以上级别打印堆栈信息
  level: debug # 指定日志级别，可选值：debug, info, warn, error, dpanic, panic, fatal
  format: console # 指定日志显示格式，可选值：console, json
  output-paths: [./numind.log, stdout] # 指定日志输出位置，多个输出，用 `逗号 + 空格` 分开。stdout：标准输出，

redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0
    pool_size: 10
    min_idle_conns: 5

wechat:
    app_id: "wxad0aec8b3d3b2ef4"
    app_secret: "cd5e2a2a919fd6a06c52ae2a15286a36"

oss:
  endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket_name: ""

openai:
  api_key: "60dbceec-5407-45c3-8d29-c26a47b77884"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-250324"  # 使用的AI模型
  temperature: 0.5 # 生成文本的随机性，值越高随机性越大
  tokens: 2000 # 生成文本的最大长度
  timeout: 30s
  max_retries: 3

resource:
  image_path: /data/numind/images