# ────────────────────────────────────────────────────────────────
# 1. Billing 段 — membership-credits-redesign Task 13 §5.10
# ────────────────────────────────────────────────────────────────
# b2b_cutover_date: B2B 月度账单"切换日"。该日期之前的账单走 legacy_only 口径
# （读老 credit_package 表），之后走 new_only 口径（读 membership_event 表），
# 跨越当月双口径拼接。spec §7。
#
# 配置策略（重要）：
#   - 推荐值：上线当天日期，例如 "2026-05-14"（YYYY-MM-DD 格式）
#   - 含义：今天起所有 B2B grant 走新表，历史账单永远走老表
#   - 缺失行为：admin.go:73 启动只 warn 不 fatal，B2B 账单全部走 legacy_only
# ────────────────────────────────────────────────────────────────

billing:
  b2b_cutover_date: "2026-05-14"


# ────────────────────────────────────────────────────────────────
# 2. Langfuse 段 — LLM 调用可观测性
# ────────────────────────────────────────────────────────────────
# enabled=true 时，所有 LLM 调用会写 trace 到 Langfuse 后端，方便排查问题
# 和审计 token 消耗。enabled=false 时 LLM 仍然正常工作，只是没有 trace。
#
# 配置策略：
#   - public_key / secret_key 直接复制 dev 的同一对（同一个 Langfuse 项目）
#   - 若想 prod / dev 分项目（推荐）：去 Langfuse UI 新建 prod 项目，拿新 keys
#     替换下面两行
# ────────────────────────────────────────────────────────────────

