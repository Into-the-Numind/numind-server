# =============================================================================
#
# 用法：
#   1. SSH 到 prod (49.233.219.254 不对，应该是 129.28.125.51)
#   2. sudo vim /opt/numind/config/config_prod.yaml
#   3. 在文件**末尾**追加下面这两段（不要替换现有任何内容！）
