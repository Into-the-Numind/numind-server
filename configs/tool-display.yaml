# tool-display.yaml — Narration templates for built-in agent tools.
#
# Schema (see internal/numind/biz/narration/display.go::YAMLConfig):
#   tools.<tool_name>.{verb, detail_template, use_template, result_template,
#                      error_template, rejected_template}
#   defaults.{...}  (fallback when tool not in tools map)
#
# Template engine: Go text/template with missingkey=zero (S2-D1) so absent
# input fields render as empty string (not the literal "<no value>").
# Available funcs: truncate, default. text/template builtins (len/eq/etc) also.
# Template data accessible:
#   {{ .verb }}, {{ .detail }}                — pre-computed from this entry
#   {{ .input.<field> }}                       — observable input (per FullTool.BackfillObservableInput)
#   {{ .result.<field> }}                      — tool execution output
#   {{ .reason_friendly }}                     — error_translate.ClassifyError output
#
# Empty template values ("") mean "no message for this state" and the
# Translator falls through to LLMFallback for that one slot.
#
# Tool keys must match the FullTool.Name() return values; mismatched keys hit
# the defaults block (warn logged at boot per S1-D10).

tools:
  bash_exec:
    verb: "正在执行"
    detail_template: "命令"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "命令执行完成"
    error_template: "命令执行中断，{{ .reason_friendly }}"
    rejected_template: "命令被规则拦截"

  document_generate:
    verb: "正在生成"
    detail_template: "{{ default \"文档\" .input.format }}"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "文档已生成"
    error_template: "生成中断，{{ .reason_friendly }}"
    rejected_template: "文档生成被规则拦截"

  image_gen:
    verb: "正在生成"
    detail_template: "图片"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "图片已生成"
    error_template: "图片生成中断，{{ .reason_friendly }}"
    rejected_template: "图片生成被规则拦截"

  kb_search:
    verb: "正在搜索"
    detail_template: "知识库"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已查到相关内容"
    error_template: "搜索中断，{{ .reason_friendly }}"
    rejected_template: "知识库搜索被规则拦截"

  learner_data_query:
    verb: "正在查询"
    detail_template: "你的学习数据"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已查到学习数据"
    error_template: "查询中断，{{ .reason_friendly }}"
    rejected_template: "数据查询被规则拦截"

  get_current_date:
    verb: "正在获取"
    detail_template: "当前日期"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已获取当前日期"
    error_template: "获取日期中断，{{ .reason_friendly }}"
    rejected_template: "日期获取被规则拦截"

  # 2026-05-22: 补齐 6 个之前走 defaults block 的工具，让学员看到具体的工具
  # 名称而不是泛化的「正在处理 操作」。所有 detail 保持 static（不读 .input）
  # 以免某些工具未 BackfillObservableInput 导致空字符串渲染。

  web_search:
    verb: "正在搜索"
    detail_template: "网络"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已获取搜索结果"
    error_template: "搜索中断，{{ .reason_friendly }}"
    rejected_template: "网络搜索被规则拦截"

  web_fetch:
    verb: "正在抓取"
    detail_template: "网页内容"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已读取网页"
    error_template: "抓取中断，{{ .reason_friendly }}"
    rejected_template: "网页抓取被规则拦截"

  file_read:
    verb: "正在读取"
    detail_template: "文件"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已读取文件"
    error_template: "读取中断，{{ .reason_friendly }}"
    rejected_template: "文件读取被规则拦截"

  memory_read:
    verb: "正在回忆"
    detail_template: "你的偏好"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已读取记忆"
    error_template: "回忆中断，{{ .reason_friendly }}"
    rejected_template: "记忆读取被规则拦截"

  memory_write:
    verb: "正在记下"
    detail_template: "你的偏好"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已写入记忆"
    error_template: "记录中断，{{ .reason_friendly }}"
    rejected_template: "记忆写入被规则拦截"

  # use_skill: agent-mode v2 #2 新增的 platform AgentTool。允许 LLM 主动调用
  # 已装载的 Skill。input.name 是技能名（中文），detail 直接渲染该字段。
  use_skill:
    verb: "调用技能"
    detail_template: "{{ .input.name }}"
    use_template: "📚 正在加载技能：{{ .input.name }}"
    result_template: "📚 已调用技能：{{ .input.name }}"
    error_template: "⚠ 技能加载失败：{{ .reason_friendly }}"
    rejected_template: "技能调用被拒绝"

  # ask_user_question 是 yield 式工具：narration 会 emit StateUse 然后
  # tool_call_yield 事件被前端转成 question_prompt 消息分支处理。这里给
  # 一个兜底文案，避免极少数情况下 yield 之外的状态走 defaults。
  ask_user_question:
    verb: "等你回答"
    detail_template: "一个问题"
    use_template: "{{ .verb }} {{ .detail }}"
    result_template: "已收到你的回答"
    error_template: "问题处理中断，{{ .reason_friendly }}"
    rejected_template: "提问被规则拦截"

defaults:
  verb: "正在处理"
  detail_template: "操作"
  use_template: "{{ .verb }}{{ if .detail }} {{ .detail }}{{ end }}"
  result_template: "操作完成"
  error_template: "操作失败，{{ .reason_friendly }}"
  rejected_template: "操作被规则拦截"
