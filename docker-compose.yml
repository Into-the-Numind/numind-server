version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: numind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wxtw
      MYSQL_USER: numind
      MYSQL_PASSWORD: numindpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - numind-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: numind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - numind-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  # Numind 应用
  numind-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # 使用构建阶段进行开发
    container_name: numind-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 环境配置
      - ENVIRONMENT=development
      
      # 服务器配置 (可选，会覆盖 config.yaml)
      - NUMIND_SERVER_PORT=8000
      - NUMIND_SERVER_READ_TIMEOUT=30s
      - NUMIND_SERVER_WRITE_TIMEOUT=30s
      
      # 数据库配置 (可选，会覆盖 config.yaml)
      - NUMIND_DATABASE_HOST=mysql
      - NUMIND_DATABASE_PORT=3306
      - NUMIND_DATABASE_USER=numind
      - NUMIND_DATABASE_PASSWORD=numindpass
      - NUMIND_DATABASE_NAME=wxtw
      - NUMIND_DATABASE_MAX_OPEN_CONNS=10
      - NUMIND_DATABASE_MAX_IDLE_CONNS=5
      
      # Redis 配置 (可选，会覆盖 config.yaml)
      - NUMIND_REDIS_HOST=redis
      - NUMIND_REDIS_PORT=6379
      - NUMIND_REDIS_PASSWORD=
      - NUMIND_REDIS_DB=0
      - NUMIND_REDIS_POOL_SIZE=10
      
      # JWT 配置 (可选，会覆盖 config.yaml)
      - NUMIND_JWT_SECRET=dev-secret-key-change-in-production
      
      # 微信小程序配置 (可选，会覆盖 config.yaml)
      - NUMIND_WECHAT_APP_ID=${WECHAT_APP_ID}
      - NUMIND_WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      
      # 对象存储配置 (可选，会覆盖 config.yaml)
      - NUMIND_OSS_ENDPOINT=${OSS_ENDPOINT}
      - NUMIND_OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - NUMIND_OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - NUMIND_OSS_BUCKET_NAME=${OSS_BUCKET_NAME}
      
      # OpenAI 配置 (可选，会覆盖 config.yaml)
      - NUMIND_OPENAI_API_KEY=${OPENAI_API_KEY}
      - NUMIND_OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - NUMIND_OPENAI_TIMEOUT=30s
      - NUMIND_OPENAI_MAX_RETRIES=3
      
      # 日志配置 (可选，会覆盖 config.yaml)
      - NUMIND_LOGGING_LEVEL=info
      - NUMIND_LOGGING_FORMAT=json
      - NUMIND_LOGGING_OUTPUT=stdout
      - NUMIND_LOGGING_FILE_PATH=/app/logs/numind.log
      
      # 安全配置 (可选，会覆盖 config.yaml)
      - NUMIND_SECURITY_RATE_LIMIT_REQUESTS=100
      - NUMIND_SECURITY_RATE_LIMIT_WINDOW=1m
      - NUMIND_SECURITY_JWT_EXPIRE_HOURS=24
      
      # 监控配置 (可选，会覆盖 config.yaml)
      - NUMIND_MONITORING_ENABLED=true
      - NUMIND_MONITORING_METRICS_PORT=9090
      
      # 跨域配置 (可选，会覆盖 config.yaml)
      - NUMIND_CORS_ALLOWED_ORIGINS=http://localhost:5173,https://llm-soup.xyz,http://47.108.85.126
      - NUMIND_CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - NUMIND_CORS_ALLOWED_HEADERS=Origin,Content-Type,Accept,Authorization
      - NUMIND_CORS_ALLOW_CREDENTIALS=true
      - NUMIND_CORS_MAX_AGE=12h
      
      # 应用信息 (可选，会覆盖 config.yaml)
      - NUMIND_APP_NAME=Numind Server
      - NUMIND_APP_VERSION=1.0.0
      - NUMIND_APP_DESCRIPTION=Numind API Server
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - numind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: numind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - numind-server
    networks:
      - numind-network

  # 监控服务 (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: numind-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - numind-network

  grafana:
    image: grafana/grafana:latest
    container_name: numind-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - numind-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  numind-network:
    driver: bridge 