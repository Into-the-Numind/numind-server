name: Cleanup Artifacts

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete artifacts older than X days'
        required: true
        default: '7'
        type: number
  schedule:
    # 每天凌晨2点自动清理
    - cron: '0 2 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const days = ${{ github.event.inputs.days || 7 }};
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            
            console.log(`Cleaning up artifacts older than ${days} days (before ${cutoff.toISOString()})`);
            
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            let deletedCount = 0;
            let totalSize = 0;
            
            for (const artifact of artifacts.data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < cutoff) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  console.log(`Deleted artifact: ${artifact.name} (ID: ${artifact.id})`);
                  deletedCount++;
                  totalSize += artifact.size_in_bytes || 0;
                } catch (error) {
                  console.log(`Failed to delete artifact ${artifact.name}: ${error.message}`);
                }
              }
            }
            
            const sizeMB = (totalSize / (1024 * 1024)).toFixed(2);
            console.log(`Cleanup completed: ${deletedCount} artifacts deleted, ${sizeMB} MB freed`);
            
            // 设置输出
            core.setOutput('deleted-count', deletedCount);
            core.setOutput('freed-size-mb', sizeMB);
