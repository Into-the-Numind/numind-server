name: Numind CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - release
      - product
      - '**'  # 触发所有分支的push事件

  pull_request:
    branches:
      - main
      - develop
      - release
      - product

env:
  REGISTRY: docker.io
  IMAGE_NAME: numind/numind-server
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

jobs:
  code_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.24.2

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -o ./bin/numind ./cmd/numind/main.go

      - name: Run tests
        run: go test -v ./...

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: numind-binary
          path: ./bin/numind

  image_build:
    needs: code_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/release' ||
      github.ref == 'refs/heads/product'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: numind-binary
          path: ./bin

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: ./Dockerfile

  deploy_dev:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: numind-binary
          path: ./bin

      - name: Deploy to Dev Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/deployment
            sudo systemctl stop numind-service
            cp /home/${{ env.DEPLOY_USER }}/numind /usr/local/bin/
            sudo systemctl start numind-service

  deploy_product:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/product'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: numind-binary
          path: ./bin

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/deployment
            sudo systemctl stop numind-service
            cp /home/${{ env.DEPLOY_USER }}/numind /usr/local/bin/
            sudo systemctl start numind-service
