name: Numind CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
    tags:
      - 'v*'
      - 'admin-v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      refresh_cache:
        description: '刷新 Docker 缓存（解决缓存问题）'
        type: boolean
        required: false
        default: false
      skip_cache:
        description: '跳过缓存（完全重新构建）'
        type: boolean
        required: false
        default: false

env:
  DOCKERHUB_USERNAME: pmtmyaggy
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  IMAGE_NAME: pmtmyaggy/numind-server
  DEV_HOST: ${{ secrets.DEV_HOST }}
  QA_HOST: ${{ secrets.QA_HOST }}
  PROD_HOST: ${{ secrets.PROD_HOST }}

jobs:
  # 变更检测（跳过无关构建，节省 CI 时间）
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.result.outputs.server }}
      admin: ${{ steps.result.outputs.admin }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'cmd/numind/**'
              - 'Dockerfile'
              - 'scripts/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'config_*.yaml'
            admin:
              - 'cmd/numind-admin/**'
              - 'Dockerfile.admin'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'

      - name: Resolve build decisions
        id: result
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "server=true" >> $GITHUB_OUTPUT
            echo "admin=true" >> $GITHUB_OUTPUT
            echo "::notice::🔨 Tag/手动触发，构建全部镜像"
          else
            echo "server=${{ steps.filter.outputs.server }}" >> $GITHUB_OUTPUT
            echo "admin=${{ steps.filter.outputs.admin }}" >> $GITHUB_OUTPUT
            echo "::notice::📂 server=${{ steps.filter.outputs.server }}, admin=${{ steps.filter.outputs.admin }}"
          fi

  # Docker 镜像构建
  image_build:
    needs: detect_changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    if: |
      needs.detect_changes.outputs.server == 'true' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/release' ||
       startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Compile check
        run: go build ./cmd/numind && go build ./cmd/numind-admin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Calculate Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BUILD_ENV="prod"
            IMAGE_TAG="${{ github.ref_name }}"
            echo "::notice::🚀 触发方式: TAG ($IMAGE_TAG)"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            BUILD_ENV="dev"
            IMAGE_TAG="develop"
            echo "::notice::🚀 触发方式: 分支 (develop)"
          elif [ "${{ github.ref_name }}" = "release" ]; then
            BUILD_ENV="qa"
            IMAGE_TAG="release"
            echo "::notice::🚀 触发方式: 分支 (release)"
          else
            BUILD_ENV="dev"
            IMAGE_TAG="dev"
          fi

          echo "build_env=$BUILD_ENV" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          TAGS="${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          TAGS="$TAGS,${{ env.IMAGE_NAME }}:$IMAGE_TAG-$SHORT_SHA"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up Docker cache
        id: cache-vars
        run: |
          REFRESH_CACHE="${{ github.event.inputs.refresh_cache }}"
          SKIP_CACHE="${{ github.event.inputs.skip_cache }}"

          if [ "$SKIP_CACHE" = "true" ]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
            echo "no_cache=true" >> $GITHUB_OUTPUT
            echo "::notice::⏭️  跳过缓存（完全重新构建）"
            exit 0
          fi

          BRANCH="${{ github.ref_name }}"
          GO_MOD_HASH=$(md5sum go.mod | cut -d' ' -f1 | cut -c1-8)

          if [ "$REFRESH_CACHE" = "true" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            CACHE_SCOPE="${BRANCH}_${GO_MOD_HASH}_${TIMESTAMP}"
          else
            CACHE_SCOPE="${BRANCH}_${GO_MOD_HASH}"
          fi

          echo "cache_scope=${CACHE_SCOPE}" >> $GITHUB_OUTPUT
          echo "go_mod_hash=${GO_MOD_HASH}" >> $GITHUB_OUTPUT
          echo "skip_cache=false" >> $GITHUB_OUTPUT
          echo "no_cache=false" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENV=${{ steps.meta.outputs.build_env }}
          labels: |
            git.commit=${{ github.sha }}
            git.branch=${{ github.ref_name }}
          no-cache: ${{ steps.cache-vars.outputs.no_cache == 'true' }}
          cache-from: |
            type=gha,scope=${{ steps.cache-vars.outputs.cache_scope }}
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=master
          cache-to: |
            type=gha,scope=${{ steps.cache-vars.outputs.cache_scope }},mode=min

  # 开发环境部署
  deploy_dev:
    needs: [image_build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEV_HOST }}
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            IMAGE="pmtmyaggy/numind-server:develop-${{ needs.image_build.outputs.short_sha }}"
            echo "${{ env.DOCKERHUB_PASSWORD }}" | docker login -u pmtmyaggy --password-stdin || true

            docker pull "$IMAGE" \
              || { echo "⚠️ Pull retry 1/2 (15s)..."; sleep 15; docker pull "$IMAGE"; } \
              || { echo "⚠️ Pull retry 2/2 (30s)..."; sleep 30; docker pull "$IMAGE"; }
            docker image prune -f || true

            docker stop numind-server-dev 2>/dev/null || true
            docker rm numind-server-dev 2>/dev/null || true

            docker network create numind-network 2>/dev/null || true
            sudo mkdir -p /opt/numind/dev/image/upload/{avatars,card,book}
            sudo mkdir -p /opt/numind/config/cert
            sudo chown -R 1001:1001 /opt/numind/dev || true
            sudo chown -R 1001:1001 /opt/numind/config || true
            sudo chmod -R 775 /opt/numind/dev
            sudo chmod -R 755 /opt/numind/config

            docker run -d \
              --name numind-server-dev \
              --network numind-network \
              -p 9091:9091 \
              -p 9092:9092 \
              -e APP_ENV=dev \
              -v /opt/numind/dev:/opt/numind/dev \
              -v /opt/numind/config/cert:/opt/numind/config/cert:ro \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              -v /opt/numind/model/model_cache:/app/model_cache \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --restart always \
              "$IMAGE"

            sleep 20
            if curl -sf http://localhost:9091/healthz > /dev/null 2>&1; then
              echo "✅ Dev 部署完成"
              docker ps -f name=numind-server-dev --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "❌ 健康检查失败"
              docker logs --tail 30 numind-server-dev || true
              exit 1
            fi

  # QA 环境部署
  deploy_qa:
    needs: [image_build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/release'
    environment: qa
    steps:
      - name: Deploy to QA Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.QA_HOST }}
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            IMAGE="pmtmyaggy/numind-server:release-${{ needs.image_build.outputs.short_sha }}"
            echo "${{ env.DOCKERHUB_PASSWORD }}" | docker login -u pmtmyaggy --password-stdin || true

            docker pull "$IMAGE" \
              || { echo "⚠️ Pull retry 1/2 (15s)..."; sleep 15; docker pull "$IMAGE"; } \
              || { echo "⚠️ Pull retry 2/2 (30s)..."; sleep 30; docker pull "$IMAGE"; }
            docker image prune -f || true

            docker stop numind-server-qa 2>/dev/null || true
            docker rm numind-server-qa 2>/dev/null || true

            docker network create numind-network 2>/dev/null || true
            sudo mkdir -p /opt/numind/qa/image/upload/{avatars,card,book}
            sudo mkdir -p /opt/numind/config/cert
            sudo chown -R 1001:1001 /opt/numind/qa || true
            sudo chown -R 1001:1001 /opt/numind/config || true
            sudo chmod -R 775 /opt/numind/qa
            sudo chmod -R 755 /opt/numind/config

            docker run -d \
              --name numind-server-qa \
              --network numind-network \
              -p 9093:9091 \
              -p 9094:9092 \
              -e APP_ENV=qa \
              -v /opt/numind/qa:/opt/numind/qa \
              -v /opt/numind/config/cert:/opt/numind/config/cert:ro \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              -v /opt/numind/model/model_cache:/app/model_cache \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --restart always \
              "$IMAGE"

            sleep 20
            if curl -sf http://localhost:9093/healthz > /dev/null 2>&1; then
              echo "✅ QA 部署完成"
              docker ps -f name=numind-server-qa --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "❌ 健康检查失败"
              docker logs --tail 30 numind-server-qa || true
              exit 1
            fi

  # 生产环境部署
  deploy_product:
    needs: [image_build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PROD_HOST }}
          username: root
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            IMAGE_TAG="${{ github.ref_name }}"
            NEW_IMAGE="pmtmyaggy/numind-server:$IMAGE_TAG"

            echo "${{ env.DOCKERHUB_PASSWORD }}" | docker login -u pmtmyaggy --password-stdin || true

            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' numind-server-prod 2>/dev/null || echo "")

            docker pull "$NEW_IMAGE" \
              || { echo "⚠️ Pull retry 1/2 (15s)..."; sleep 15; docker pull "$NEW_IMAGE"; } \
              || { echo "⚠️ Pull retry 2/2 (30s)..."; sleep 30; docker pull "$NEW_IMAGE"; }
            docker image prune -f || true

            docker network create numind-network 2>/dev/null || true
            sudo mkdir -p /opt/numind/prod/image/upload/{avatars,card,book}
            sudo mkdir -p /opt/numind/config/cert
            sudo chown -R 1001:1001 /opt/numind/prod || true
            sudo chown -R 1001:1001 /opt/numind/config || true
            sudo chmod -R 775 /opt/numind/prod
            sudo chmod -R 755 /opt/numind/config

            run_container() {
              docker run -d \
                --name numind-server-prod \
                --network numind-network \
                -p 9095:9091 \
                -p 9096:9092 \
                -e APP_ENV=prod \
                -v /opt/numind/prod:/opt/numind/prod \
                -v /opt/numind/config/cert:/opt/numind/config/cert:ro \
                -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
                -v /opt/numind/model/model_cache:/app/model_cache \
                --log-driver json-file \
                --log-opt max-size=20m \
                --log-opt max-file=5 \
                --restart always \
                "$1"
            }

            docker stop numind-server-prod 2>/dev/null || true
            docker rm numind-server-prod 2>/dev/null || true

            run_container "$NEW_IMAGE"

            sleep 20
            if curl -sf http://localhost:9095/healthz > /dev/null 2>&1; then
              echo "✅ Prod 部署完成 ($NEW_IMAGE)"
              docker ps -f name=numind-server-prod --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "❌ 健康检查失败"
              docker logs --tail 30 numind-server-prod || true

              if [ -n "$OLD_IMAGE" ]; then
                echo "🔄 回滚到 $OLD_IMAGE..."
                docker stop numind-server-prod 2>/dev/null || true
                docker rm numind-server-prod 2>/dev/null || true
                run_container "$OLD_IMAGE"

                sleep 20
                if curl -sf http://localhost:9095/healthz > /dev/null 2>&1; then
                  echo "⚠️ 回滚成功，旧版本已恢复运行"
                else
                  echo "❌ 回滚也失败了"
                fi
              fi
              exit 1
            fi

  # 后台管理系统 Docker 镜像构建
  admin_image_build:
    needs: detect_changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.admin-meta.outputs.image_tag }}
      short_sha: ${{ steps.admin-meta.outputs.short_sha }}
    if: |
      needs.detect_changes.outputs.admin == 'true' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/release' ||
       startsWith(github.ref, 'refs/tags/admin-v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Calculate Admin Metadata
        id: admin-meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BUILD_ENV="prod"
            IMAGE_TAG="${{ github.ref_name }}"
            echo "::notice::🚀 Admin 触发方式: TAG ($IMAGE_TAG)"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            BUILD_ENV="dev"
            IMAGE_TAG="admin-develop"
            echo "::notice::🚀 Admin 触发方式: 分支 (develop → admin-develop)"
          elif [ "${{ github.ref_name }}" = "release" ]; then
            BUILD_ENV="qa"
            IMAGE_TAG="admin-release"
            echo "::notice::🚀 Admin 触发方式: 分支 (release → admin-release)"
          else
            BUILD_ENV="dev"
            IMAGE_TAG="admin-dev"
          fi

          echo "build_env=$BUILD_ENV" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          TAGS="pmtmyaggy/numind-admin:$IMAGE_TAG"
          TAGS="$TAGS,pmtmyaggy/numind-admin:$IMAGE_TAG-$SHORT_SHA"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="$TAGS,pmtmyaggy/numind-admin:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push admin Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: ${{ steps.admin-meta.outputs.tags }}
          build-args: |
            ENV=${{ steps.admin-meta.outputs.build_env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 后台管理系统开发环境部署
  deploy_admin_dev:
    needs: admin_image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop'
    environment: admin-development
    steps:
      - name: Deploy Admin to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEV_HOST }}
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            IMAGE="pmtmyaggy/numind-admin:admin-develop-${{ needs.admin_image_build.outputs.short_sha }}"
            echo "${{ env.DOCKERHUB_PASSWORD }}" | docker login -u pmtmyaggy --password-stdin || true
            docker pull "$IMAGE" \
              || { echo "⚠️ Pull retry 1/2 (15s)..."; sleep 15; docker pull "$IMAGE"; } \
              || { echo "⚠️ Pull retry 2/2 (30s)..."; sleep 30; docker pull "$IMAGE"; }
            docker image prune -f || true

            docker stop numind-admin-server-dev 2>/dev/null || true
            docker rm numind-admin-server-dev 2>/dev/null || true

            docker network create numind-network 2>/dev/null || true

            docker run -d \
              --name numind-admin-server-dev \
              --network numind-network \
              -p 9099:9099 \
              -e APP_ENV=dev \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --restart always \
              "$IMAGE"

            sleep 10
            if curl -sf http://localhost:9099/healthz > /dev/null 2>&1; then
              echo "✅ Admin Dev 部署完成"
            else
              echo "⚠️ 健康检查未通过"
              docker logs --tail 10 numind-admin-server-dev || true
            fi

  # 后台管理系统 QA 环境部署
  deploy_admin_qa:
    needs: admin_image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/release'
    environment: admin-qa
    steps:
      - name: Deploy Admin to QA Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEV_HOST }}
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            IMAGE="pmtmyaggy/numind-admin:admin-release-${{ needs.admin_image_build.outputs.short_sha }}"
            echo "${{ env.DOCKERHUB_PASSWORD }}" | docker login -u pmtmyaggy --password-stdin || true
            docker pull "$IMAGE" \
              || { echo "⚠️ Pull retry 1/2 (15s)..."; sleep 15; docker pull "$IMAGE"; } \
              || { echo "⚠️ Pull retry 2/2 (30s)..."; sleep 30; docker pull "$IMAGE"; }
            docker image prune -f || true

            docker stop numind-admin-server-qa 2>/dev/null || true
            docker rm numind-admin-server-qa 2>/dev/null || true

            docker network create numind-network 2>/dev/null || true

            docker run -d \
              --name numind-admin-server-qa \
              --network numind-network \
              -p 9103:9099 \
              -e APP_ENV=qa \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --restart always \
              "$IMAGE"

            sleep 10
            if curl -sf http://localhost:9103/healthz > /dev/null 2>&1; then
              echo "✅ Admin QA 部署完成"
            else
              echo "⚠️ 健康检查未通过"
              docker logs --tail 10 numind-admin-server-qa || true
            fi

  # 后台管理系统生产环境部署
  deploy_admin_prod:
    needs: admin_image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/admin-v')
    environment: admin-production
    steps:
      - name: Deploy Admin to Production Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PROD_HOST }}
          username: root
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            IMAGE_TAG="${{ github.ref_name }}"
            NEW_IMAGE="pmtmyaggy/numind-admin:$IMAGE_TAG"

            echo "${{ env.DOCKERHUB_PASSWORD }}" | docker login -u pmtmyaggy --password-stdin || true

            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' numind-admin-server-prod 2>/dev/null || echo "")

            docker pull "$NEW_IMAGE" \
              || { echo "⚠️ Pull retry 1/2 (15s)..."; sleep 15; docker pull "$NEW_IMAGE"; } \
              || { echo "⚠️ Pull retry 2/2 (30s)..."; sleep 30; docker pull "$NEW_IMAGE"; }
            docker image prune -f || true

            docker network create numind-network 2>/dev/null || true

            run_admin() {
              docker run -d \
                --name numind-admin-server-prod \
                --network numind-network \
                -p 9104:9099 \
                -e APP_ENV=prod \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --restart always \
                "$1"
            }

            docker stop numind-admin-server-prod 2>/dev/null || true
            docker rm numind-admin-server-prod 2>/dev/null || true

            run_admin "$NEW_IMAGE"

            sleep 10
            if curl -sf http://localhost:9104/healthz > /dev/null 2>&1; then
              echo "✅ Admin Prod 部署完成 ($NEW_IMAGE)"
            else
              echo "❌ 健康检查失败"
              docker logs --tail 10 numind-admin-server-prod || true

              if [ -n "$OLD_IMAGE" ]; then
                echo "🔄 回滚到 $OLD_IMAGE..."
                docker stop numind-admin-server-prod 2>/dev/null || true
                docker rm numind-admin-server-prod 2>/dev/null || true
                run_admin "$OLD_IMAGE"

                sleep 10
                if curl -sf http://localhost:9104/healthz > /dev/null 2>&1; then
                  echo "⚠️ 回滚成功，旧版本已恢复运行"
                else
                  echo "❌ 回滚也失败了"
                fi
              fi
              exit 1
            fi
