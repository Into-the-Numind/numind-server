name: Numind CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
      - product
      - '**'  # 触发所有分支的push事件

  pull_request:
    branches:
      - main
      - develop
      - release
      - product

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: into-the-numind/numind-server
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEV_HOST: ${{ secrets.DEV_HOST }}
  QA_HOST: ${{ secrets.QA_HOST }}
  PROD_HOST: ${{ secrets.PROD_HOST }}

jobs:
  # 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.2
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: '3.x'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: task deps

      - name: Build (compile only)
        run: go build ./...

  # 代码构建
  code_build:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.2
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: '3.x'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: task deps

      - name: Build application
        run: task build-prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numind-binaries
          path: |
            ./bin/numind-linux-amd64
            ./bin/numind-darwin-amd64
            ./bin/numind-darwin-arm64
          retention-days: 30

      - name: Upload binary for deployment
        uses: actions/upload-artifact@v4
        with:
          name: numind-binary
          path: ./bin/numind-linux-amd64
          retention-days: 30

  # Docker 镜像构建 - 只在特定分支触发
  image_build:
    needs: code_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/product'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # 开发环境部署 - 只在 develop 分支触发
  deploy_dev:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
          password: Numind2025
          port: 22
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/into-the-numind/numind-server:develop
            docker stop numind-server || true
            docker rm numind-server || true
            docker run -d --name numind-server -p 9091:9091 --restart always ghcr.io/into-the-numind/numind-server:develop -c /app/config_dev.yaml

  # QA 环境部署 - 只在 release 分支触发
  deploy_qa:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    environment: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: numind-binary
          path: ./bin

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to QA Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 创建部署目录
            sudo mkdir -p /opt/numind
            sudo mkdir -p /opt/numind/logs
            sudo mkdir -p /opt/numind/config
            
            # 停止现有服务
            sudo systemctl stop numind-service || true
            
            # 备份当前版本
            if [ -f /opt/numind/numind ]; then
              sudo cp /opt/numind/numind /opt/numind/numind.backup.$(date +%Y%m%d_%H%M%S)
            fi
            
            # 复制新版本
            sudo cp /home/${{ secrets.DEPLOY_USER }}/numind /opt/numind/
            sudo chmod +x /opt/numind/numind
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} /opt/numind
            
            # 创建或更新 systemd 服务文件
            sudo tee /etc/systemd/system/numind-service.service > /dev/null <<EOF
            [Unit]
            Description=Numind Server
            After=network.target
            
            [Service]
            Type=simple
            User=${{ secrets.DEPLOY_USER }}
            WorkingDirectory=/opt/numind
            ExecStart=/opt/numind/numind
            Restart=always
            RestartSec=5
            Environment=ENVIRONMENT=qa
            Environment=PORT=8000
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # 重新加载 systemd 配置
            sudo systemctl daemon-reload
            
            # 启动服务
            sudo systemctl start numind-service
            sudo systemctl enable numind-service
            
            # 检查服务状态
            sudo systemctl status numind-service --no-pager
            
            # 等待服务启动
            sleep 10
            
            # 健康检查
            if curl -f http://localhost:8000/; then
              echo "QA deployment successful!"
            else
              echo "QA deployment failed - health check failed"
              exit 1
            fi

  # 生产环境部署 - 只在 product 分支触发
  deploy_product:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/product'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: numind-binary
          path: ./bin

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 创建部署目录
            sudo mkdir -p /opt/numind
            sudo mkdir -p /opt/numind/logs
            sudo mkdir -p /opt/numind/config
            
            # 停止现有服务
            sudo systemctl stop numind-service || true
            
            # 备份当前版本
            if [ -f /opt/numind/numind ]; then
              sudo cp /opt/numind/numind /opt/numind/numind.backup.$(date +%Y%m%d_%H%M%S)
            fi
            
            # 复制新版本
            sudo cp /home/${{ secrets.DEPLOY_USER }}/numind /opt/numind/
            sudo chmod +x /opt/numind/numind
            sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} /opt/numind
            
            # 创建或更新 systemd 服务文件
            sudo tee /etc/systemd/system/numind-service.service > /dev/null <<EOF
            [Unit]
            Description=Numind Server
            After=network.target
            
            [Service]
            Type=simple
            User=${{ secrets.DEPLOY_USER }}
            WorkingDirectory=/opt/numind
            ExecStart=/opt/numind/numind
            Restart=always
            RestartSec=5
            Environment=ENVIRONMENT=production
            Environment=PORT=8000
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # 重新加载 systemd 配置
            sudo systemctl daemon-reload
            
            # 启动服务
            sudo systemctl start numind-service
            sudo systemctl enable numind-service
            
            # 检查服务状态
            sudo systemctl status numind-service --no-pager
            
            # 等待服务启动
            sleep 10
            
            # 健康检查
            if curl -f http://localhost:8000/; then
              echo "Production deployment successful!"
            else
              echo "Production deployment failed - health check failed"
              exit 1
            fi
