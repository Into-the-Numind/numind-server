name: Numind CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
      - product
      - '**'
  pull_request:
    branches:
      - main
      - develop
      - release
      - product

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: into-the-numind/numind-server
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEV_HOST: ${{ secrets.DEV_HOST }}
  QA_HOST: ${{ secrets.QA_HOST }}
  PROD_HOST: ${{ secrets.PROD_HOST }}

jobs:
  # 代码构建
  code_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.2
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: '3.x'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: |
          go clean -modcache
          go mod download
          go mod tidy
          go mod verify

      - name: Debug - Check files and Go modules
        run: |
          echo "=== Checking Go version ==="
          go version
          echo "=== Checking Go modules ==="
          go mod graph | head -10
          echo "=== Checking book controller files ==="
          ls -la internal/numind/controller/v1/book/
          echo "=== Checking if SetCategory method exists ==="
          grep -r "SetCategory" internal/numind/controller/v1/book/ || echo "SetCategory not found in book controller"

      - name: Build (compile check)
        run: |
          go clean -cache
          go build -v ./internal/numind/controller/v1/book/
          go build -v ./internal/numind/
          go build ./...

      - name: Build application
        run: task build-prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numind-binaries
          path: |
            ./bin/numind-linux-amd64
            ./bin/numind-darwin-amd64
            ./bin/numind-darwin-arm64
          retention-days: 30

      - name: Upload binary for deployment
        uses: actions/upload-artifact@v4
        with:
          name: numind-binary
          path: ./bin/numind-linux-amd64
          retention-days: 30

  # Docker 镜像构建 - 只在特定分支触发
  image_build:
    needs: code_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/product'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # 开发环境部署 - 只在 develop 分支触发
  deploy_dev:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
          password: Numind2025
          port: 22
          script: |
            # 设置环境变量
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            
            # 登录到 GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            # 拉取最新镜像
            docker pull ghcr.io/into-the-numind/numind-server:develop
            
            # 检查并停止运行中的容器
            if docker ps -q -f name=numind-server | grep -q .; then
              echo "Container numind-server is running, stopping it..."
              docker stop numind-server
            fi
            
            # 检查并删除存在的容器
            if docker ps -aq -f name=numind-server | grep -q .; then
              echo "Container numind-server exists, removing it..."
              docker rm numind-server
            fi
            
            # 创建必要的目录并设置权限
            echo "Creating necessary directories..."
            sudo mkdir -p /opt/numind/image/upload/avatars
            sudo chmod -R 755 /opt/numind/image/upload
            sudo chown -R 1001:1001 /opt/numind/image/upload || true
            
            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name numind-server \
              -p 9091:9091 \
              -p 9092:9092 \
              -v /opt/numind:/opt/numind \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              --restart always \
              --health-cmd="curl -f http://localhost:9091/healthz || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              ghcr.io/into-the-numind/numind-server:develop \
              -c /app/config_dev.yaml
            
            # 等待容器启动
            echo "Waiting for container to start..."
            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server | grep -q .; then
              echo "Container started successfully!"
              
              # 等待健康检查通过
              echo "Waiting for health check..."
              timeout=90
              while [ $timeout -gt 0 ]; do
                # 检查Docker健康状态
                if docker inspect --format='{{.State.Health.Status}}' numind-server 2>/dev/null | grep -q "healthy"; then
                  echo "Docker health check passed!"
                  break
                fi
                
                # 检查HTTP健康端点
                if curl -f http://localhost:9091/healthz > /dev/null 2>&1; then
                  echo "HTTP health check passed!"
                  break
                fi
                
                echo "Health check failed, retrying in 5s... (${timeout}s remaining)"
                sleep 5
                timeout=$((timeout - 5))
              done
              
              if [ $timeout -le 0 ]; then
                echo "Warning: Health check timeout, but container is running"
                echo "Container logs:"
                docker logs --tail 20 numind-server || true
              else
                echo "Deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server || true
              exit 1
            fi

  # QA 环境部署 - 只在 release 分支触发
  deploy_qa:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    environment: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to QA Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 设置环境变量
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            
            # 登录到 GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            # 拉取最新镜像
            docker pull ghcr.io/into-the-numind/numind-server:release
            
            # 检查并停止运行中的容器
            if docker ps -q -f name=numind-server-qa | grep -q .; then
              echo "Container numind-server-qa is running, stopping it..."
              docker stop numind-server-qa
            fi
            
            # 检查并删除存在的容器
            if docker ps -aq -f name=numind-server-qa | grep -q .; then
              echo "Container numind-server-qa exists, removing it..."
              docker rm numind-server-qa
            fi
            
            # 创建必要的目录并设置权限
            echo "Creating necessary directories..."
            sudo mkdir -p /opt/numind/qa/image/upload/avatars
            sudo chmod -R 755 /opt/numind/qa/image/upload
            sudo chown -R 1001:1001 /opt/numind/qa/image/upload || true
            
            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name numind-server-qa \
              -p 8001:9091 \
              -p 8002:9092 \
              -v /opt/numind/qa:/opt/numind \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              --restart always \
              --health-cmd="curl -f http://localhost:9091/healthz || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              ghcr.io/into-the-numind/numind-server:release \
              -c /app/config_qa.yaml
            
            # 等待容器启动
            echo "Waiting for container to start..."
            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server-qa | grep -q .; then
              echo "Container started successfully!"
              
              # 等待健康检查通过
              echo "Waiting for health check..."
              timeout=90
              while [ $timeout -gt 0 ]; do
                # 检查Docker健康状态
                if docker inspect --format='{{.State.Health.Status}}' numind-server-qa 2>/dev/null | grep -q "healthy"; then
                  echo "Docker health check passed!"
                  break
                fi
                
                # 检查HTTP健康端点
                if curl -f http://localhost:8001/healthz > /dev/null 2>&1; then
                  echo "HTTP health check passed!"
                  break
                fi
                
                echo "Health check failed, retrying in 5s... (${timeout}s remaining)"
                sleep 5
                timeout=$((timeout - 5))
              done
              
              if [ $timeout -le 0 ]; then
                echo "Warning: Health check timeout, but container is running"
                echo "Container logs:"
                docker logs --tail 20 numind-server-qa || true
              else
                echo "QA deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server-qa --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-qa || true
              exit 1
            fi

  # 生产环境部署 - 只在 product 分支触发
  deploy_product:
    needs: image_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/product'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 设置环境变量
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            
            # 登录到 GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            # 拉取最新镜像
            docker pull ghcr.io/into-the-numind/numind-server:product
            
            # 检查并停止运行中的容器
            if docker ps -q -f name=numind-server-prod | grep -q .; then
              echo "Container numind-server-prod is running, stopping it..."
              docker stop numind-server-prod
            fi
            
            # 检查并删除存在的容器
            if docker ps -aq -f name=numind-server-prod | grep -q .; then
              echo "Container numind-server-prod exists, removing it..."
              docker rm numind-server-prod
            fi
            
            # 创建必要的目录并设置权限
            echo "Creating necessary directories..."
            sudo mkdir -p /opt/numind/prod/image/upload/avatars
            sudo chmod -R 755 /opt/numind/prod/image/upload
            sudo chown -R 1001:1001 /opt/numind/prod/image/upload || true
            
            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name numind-server-prod \
              -p 9091:9091 \
              -p 9092:9092 \
              -v /opt/numind/prod:/opt/numind \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              --restart always \
              --health-cmd="curl -f http://localhost:9091/healthz || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              ghcr.io/into-the-numind/numind-server:product \
              -c /app/config_prod.yaml
            
            # 等待容器启动
            echo "Waiting for container to start..."
            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server-prod | grep -q .; then
              echo "Container started successfully!"
              
              # 等待健康检查通过
              echo "Waiting for health check..."
              timeout=90
              while [ $timeout -gt 0 ]; do
                # 检查Docker健康状态
                if docker inspect --format='{{.State.Health.Status}}' numind-server-prod 2>/dev/null | grep -q "healthy"; then
                  echo "Docker health check passed!"
                  break
                fi
                
                # 检查HTTP健康端点
                if curl -f http://localhost:9091/healthz > /dev/null 2>&1; then
                  echo "HTTP health check passed!"
                  break
                fi
                
                echo "Health check failed, retrying in 5s... (${timeout}s remaining)"
                sleep 5
                timeout=$((timeout - 5))
              done
              
              if [ $timeout -le 0 ]; then
                echo "Warning: Health check timeout, but container is running"
                echo "Container logs:"
                docker logs --tail 20 numind-server-prod || true
              else
                echo "Production deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server-prod --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-prod || true
              exit 1
            fi
