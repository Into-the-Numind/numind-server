            sudo chmod -R 755 /opt/numind/qa/image/upload
            sudo chown -R 1001:1001 /opt/numind/qa/image/upload || true
            
            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name numind-server-qa \
              -p 9093:9091 \
              -p 9094:9092 \
              -v /opt/numind/qa:/opt/numind \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              --restart always \
              49.233.219.254:5000/numind-server:release \
              -c /app/config_qa.yaml
            
            # 等待容器启动
            echo "Waiting for container to start..."
            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server-qa | grep -q .; then
              echo "Container started successfully!"
              
                          # 等待容器启动并检查一次健康状态
            echo "Waiting for container to start and checking health..."
            sleep 10
            
            # 检查容器是否正在运行
            if docker ps -q -f name=numind-server-qa | grep -q .; then
              echo "Container is running, checking health endpoint..."
              
              # 尝试访问健康端点
              if curl -f http://localhost:9093/healthz > /dev/null 2>&1; then
                echo "Health check passed! QA deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server-qa --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              else
                echo "Warning: Health endpoint not responding, but container is running"
                echo "Container logs:"
                docker logs --tail 10 numind-server-qa || true
                echo "Container status:"
                docker ps -f name=numind-server-qa --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-qa || true
              exit 1
            fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-qa || true
              exit 1
            fi

  # 生产环境部署 - 只在 product 分支触发
  deploy_product:
    needs: image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/product'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
