            # 设置环境变量
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            
            # 配置Docker允许不安全的HTTP连接
            echo '{"insecure-registries": ["49.233.219.254:5000"]}' | sudo tee /etc/docker/daemon.json
            # 重新加载Docker守护进程配置并重启
            sudo systemctl daemon-reload
            sudo systemctl restart docker
            sleep 15
            # 验证insecure-registries配置是否生效
            echo "验证Docker insecure-registries配置..."
            docker info | grep "Insecure Registries" || echo "警告: insecure-registries配置可能未生效！"
            # 登录到本地Registry（HTTP）
            echo "$GHCR_TOKEN" | docker login 49.233.219.254:5000 -u "$GITHUB_ACTOR" --password-stdin
            
            # 拉取最新镜像
            docker pull 49.233.219.254:5000/numind-server:release
            
            # 检查并停止运行中的容器
            if docker ps -q -f name=numind-server-qa | grep -q .; then
              echo "Container numind-server-qa is running, stopping it..."
              docker stop numind-server-qa
            fi
            
            # 检查并删除存在的容器
            if docker ps -aq -f name=numind-server-qa | grep -q .; then
              echo "Container numind-server-qa exists, removing it..."
              docker rm numind-server-qa
            fi
            
            # 创建必要的目录并设置权限
