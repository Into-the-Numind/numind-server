name: Numind CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
      - product
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      # 允许修改CI/CD配置时触发构建
      # - '.github/**'
  pull_request:
    branches:
      - main
      - develop
      - release
      - product
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      # 允许修改CI/CD配置时触发构建
      # - '.github/**'

env:
  DOCKERHUB_USERNAME: neozhang96
  DOCKERHUB_PASSWORD: Docker1234
  IMAGE_NAME: neozhang96/numind-server
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEV_HOST: ${{ secrets.DEV_HOST }}
  QA_HOST: ${{ secrets.QA_HOST }}
  PROD_HOST: ${{ secrets.PROD_HOST }}

jobs:
  # 代码构建
  code_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Debug build trigger
        run: |
          echo "=== Build Trigger Information ==="
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "================================="

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.2
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: '3.x'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Force clean and reset
        run: |
          echo "=== Force cleaning all caches ==="
          go clean -modcache
          go clean -cache
          go clean -testcache
          rm -rf ~/.cache/go-build
          rm -rf ~/go/pkg/mod
          echo "=== Go environment ==="
          go env | grep -E "(GOOS|GOARCH|CGO|GOROOT|GOPATH)"

      - name: Setup Go environment
        run: |
          # 设置Go环境变量
          echo "=== Go环境配置 ==="
          go env -w CGO_ENABLED=1
          go env -w CC=gcc
          go env -w CXX=g++
          
          # 验证环境变量
          echo "CGO_ENABLED: $(go env CGO_ENABLED)"
          echo "CC: $(go env CC)"
          echo "CXX: $(go env CXX)"
          echo "================================"

      - name: Install GitHub CLI
        run: |
          echo "🔧 安装 GitHub CLI..."
          
          # 检查是否已安装
          if command -v gh &> /dev/null; then
            echo "✅ GitHub CLI 已安装: $(gh --version)"
          else
            echo "📦 安装 GitHub CLI..."
            
            # 添加 GitHub CLI 仓库
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            
            # 更新包列表并安装
            sudo apt-get update
            sudo apt-get install -y gh
            
            echo "✅ GitHub CLI 安装完成: $(gh --version)"
          fi
          
          # 配置 GitHub CLI 认证（使用 GITHUB_TOKEN）
          echo "🔐 配置 GitHub CLI 认证..."
          echo "${{ github.token }}" | gh auth login --with-token
          
          # 验证认证状态
          gh auth status || echo "⚠️  认证状态检查失败，但可能仍然可用"

      - name: Get dependencies
        run: |
          go clean -modcache
          go clean -cache
          go mod download
          go mod tidy
          go mod verify

      - name: Build application
        run: |
          # 显示构建环境信息
          echo "=== CI/CD 构建环境信息 ==="
          echo "操作系统: $(go env GOOS)"
          echo "架构: $(go env GOARCH)"
          echo "CGO: $(go env CGO_ENABLED)"
          echo "Go版本: $(go version)"
          echo "工作目录: $(pwd)"
          echo "================================"
          
          # 检查构建脚本是否存在
          if [ ! -f "scripts/ci-build.sh" ]; then
            echo "❌ CI构建脚本不存在: scripts/ci-build.sh"
            exit 1
          fi
          
          # 确保脚本有执行权限
          chmod +x scripts/ci-build.sh
          
          # 使用CI专用构建脚本
          echo "🚀 开始执行CI构建脚本..."
          ./scripts/ci-build.sh
          
          # 验证构建结果
          echo "=== 构建结果验证 ==="
          ls -la ./bin/
          
          # 检查关键文件
          if [ -f "./bin/numind-linux-amd64" ]; then
            echo "✅ 主要构建文件存在"
          else
            echo "❌ 主要构建文件不存在"
            exit 1
          fi
          
          echo "================================"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numind-binaries
          path: ./bin/numind-linux-amd64
          retention-days: 5  # 减少到5天

      - name: Upload binary for deployment
        uses: actions/upload-artifact@v4
        with:
          name: numind-binary
          path: ./bin/numind-linux-amd64
          retention-days: 2  # 减少到2天

      - name: Clean up old artifacts
        run: |
          echo "🧹 开始清理旧的构建产物..."
          
          # 检查 GitHub CLI 是否可用
          if command -v gh &> /dev/null; then
            echo "✅ GitHub CLI 可用，开始清理..."
            
            # 获取仓库信息
            REPO="${{ github.repository }}"
            echo "📦 清理仓库: $REPO"
            
            # 列出当前所有构建产物
            echo "📋 当前构建产物列表:"
            gh api repos/$REPO/actions/artifacts --jq '.artifacts[] | {id: .id, name: .name, created_at: .created_at, size: .size_in_bytes}' || true
            
            # 智能清理策略：保留最新的几个，删除旧的
            echo "🧠 执行智能清理策略..."
            
            # 清理 numind-binaries 产物：保留最新的2个，删除其余的
            echo "🧹 清理 numind-binaries 产物（保留最新2个）..."
            BINARIES_TO_KEEP=2
            BINARIES_COUNT=$(gh api repos/$REPO/actions/artifacts --jq '.artifacts[] | select(.name == "numind-binaries") | .id' | wc -l)
            
            if [ "$BINARIES_COUNT" -gt "$BINARIES_TO_KEEP" ]; then
              echo "📊 当前有 $BINARIES_COUNT 个产物，保留 $BINARIES_TO_KEEP 个"
              
              # 获取需要删除的产物ID（按创建时间排序，保留最新的）
              gh api repos/$REPO/actions/artifacts --jq '.artifacts[] | select(.name == "numind-binaries") | {id: .id, created_at: .created_at}' | \
                jq -s 'sort_by(.created_at) | reverse | .['$BINARIES_TO_KEEP':] | .[].id' | \
                while read -r artifact_id; do
                  if [ ! -z "$artifact_id" ] && [ "$artifact_id" != "null" ]; then
                    echo "🗑️  删除旧产物 ID: $artifact_id"
                    gh api repos/$REPO/actions/artifacts/$artifact_id -X DELETE || echo "⚠️  删除产物 $artifact_id 失败"
                  fi
                done
            else
              echo "✅ numind-binaries 产物数量在合理范围内，无需清理"
            fi
            
            # 清理 numind-binary 产物：保留最新的2个，删除其余的
            echo "🧹 清理 numind-binary 产物（保留最新2个）..."
            BINARY_TO_KEEP=2
            BINARY_COUNT=$(gh api repos/$REPO/actions/artifacts --jq '.artifacts[] | select(.name == "numind-binary") | .id' | wc -l)
            
            if [ "$BINARY_COUNT" -gt "$BINARY_TO_KEEP" ]; then
              echo "📊 当前有 $BINARY_COUNT 个产物，保留 $BINARY_TO_KEEP 个"
              
              # 获取需要删除的产物ID（按创建时间排序，保留最新的）
              gh api repos/$REPO/actions/artifacts --jq '.artifacts[] | select(.name == "numind-binary") | {id: .id, created_at: .created_at}' | \
                jq -s 'sort_by(.created_at) | reverse | .['$BINARY_TO_KEEP':] | .[].id' | \
                while read -r artifact_id; do
                  if [ ! -z "$artifact_id" ] && [ "$artifact_id" != "null" ]; then
                    echo "🗑️  删除旧产物 ID: $artifact_id"
                    gh api repos/$REPO/actions/artifacts/$artifact_id -X DELETE || echo "⚠️  删除产物 $artifact_id 失败"
                  fi
                done
            else
              echo "✅ numind-binary 产物数量在合理范围内，无需清理"
            fi
            
            echo "✅ 智能清理完成"
          else
            echo "⚠️  GitHub CLI 不可用，跳过自动清理"
            echo "💡 请手动清理旧的构建产物，或安装 GitHub CLI"
          fi
          
          # 显示清理后的存储使用情况
          echo "📊 清理完成后的存储状态:"
          if command -v gh &> /dev/null; then
            gh api repos/$REPO/actions/artifacts --jq '.artifacts | length' | xargs -I {} echo "当前构建产物数量: {}" || echo "无法获取存储状态"
            
            # 显示各类型产物的数量
            echo "📋 各类型产物统计:"
            gh api repos/$REPO/actions/artifacts --jq '.artifacts | group_by(.name) | map({name: .[0].name, count: length}) | .[] | "  \(.name): \(.count) 个"' || echo "无法获取产物统计"
          else
            echo "无法获取存储状态（GitHub CLI 不可用）"
          fi

  # Docker 镜像构建 - 只在特定分支触发
  image_build:
    needs: code_build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/product'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Login to Docker Hub
        run: |
          # 检查Docker环境
          echo "检查Docker环境..."
          docker --version
          docker info
          # 登录到Docker Hub
          echo ${{ env.DOCKERHUB_PASSWORD }} | docker login -u ${{ env.DOCKERHUB_USERNAME }} --password-stdin



      - name: Build and push Docker image
        run: |
          # 显示构建信息
          echo "构建镜像: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "当前分支: ${{ github.ref_name }}"
          # 构建镜像
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.ref_name }} .
          # 推送镜像
          docker push ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          # 推送latest标签
          docker tag ${{ env.IMAGE_NAME }}:${{ github.ref_name }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest

  # 开发环境部署 - 只在 develop 分支触发
  deploy_dev:
    needs: image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
          password: Numind2025
          port: 22
          script: |
            # 设置环境变量
            export GITHUB_ACTOR="${{ github.actor }}"
            
            # 登录到Docker Hub
            echo "Docker1234" | docker login -u neozhang96 --password-stdin
            
            # 拉取最新镜像
            docker pull neozhang96/numind-server:develop

            # 清理 dangling (<none>) 镜像，避免磁盘膨胀
            echo "Pruning dangling images..."
            docker image prune -f || true
            
            # 检查并停止运行中的容器
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container numind-server-dev is running, stopping it..."
              docker stop numind-server-dev
            fi
            
            # 检查并删除存在的容器
            if docker ps -aq -f name=numind-server-dev | grep -q .; then
              echo "Container numind-server-dev exists, removing it..."
              docker rm numind-server-dev
            fi
            
            # 创建必要的目录并设置权限（确保容器内 UID 1001 可写）
            echo "Creating necessary directories..."
            sudo mkdir -p /opt/numind/dev/image/upload/{avatars,card,book}
            sudo chown -R 1001:1001 /opt/numind/dev || true
            sudo chmod -R 775 /opt/numind/dev
            
            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name numind-server-dev \
              -p 9091:9091 \
              -p 9092:9092 \
              -v /opt/numind/dev:/opt/numind/dev \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              --restart always \
              neozhang96/numind-server:develop \
              -c /app/config_dev.yaml
            
            # 等待容器启动
            echo "Waiting for container to start..."
            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container started successfully!"
              
                          # 等待容器启动并检查一次健康状态
            echo "Waiting for container to start and checking health..."
            sleep 10
            
            # 检查容器是否正在运行
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container is running, checking health endpoint..."
              
              # 尝试访问健康端点
              if curl -f http://localhost:9091/healthz > /dev/null 2>&1; then
                echo "Health check passed! Deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server-dev --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              else
                echo "Warning: Health endpoint not responding, but container is running"
                echo "Container logs:"
                docker logs --tail 10 numind-server-dev || true
                echo "Container status:"
                docker ps -f name=numind-server-dev --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-dev || true
              exit 1
            fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-dev || true
              exit 1
            fi

