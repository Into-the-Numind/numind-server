name: Numind CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
      - admin-develop
      - admin-release
    tags:
      - 'v*'
      - 'admin-v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      # 允许修改CI/CD配置时触发构建
      # - '.github/**'
  pull_request:
    branches:
      - main
      - develop
      - release
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      # 允许修改CI/CD配置时触发构建
      # - '.github/**'

env:
  DOCKERHUB_USERNAME: neozhang96
  DOCKERHUB_PASSWORD: Docker1234
  IMAGE_NAME: neozhang96/numind-server
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEV_HOST: ${{ secrets.DEV_HOST }}
  QA_HOST: ${{ secrets.QA_HOST }}
  PROD_HOST: ${{ secrets.PROD_HOST }}

jobs:
  # Docker 镜像构建 - 在特定分支或 tag 时触发
  image_build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 增加超时时间，因为包含代码构建
    if: |
      github.ref == 'refs/heads/develop' || 
      github.ref == 'refs/heads/release' || 
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.2
          cache: false  # 禁用内置缓存，使用自定义缓存

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: '3.x'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Verify cache restoration
        run: |
          echo "🔍 验证缓存恢复状态..."
          if [ -d "$HOME/.cache/go-build" ]; then
            echo "✅ Go build cache 已恢复: $(du -sh $HOME/.cache/go-build | cut -f1)"
          else
            echo "ℹ️  Go build cache 未找到，将重新构建"
          fi
          
          if [ -d "$HOME/go/pkg/mod" ]; then
            echo "✅ Go modules cache 已恢复: $(du -sh $HOME/go/pkg/mod | cut -f1)"
          else
            echo "ℹ️  Go modules cache 未找到，将重新下载"
          fi

      - name: Install system dependencies
        run: |
          # 安装MuPDF开发库和运行时库（go-fitz依赖）
          echo "=== 安装系统依赖 ==="
          sudo apt-get update
          sudo apt-get install -y libmupdf-dev libmupdf1
          echo "✅ MuPDF开发库和运行时库安装完成"
          echo "================================"

      - name: Setup Go environment
        run: |
          # 设置Go环境变量
          echo "=== Go环境配置 ==="
          go env -w CGO_ENABLED=1
          go env -w CC=gcc
          go env -w CXX=g++
          
          # 验证环境变量
          echo "CGO_ENABLED: $(go env CGO_ENABLED)"
          echo "CC: $(go env CC)"
          echo "CXX: $(go env CXX)"
          echo "================================"

      - name: Get dependencies
        run: |
          go clean -modcache || true
          go clean -cache || true
          go mod download
          go mod tidy
          go mod verify

      - name: Build application
        run: |
          # 显示构建环境信息
          echo "=== CI/CD 构建环境信息 ==="
          echo "操作系统: $(go env GOOS)"
          echo "架构: $(go env GOARCH)"
          echo "CGO: $(go env CGO_ENABLED)"
          echo "Go版本: $(go version)"
          echo "工作目录: $(pwd)"
          echo "================================"
          
          # 创建输出目录
          mkdir -p ./bin
          
          # 直接构建 Linux 版本
          echo "🐧 开始构建 numind-linux-amd64..."
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o ./bin/numind-linux-amd64 \
            ./cmd/numind
          
          if [ $? -eq 0 ]; then
            echo "✅ Linux 版本构建成功"
          else
            echo "❌ Linux 版本构建失败"
            exit 1
          fi
          
          # 验证构建结果
          echo "=== 构建结果验证 ==="
          ls -la ./bin/
          
          # 检查文件大小
          file_size=$(stat -c%s "./bin/numind-linux-amd64" 2>/dev/null || echo "unknown")
          echo "📏 主要文件大小: $file_size bytes"
          
          # 检查文件类型
          file_type=$(file "./bin/numind-linux-amd64" 2>/dev/null || echo "unknown")
          echo "📋 文件类型: $file_type"
          
          echo "================================"

      - name: Login to Docker Hub
        run: |
          # 检查Docker环境
          echo "检查Docker环境..."
          docker --version
          docker info
          # 登录到Docker Hub
          echo "Docker1234" | docker login -u neozhang96 --password-stdin



      - name: Build and push Docker image
        run: |
          # 显示构建信息
          echo "构建镜像: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "当前分支: ${{ github.ref_name }}"
          
          # 根据分支或tag确定环境参数和镜像标签
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # 如果是 tag 触发
            BUILD_ENV="prod"
            IMAGE_TAG="${{ github.ref_name }}"
            echo "🚀 通过 TAG 触发构建: $IMAGE_TAG"
          else
            # 如果是分支触发
            if [ "${{ github.ref_name }}" = "develop" ]; then
              BUILD_ENV="dev"
              IMAGE_TAG="develop"
            elif [ "${{ github.ref_name }}" = "release" ]; then
              BUILD_ENV="qa"
              IMAGE_TAG="release"
            else
              BUILD_ENV="dev"
              IMAGE_TAG="dev"
            fi
            echo "🚀 通过分支触发构建: $IMAGE_TAG"
          fi
          
          echo "构建环境: $BUILD_ENV"
          echo "镜像标签: $IMAGE_TAG"
          
          # 验证配置文件内容
          echo "=== 验证配置文件内容 ==="
          if [ -f "config_${BUILD_ENV}.yaml" ]; then
            echo "✅ 配置文件存在: config_${BUILD_ENV}.yaml"
            echo "特殊渲染规则配置:"
            grep -A 10 "special_rules:" "config_${BUILD_ENV}.yaml" || echo "未找到special_rules配置"
          else
            echo "❌ 配置文件不存在: config_${BUILD_ENV}.yaml"
            echo "可用的配置文件:"
            ls -la config_*.yaml
          fi
          echo "================================"
          
          # 构建镜像 - 使用预构建的二进制文件，禁用缓存确保使用最新配置
          docker build --no-cache --build-arg ENV=$BUILD_ENV --build-arg BINARY_PATH=./bin/numind-linux-amd64 -t ${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          
          # 推送镜像
          docker push ${{ env.IMAGE_NAME }}:$IMAGE_TAG
          
          # 如果是 tag 构建，同时推送 latest 标签
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            docker tag ${{ env.IMAGE_NAME }}:$IMAGE_TAG ${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.IMAGE_NAME }}:latest
            echo "✅ 已推送 latest 标签"
          fi

      - name: Clean up old Docker images
        run: |
          echo "ℹ️  镜像存储在 Docker Hub 上，无需清理 GitHub Packages"
          echo "✅ Docker 镜像构建和推送完成"

  # 开发环境部署 - 只在 develop 分支触发
  deploy_dev:
    needs: image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
          password: Numind2025
          port: 22
          script: |
            # 设置环境变量
            export GITHUB_ACTOR="${{ github.actor }}"
            
            # 登录到Docker Hub
            echo "🔐 登录到Docker Hub..."
            echo "Docker1234" | docker login -u neozhang96 --password-stdin
            
            # 验证登录状态
            echo "✅ Docker登录状态验证:"
            docker system info | grep -A 5 "Registry" || echo "无法获取Registry信息"
            
            # 拉取最新镜像
            echo "📦 拉取最新镜像..."
            docker pull neozhang96/numind-server:develop
            
            # 验证镜像拉取成功
            echo "🔍 验证镜像信息..."
            docker images neozhang96/numind-server:develop --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}\t{{.Size}}"

            # 清理 dangling (<none>) 镜像，避免磁盘膨胀
            echo "Pruning dangling images..."
            docker image prune -f || true
            
            # 检查并停止运行中的容器
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container numind-server-dev is running, stopping it..."
              docker stop numind-server-dev
            fi
            
            # 检查并删除存在的容器
            if docker ps -aq -f name=numind-server-dev | grep -q .; then
              echo "Container numind-server-dev exists, removing it..."
              docker rm numind-server-dev
            fi
            
            # 创建必要的目录并设置权限（确保容器内 UID 1001 可写）
            echo "Creating necessary directories..."
            sudo mkdir -p /opt/numind/dev/image/upload/{avatars,card,book}
            sudo mkdir -p /opt/numind/config/cert
            sudo chown -R 1001:1001 /opt/numind/dev || true
            sudo chown -R 1001:1001 /opt/numind/config || true
            sudo chmod -R 775 /opt/numind/dev
            sudo chmod -R 755 /opt/numind/config
            
            # 检查证书文件是否存在
            if [ ! -f "/opt/numind/config/cert/apiclient_key.pem" ]; then
              echo "Warning: 微信支付私钥文件不存在: /opt/numind/config/cert/apiclient_key.pem"
              echo "请确保证书文件已正确放置到服务器上"
            fi
            
            if [ ! -f "/opt/numind/config/cert/wechatpay_cert.pem" ]; then
              echo "Warning: 微信支付证书文件不存在: /opt/numind/config/cert/wechatpay_cert.pem"
              echo "请确保证书文件已正确放置到服务器上"
            fi
            
            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name numind-server-dev \
              -p 9091:9091 \
              -p 9092:9092 \
              -e APP_ENV=dev \
              -v /opt/numind/dev:/opt/numind/dev \
              -v /opt/numind/config:/opt/numind/config:ro \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --restart always \
              neozhang96/numind-server:develop
            
            # 等待容器启动
            echo "Waiting for container to start..."
            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container started successfully!"
              
                          # 等待容器启动并检查一次健康状态
            echo "Waiting for container to start and checking health..."
            sleep 10
            
            # 检查容器是否正在运行
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container is running, checking health endpoint..."
              
              # 尝试访问健康端点
              if curl -f http://localhost:9091/healthz > /dev/null 2>&1; then
                echo "Health check passed! Deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server-dev --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              else
                echo "Warning: Health endpoint not responding, but container is running"
                echo "Container logs:"
                docker logs --tail 10 numind-server-dev || true
                echo "Container status:"
                docker ps -f name=numind-server-dev --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-dev || true
              exit 1
            fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-dev || true
              exit 1
            fi

