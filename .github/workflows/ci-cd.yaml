            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server-qa | grep -q .; then
              echo "Container started successfully!"
              
                          # 等待容器启动并检查一次健康状态
            echo "Waiting for container to start and checking health..."
            sleep 10
            
            # 检查容器是否正在运行
            if docker ps -q -f name=numind-server-qa | grep -q .; then
              echo "Container is running, checking health endpoint..."
              
              # 尝试访问健康端点
              if curl -f http://localhost:9093/healthz > /dev/null 2>&1; then
                echo "Health check passed! QA deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server-qa --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              else
                echo "Warning: Health endpoint not responding, but container is running"
                echo "Container logs:"
                docker logs --tail 10 numind-server-qa || true
                echo "Container status:"
                docker ps -f name=numind-server-qa --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
