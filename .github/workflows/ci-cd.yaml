name: Numind CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
      - product
      - '**'
  pull_request:
    branches:
      - main
      - develop
      - release
      - product

env:
  REGISTRY: 49.233.219.254:5000
  IMAGE_NAME: numind-server
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEV_HOST: ${{ secrets.DEV_HOST }}
  QA_HOST: ${{ secrets.QA_HOST }}
  PROD_HOST: ${{ secrets.PROD_HOST }}

jobs:
  # 代码构建
  code_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.2
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: '3.x'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Force clean and reset
        run: |
          echo "=== Force cleaning all caches ==="
          go clean -modcache
          go clean -cache
          go clean -testcache
          rm -rf ~/.cache/go-build
          rm -rf ~/go/pkg/mod
          echo "=== Go environment ==="
          go env | grep -E "(GOOS|GOARCH|CGO|GOROOT|GOPATH)"

      - name: Get dependencies
        run: |
          go clean -modcache
          go clean -cache
          go mod download
          go mod tidy
          go mod verify

      - name: Build (compile check)
        run: go build ./...

      - name: Build application
        run: task build-prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numind-binaries
          path: |
            ./bin/numind-linux-amd64
            ./bin/numind-darwin-amd64
            ./bin/numind-darwin-arm64
          retention-days: 30

      - name: Upload binary for deployment
        uses: actions/upload-artifact@v4
        with:
          name: numind-binary
          path: ./bin/numind-linux-amd64
          retention-days: 30

  # Docker 镜像构建 - 只在特定分支触发
  image_build:
    needs: code_build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/product'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
          buildkitd-flags: --allow-insecure-entitlement security.insecure --registry.insecure 49.233.219.254:5000

      - name: Configure Docker and Login
        run: |
          # 配置Docker允许不安全的HTTP连接
          echo '{"insecure-registries": ["49.233.219.254:5000"]}' | sudo tee /etc/docker/daemon.json
          # 重新加载Docker守护进程配置并重启
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          # 等待Docker重启
          sleep 15
          # 验证insecure-registries配置是否生效
          echo "验证Docker insecure-registries配置..."
          docker info | grep "Insecure Registries" || echo "警告: insecure-registries配置可能未生效！"
          # 测试Registry连接
          echo "测试Registry连接..."
          curl -f http://49.233.219.254:5000/v2/ || echo "Registry连接测试失败，继续执行..."
          # 登录到本地Registry（HTTP）
          echo ${{ secrets.GHCR_TOKEN }} | docker login 49.233.219.254:5000 -u ${{ github.actor }} --password-stdin
          # 强制配置Buildx使用HTTP
          echo "配置Buildx使用HTTP..."
          docker buildx create --use --name insecure-builder --driver docker-container --driver-opt network=host
          docker buildx inspect --bootstrap



      - name: Build and push Docker image
        run: |
          # 构建镜像
          docker build -t 49.233.219.254:5000/numind-server:${{ github.ref_name }} .
          # 推送镜像
          docker push 49.233.219.254:5000/numind-server:${{ github.ref_name }}
          # 推送latest标签
          docker tag 49.233.219.254:5000/numind-server:${{ github.ref_name }} 49.233.219.254:5000/numind-server:latest
          docker push 49.233.219.254:5000/numind-server:latest

  # 开发环境部署 - 只在 develop 分支触发
  deploy_dev:
    needs: image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
          password: Numind2025
          port: 22
          script: |
            # 设置环境变量
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            
            # 配置Docker允许不安全的HTTP连接
            echo '{"insecure-registries": ["49.233.219.254:5000"]}' | sudo tee /etc/docker/daemon.json
            # 重新加载Docker守护进程配置并重启
            sudo systemctl daemon-reload
            sudo systemctl restart docker
            sleep 15
            # 验证insecure-registries配置是否生效
            echo "验证Docker insecure-registries配置..."
            docker info | grep "Insecure Registries" || echo "警告: insecure-registries配置可能未生效！"
            # 登录到本地Registry（HTTP）
            echo "$GHCR_TOKEN" | docker login 49.233.219.254:5000 -u "$GITHUB_ACTOR" --password-stdin
            
            # 拉取最新镜像
            docker pull 49.233.219.254:5000/numind-server:develop
            
            # 检查并停止运行中的容器
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container numind-server-dev is running, stopping it..."
              docker stop numind-server-dev
            fi
            
            # 检查并删除存在的容器
            if docker ps -aq -f name=numind-server-dev | grep -q .; then
              echo "Container numind-server-dev exists, removing it..."
              docker rm numind-server-dev
            fi
            
            # 创建必要的目录并设置权限
            echo "Creating necessary directories..."
            sudo mkdir -p /opt/numind/dev/image/upload/avatars
            sudo chmod -R 755 /opt/numind/dev/image/upload
            sudo chown -R 1001:1001 /opt/numind/dev/image/upload || true
            
            # 启动新容器
            echo "Starting new container..."
            docker run -d \
              --name numind-server-dev \
              -p 9091:9091 \
              -p 9092:9092 \
              -v /opt/numind/dev:/opt/numind \
              -v /etc/ssl/certimate/youshu.asia:/etc/ssl/certimate/youshu.asia:ro \
              --restart always \
              49.233.219.254:5000/numind-server:develop \
              -c /app/config_dev.yaml
            
            # 等待容器启动
            echo "Waiting for container to start..."
            sleep 15
            
            # 检查容器状态
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container started successfully!"
              
                          # 等待容器启动并检查一次健康状态
            echo "Waiting for container to start and checking health..."
            sleep 10
            
            # 检查容器是否正在运行
            if docker ps -q -f name=numind-server-dev | grep -q .; then
              echo "Container is running, checking health endpoint..."
              
              # 尝试访问健康端点
              if curl -f http://localhost:9091/healthz > /dev/null 2>&1; then
                echo "Health check passed! Deployment completed successfully!"
                echo "Container status:"
                docker ps -f name=numind-server-dev --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              else
                echo "Warning: Health endpoint not responding, but container is running"
                echo "Container logs:"
                docker logs --tail 10 numind-server-dev || true
                echo "Container status:"
                docker ps -f name=numind-server-dev --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-dev || true
              exit 1
            fi
            else
              echo "Error: Container failed to start"
              docker logs numind-server-dev || true
              exit 1
            fi

  # QA 环境部署 - 只在 release 分支触发
  deploy_qa:
    needs: image_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/release'
    environment: qa
    steps:
      - name: Checkout code
