# AI提示词配置
ai_prompts:
  text_processing: |
    # 角色
    你是一位资深的内容编辑与信息架构师，擅长将原始文本重构为结构清晰、逻辑严密、可读性强的文章，并为其构思核心视觉概念。

    # 整体目标
    我将提供一段从图片中识别出的原始文本原始文本。你的任务是并行完成以下两项核心工作，并将两项工作的结果，合并为一个单一的、纯净的JSON对象作为最终输出。
        工作一：文本结构化（输出为Markdown格式）
        工作二：根据内容写一段文生图的提示词

    # 核心原则
    1.  忠于原文 : 用户的原始文本是核心和基础。
    2.  处理残缺内容:  当语句不完整或内容不连贯时，你需要进行逻辑补全，而非内容创作。 补充比例必须很小，且只能是基于上下文的、必要的逻辑连接。在进行必要的逻辑连接或补全时，必须使用最简短直接的措辞。避免任何不必要的阐述或发挥。
    3.  建立逻辑流: 为独立的文本块建立逻辑连接。如果无法建立自然流畅的联系，则使用`##`副标题来分隔主题。
    4.  忠于核心主旨: 所有的编辑和修改，都必须服务于更清晰、更忠实地呈现原文作者的核心意图。
    5.  杜绝无关信息: 清除原始文本中可能存在的广告、水印、页码、系统提示语等"噪音"。

    # 边缘情况处理规则
      * 主标题: 输出中必须有且仅有一个一级标题 (`#`)。原文无则必须根据核心内容生成。
      * 无明显结构: 若文本是连续的长篇大论，不要强行创造`##`副标题。
      * 无法理解: 若文本为无意义乱码，返回的JSON中`text`和`image_prompt`字段均为空字符串。

    # 格式定义与语义解释
      * `#` (一级标题): 全文灵魂，最高度的概括。
      * `##` (二级标题): 逻辑路标，用于标记明确的主题转换。
      * 普通段落: 内容的血肉，负责详细叙述。应尊重原文的段落划分。
      * `-` (列表): 用于展示逻辑上并列、地位平等的要点。
      * `>` (引用): 用于凸显"点睛之笔"，如核心结论或名言。此格式应谨慎使用，仅用于对全文理解至关重要的关键句。
        ⠀【重要】 你必须保持格式的纯净性，例如，不要使用### (三级标题)或其他非约定的Markdown语法。

    # 文生图提示词生成规则
      * 语言结构: 中文描述主体内容，末尾追加英文关键词提升画质和风格。
      * 目标画幅: 2:3的竖向构图。
      * 目标风格: 简洁插画风
      * 禁止项: 不能包含任何要求生成文字的指令。

    # 最终输出格式
    你的最终输出必须是一个**完整的、纯净的JSON对象**，包含`text`和`image_prompt`两个字段。`text`字段的值必须是一个包含了Markdown语法的、完整的字符串（换行请使用`\n`）。绝对不能在JSON之外添加任何解释性文字或代码块。

    以下是标准案例：
    ```json
    {
      "text": "# 为什么高价值的信息几乎从不流向普通人？\n因为信息价值越高，越考验人的理解能力，无法理解便等于"接收不到"。几年前，一个好友劝我去做知识付费，我随口问了句"什么是知识付费？"，他当时就无语了。\n## 高深内容需简化才能被大众接受\n经典因其简单才易于"传承"，但包裹着简单外壳的复杂信息，也很容易被误解。比如很多经典是用文言文写的，但老百姓更倾向于传奇故事和谚语。\n- 《道德经》中的"无为"被解读成"什么都不做"，而非"顺应自然而为"。\n- "以德报怨"被误解为"被人欺负要用爱心感化"，但孔子主张的是公正回应。\n- "人不为己，天诛地灭"被误解为自私自利，但"为"在此处指"修为"，意为不修身则天地不容。\n> 《论语》有云：有朋自远方来，不亦乐乎？",
      "image_prompt": "一个抽象的画面，无数发光的信息流像瀑布一样从上方涌下，但大部分都在半空中消散成迷雾，只有极少数几股精准地落入下方几个微小的人形轮廓中，简洁插画风, 2k, masterpiece"
    }
    ```

    # 待处理的OCR文本
  image_generation: "基于以下文本生成一张精美的配图：{content}"
  
# JSON处理配置 - 控制JSON响应解析和字符过滤行为
json_processing:
  # 字符过滤配置
  character_filtering:
    # 是否启用严格的控制字符过滤
    strict_control_chars: true
    # 是否启用扩展ASCII字符过滤
    filter_extended_ascii: true
    # 是否启用Unicode替换字符过滤
    filter_unicode_replacement: true
    # 允许的控制字符列表（除了换行符和制表符）
    allowed_control_chars: ["\n", "\t"]
    # 允许的Unicode范围
    allowed_unicode_ranges:
      # 中文字符范围
      chinese: [0x4E00, 0x9FFF]
      # 中文标点符号范围
      chinese_punctuation: [0x3000, 0x303F]
      # 全角字符范围
      fullwidth: [0xFF00, 0xFFEF]
      # 拉丁字母扩展范围
      latin_extended: 
        - [0x00C0, 0x00FF]
        - [0x0100, 0x017F]
        - [0x0180, 0x024F]
      # 阿拉伯文范围
      arabic: [0x0600, 0x06FF]
      # 西里尔文范围
      cyrillic: [0x0400, 0x04FF]
      # 希腊文范围
      greek: [0x0370, 0x03FF]
      # 希伯来文范围
      hebrew: [0x0590, 0x05FF]
      # 泰文范围
      thai: [0x0E00, 0x0E7F]
      # 韩文范围
      korean: [0xAC00, 0xD7AF]
      # 日文平假名范围
      japanese_hiragana: [0x3040, 0x309F]
      # 日文片假名范围
      japanese_katakana: [0x30A0, 0x30FF]
  
  # JSON修复配置
  json_repair:
    # 是否启用深度JSON修复
    enable_deep_repair: true
    # 是否启用字段优先提取
    enable_field_based_extraction: true
    # 是否启用保守修复策略
    enable_conservative_fix: true
    # 最大修复尝试次数
    max_repair_attempts: 3
    # 是否启用日志记录
    enable_logging: true
  
  # 响应处理配置
  response_processing:
    # 是否检查Content-Length
    check_content_length: true
    # 是否尝试恢复不完整响应
    enable_response_recovery: true
    # 响应超时时间
    timeout: "30s"
    # 最大响应大小（字节）
    max_response_size: 1048576  # 1MB

# HTML转换器配置 - 控制Markdown到HTML转换和内容分页的样式参数
html_converter:
  # 基础配置
  card:
    width: 1080          # 卡片宽度
    height: 1440         # 卡片高度
    padding: 60          # 内边距（与分页算法保持一致）
  
  # 分页配置
  pagination:
    available_width: 1000  # 可用宽度
    max_content_height: 1360  # 最大内容高度
    min_card_height: 800      # 最小卡片高度
    max_card_height: 4320     # 最大卡片高度
    min_bottom_padding: 40    # 最小底部留白，确保文字不被遮挡
  
  # 字体配置 - 清晰大字号风格
  fonts:
    family: "'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'Helvetica Neue', Arial, sans-serif"  # 字体系列
    title_size: 48       # 标题字体大小（大字号，加粗）
    subtitle_size: 40    # 副标题字体大小（大字号，加粗）
    body_size: 36        # 正文字体大小（大字号，清晰易读）
