# AI提示词配置
ai_prompts:
  text_processing: |
    # 角色
    资深内容策展编辑与视觉设计师，具备精准识别不同内容类型并采取差异化处理策略的卓越能力

    # 核心任务：内容甄别与差异化处理

    1.你必须严格遵循以下两步流程处理所有文本片段：

    ## 步骤一：内容甄别
    首先，通读并理解每一个文本段落，将其准确地归类为以下两种类型之一：
    - 类型1，纯净内容：提供事实、观点、知识或情感分享，不含任何商业推广意图的文本
    - 类型2，混合内容：将有价值的信息与具体的商业产品/品牌进行捆绑推广的文本（即"软广"）

    ## 步骤二：差异化处理
    根据上一步的甄别结果，对不同类型的内容执行完全不同的处理策略：

    - 针对1类的处理策略：【整理与保留】
        - 绝对禁止进行任何形式的总结、提炼或大规模改写
        - 唯一任务是最大程度地保留原文的结构、语句和作者的原意，只进行最基础的标点修正或排序。目标是100%忠于原文

    - 针对2类的处理策略：【提炼与转述】
        - 第一步（提炼）：识别出作者通过产品想要传达的、那个与产品本身无关的"核心理念"或"生活方式"。例如，从洗发水广告中提炼出"通过精致的日常仪式提升幸福感"的理念
        - 第二步（转述）：完全抛开原文中与产品相关的具体描述，用你自己的、流畅自然的语言，将提炼出的"核心理念"重新转述出来，使其成为一段普适性的、能引发共鸣的独立观点。目标是保留广告背後の思想火花，并使其上下文通顺、自然

    2. 诊断：分析处理完毕的片段的主题关联度，将其归类为以下两类之一：
        - 结构A：主题连贯
        - 结构B：主题发散

    3. 执行：根据诊断结果，严格执行对应路径

    ## 结构A：
    - 一级标题：提炼唯一的、精准的核心主题，作为唯一的`# 标题`
    - 内容：整合所有素材，撰写为逻辑连贯的单篇文章。使用`## 标题`划分内部层次。除了标题以外，需要保证每个段落的末尾有正确的标点，删除明显不合理的换行。重要：正文的开头不能再重复包含标题
    - 尊重原文语言：生成的语言应该和素材一致，如果原文为多语言，则保持每个部分对应的语言
    - 封面图提示词：基于统一主题，创作一个具体、生动、富有画面感的详细文生图提示词，并遵循下方"文生图规则"

    ## 结构B：
    - 一级标题：必须生成一个概括性标题作为唯一的`# 标题`
    - 内容：各独立主题分别成篇，严禁虚构逻辑联系。每个独立主题必须使用`## 标题`开启新板块。除了标题以外，需要保证每个段落的末尾有正确的标点，删除明显不合理的换行。重要：正文的开头不能再重复包含标题
    - 尊重原文语言：生成的语言应该和素材一致，如果原文为多语言，则保持每个部分对应的语言
    - 封面图提示词：基于主要内容，创作一个具体、生动、富有画面感的详细文生图提示词，并遵循下方"文生图规则"

    # "text"绝对规则
    1. 乱码处理：若文本为无意义乱码，返回的JSON中`text`为`上传内容有误`，`image_prompt`字段为空字符串
    2. 格式与结构规则：
        * 所有输出有且仅有一个`#`一级标题，且字数不超过25个字符
        * 只允许使用`#`、`##`、`-`、`>` 四种格式
        * 若文本内容是连续整体，无清晰主题转换，则不强行创造`##`副标题。若原文有明显的副标题格式则遵循使用`##`副标题
    3. 内容限制：严禁添加原文外的任何评论、摘要、索引、目录
    4. 输出格式：最终输出必须是且仅是一个纯净JSON对象，并且不要使用```符号进行包裹，也不要说明是JSON结构，直接从大括号"{"开始生成
    5. 以下是JSON结构：
    {
      "text": "此处放入严格遵循路径和规则生成的Markdown字符串",
      "image_prompt": "此处放入遵循文生图规则生成的提示词"
    }
    
    ## "image_prompt"规则
    - 构图要求：
        -   目标画幅： 4:5竖向构图
        -   目标风格： Expressive post-impressionist style with thick impasto brushstrokes and dynamic, emotional energy, reminiscent of Van Gogh’s style
        -   目标色调： 不限于任何颜色，但要适合文字内容，并且颜色搭配要协调
        -   语言结构： 中文描述详细的主体内容，末尾追加英文关键词提升画质和风格（例如：4:5, Expressive post-impressionist style with thick impasto brushstrokes and dynamic, emotional energy, reminiscent of Van Gogh’s style, masterpiece, high detail）。你不需要和示例一模一样，示例仅为参考
        -   禁止项： 不能包含任何要求生成文字的指令


    # 待处理的文本片段：{content}

  image_generation: "基于以下文本生成一张精美的配图：{content}"

# JSON处理配置 - 控制JSON响应解析和字符过滤行为
json_processing:
  # 字符过滤配置
  character_filtering:
    # 是否启用严格的控制字符过滤
    strict_control_chars: true
    # 是否启用扩展ASCII字符过滤
    filter_extended_ascii: true
    # 是否启用Unicode替换字符过滤
    filter_unicode_replacement: true
    # 允许的控制字符列表（除了换行符和制表符）
    allowed_control_chars: ["\n", "\t"]
    # 允许的Unicode范围
    allowed_unicode_ranges:
    # 中文字符范围
    chinese: [0x4E00, 0x9FFF]
    # 中文标点符号范围
    chinese_punctuation: [0x3000, 0x303F]
    # 全角字符范围
    fullwidth: [0xFF00, 0xFFEF]
    # 拉丁字母扩展范围
    latin_extended:
      - [0x00C0, 0x00FF]
      - [0x0100, 0x017F]
      - [0x0180, 0x024F]
    # 阿拉伯文范围
    arabic: [0x0600, 0x06FF]
    # 西里尔文范围
    cyrillic: [0x0400, 0x04FF]
    # 希腊文范围
    greek: [0x0370, 0x03FF]
    # 希伯来文范围
    hebrew: [0x0590, 0x05FF]
    # 泰文范围
    thai: [0x0E00, 0x0E7F]
    # 韩文范围
    korean: [0xAC00, 0xD7AF]
    # 日文平假名范围
    japanese_hiragana: [0x3040, 0x309F]
    # 日文片假名范围
    japanese_katakana: [0x30A0, 0x30FF]

  # JSON修复配置
  json_repair:
    # 是否启用深度JSON修复
    enable_deep_repair: true
    # 是否启用字段优先提取
    enable_field_based_extraction: true
    # 是否启用保守修复策略
    enable_conservative_fix: true
    # 最大修复尝试次数
    max_repair_attempts: 3
    # 是否启用日志记录
    enable_logging: true

  # 响应处理配置
  response_processing:
    # 是否检查Content-Length
    check_content_length: true
    # 是否尝试恢复不完整响应
    enable_response_recovery: true
    # 响应超时时间
    timeout: "30s"
    # 最大响应大小（字节）
    max_response_size: 1048576  # 1MB

# HTML转换器配置 - 控制Markdown到HTML转换和内容分页的样式参数
html_converter:
  # 基础配置
  card:
    width: 1080          # 卡片宽度
    height: 1440         # 卡片高度
    padding: 40          # 内边距（与分页算法保持一致）

  # 分页配置
  pagination:
    available_width: 900  # 可用宽度
    max_content_height: 1400  # 最大内容高度
    min_card_height: 800      # 最小卡片高度
    max_card_height: 4320     # 最大卡片高度
    min_bottom_padding: 40    # 最小底部留白，确保文字不被遮挡

  # 字体配置 - 清晰大字号风格
  fonts:
    family: "'DianziJianSong', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'Helvetica Neue', Arial, sans-serif"  # 字体系列
    title_size: 70       # 标题字体大小（大字号，加粗）
    subtitle_size: 45    # 副标题字体大小（大字号，加粗）
    body_size: 45        # 正文字体大小（大字号，清晰易读）
    list_size: 45        # 列表字体大小
    quote_size: 45       # 引用字体大小

  # 行高配置 - 提升可读性
  line_heights:
    title: 1.5           # 标题行高倍数
    subtitle: 1.5        # 副标题行高倍数
    body: 1.8            # 正文行高倍数（增大行高，提升可读性）

# 渲染器配置
renderer:
  width: 1080            # 渲染器宽度
  height: 1440           # 渲染器高度
  quality: 85            # 图片质量（1-100）
  format: "webp"         # 图片格式
  zoom: 1.0              # 缩放比例
  timeout_seconds: 30    # 超时时间（秒）

# GSE分词库配置
gse:
  enabled: false         # 是否启用GSE分词功能（默认关闭，避免启动时加载字典）

  # 边距配置 - 优化间距
  margins:
    title_bottom: 20     # 标题下边距（增加间距）
    subtitle_bottom: 15  # 副标题下边距
    body_bottom: 20      # 正文下边距（增加间距）
