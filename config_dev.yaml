# Agent 沙箱配置（#4 sandbox-integration）
# backend: disabled = no-op pool（prod 默认，相当于 #3 stub 行为）
# backend: docker   = 真实 Docker pool（仅 dev，需要容器内有 docker CLI + /var/run/docker.sock bind mount）
sandbox:
  backend: docker
  pool_min: 5
  pool_max_wait_ms: 30000
  # Skill sandbox image: python:3.11-slim base + office libs (python-pptx, openpyxl,
  # python-docx, weasyprint, reportlab, pandas, Pillow, matplotlib) baked in. Required
  # for invoke_skill (pptx/docx/xlsx/pdf) — plain python:3.11-slim lacks these libs so
  # skills failed at import. Built+pushed via scripts/docker/skill-image/build.sh --push.
  # v1.5.2: +pandoc（document-system 导出 md→docx / md→pdf via --pdf-engine=weasyprint）。
  image_tag: ccr.ccs.tencentyun.com/youshunumind/sandbox-skill:skills-v1.5.3
  memory_limit_mb: 512
  cpu_quota: 1.0
  pids_limit: 64
  timeout_seconds: 30
  session_timeout_seconds: 300
  network_policy: none
  workdir_size_mb: 512
  read_only_rootfs: true
  user_spec: "1000:1000"
  capabilities:
    - NET_BIND_SERVICE
  apparmor_profile: docker-default
  seccomp_profile: seccomp.json
  # Track 4: Skill / invoke_skill extensions
  skills_root: "/app/skills"                # 镜像内置 skills 根目录（COPY 至镜像，随版本绑定）
  skills_enabled: true                      # invoke_skill 总开关（prod 默认 false，dev 为 true）
  output_max_size_mb: 50                    # 单个输出文件大小上限 (hard cap=50MB)
  output_zip_bomb_threshold_mb: 500         # zip 展开大小告警阈值 (hard-coded)
  cos_upload_concurrency: 3                 # CollectOutputs 上传 COS 并发数

# Agent Memory 配置（V1.5 板块 3）
agent:
  # 权限 pipeline 总开关（remove-permission-backdoor hotfix 2026-06-02）。
  # true（默认）= 所有环境跑真实 7-validator pipeline；false = 全局 force-allow（高危逃生舱，仅受控排障）。
  # 取代旧 flag.Lookup("test.v") 环境嗅探后门（commit 14754a39）。
  # 注：prod 靠后端 viper.SetDefault("agent.permission.enforce", true) 兜底，config_prod.yaml 无需声明。
  permission:
    enforce: true
    # 软拦截（agent-security-hardening）：命中 deny 只挡这一次工具调用 + 喂回 LLM 续循环（非整 run 终止）。
    # enabled=false 退回硬终止（高危逃生舱）。三阈值=防呆：同(工具+输入)连续 / 任意连续(成功清零) / 同指纹整 run 累计。
    # prod 靠 viper.SetDefault 兜底，config_prod.yaml 无需声明。
    soft_deny:
      enabled: true
      max_same_consecutive: 3
      max_total_consecutive: 5
      max_lifetime_per_fingerprint: 10
  memory:
    # Task 3.1: AGENT.md 2 级 cascade loader（部署级 + 用户全局）
    # 路径 3-6（workspace 维度）V1.5 不实施，等 V2 扩展。
    agent_md:
      enabled: true
      etc_dir: "/etc/numind"                # 部署级路径根
      user_data_dir: "/opt/numind/dev/user_files"  # 拼接 users/<user_id>/AGENT.md
      max_per_file_chars: 12288             # 12KB，单文件上限
      max_total_chars: 51200                # 50KB，所有文件合计上限
    # Task 3.6: trivial 短路 + Cadence 控制（dialectic 节流）
    dialectic_cooldown_seconds: 300         # 5 min — 同用户 dialectic 最小重跑间隔
    dialectic_max_cooldown_seconds: 1800    # 30 min — 兜底重跑（防 insight 过老）
    dialectic_min_new_facts: 3              # cooldown 内有 ≥3 新 fact 时立即重跑
    trivial_max_chars: 8                    # 全 emoji 短串判 trivial 的上限（rune 数）
    # Task 3.7: Layer A dialectic LLM-call tunables
    # D4：用 qwen-plus / deepseek-v3-2，不要 thinking model（DB Registry 配路由）
    dialectic_top_facts_limit: 20           # 候选 fact 上限（importance DESC 排序后取前 N）
    dialectic_max_output_tokens: 600        # LLM 输出上限（300-500 字中文 ≈ 450-750 tokens）
    dialectic_temperature: 0.4              # 略稳定（不发散）但保留推理弹性
    dialectic_call_timeout_seconds: 30      # LLM 调用 wall-clock 上限（qwen-plus 平均 4-8s）
    # Task 3.8: 分层时间感知 (4 cron jobs + per-turn temporal injection)
    digest:
      enabled: true                         # dev 跑 cron — 验证 4 个 job 调度 + Redis lock
      timezone: "Asia/Shanghai"
      daily_cron: "0 0 4 * * *"
      weekly_cron: "0 30 4 * * 1"
      monthly_cron: "0 30 4 1 * *"
      quarterly_cron: "0 30 4 1 1,4,7,10 *"
      worker_concurrency: 20
      redis_lock_ttl_seconds: 3600
      per_user_timeout_seconds: 120
      max_output_tokens: 800
      temperature: 0.3
      call_timeout_seconds: 30

# SOP 流式执行健壮性超时（问题 2）。未配置时代码兜底 4m / 30m（含 prod，prod 配置不在此改）。
sop:
  stream_idle_timeout: 4m       # 连续多久无新数据视为卡死（idle 超时），到点掐掉流
  stream_overall_timeout: 30m   # 单次流式生成整体上限（context deadline 兜底，非 http 超时，不误杀正常长流）
