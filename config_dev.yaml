# 开发环境
# 通用配置
runmode: debug               # Gin 开发模式, 可选值有：debug, release, test
addr: :9091                  # HTTP 服务器监听地址

# Feature flags（默认 OFF；prod 不设此段 → 自动 OFF）
features:
  notification_center:
    enabled: true             # 通知中心（铃铛 + 公告/问卷），dev 开启
  document_system:
    enabled: true             # 文档系统 v1（agent 产物在线编辑/导出），dev 开启
  meeting_copilot:
    enabled: true             # 会议副驾（实时转写 + 反馈 + AI 纪要），内部试用，dev 开启
  meeting_diarization:
    enabled: true             # 会议说话人分离（声纹引擎），dev 开启；effective = meeting_copilot.enabled && meeting_diarization.enabled
  chatbot_query_rewrite:
    enabled: false            # ③ chatbot 查询改写：iDriveCareer 真实数据评估证明"提召回的改写会破坏库外拒答"，结论=不上。dev 也关掉与结论一致（prod 本就 OFF）。
  rag_eval:
    enabled: true             # rag-eval 检索调试端点（/v1/admin/rag-eval/retrieve），admin-only 评估工具，dev 开启；prod 默认 OFF（不暴露 debug 端点）
  universal_rewriter:
    enabled: false            # 通用查询改写器。2026-06-19 A/B 实测：在切好的块上改写器无叠加增益（±4pp 噪声内）→ 保持关。见 docs/plans/2026-06-20-rag-upgrade-master-plan.md。
  answerability_gate:
    enabled: true             # 可答性门（RAG 升级项5；资料答不了就拒答，与阈值解耦）。项1结构感知切块已上线=前提满足，dev 开启验证（与 kb_fallback 组合：门拒答致空→兜底优雅处理）。prod 不配=OFF=放行(fail-open)。仍须 harness A/B 确认 in-KB 不误拒/oob 拒答率。
  structure_aware_chunking:
    enabled: true             # 结构感知切块器（RAG 升级项1，地基）：FAQ→问答对/观点→单条/案例→单案例/通用→按节小块+标题面包屑。dev 开启验证；prod 不配=OFF。仅影响新入库/重灌文档（旧 chunk 不变，需 reindex 生效）。
  hybrid_retrieval:
    enabled: true             # 混合检索（RAG 升级项2）：dense + BM25(FTS5,jieba) + RRF 融合，命中产品码/精确措辞。dev 开启验证；prod 不配=OFF。须 sqlite_fts5 构建标签 + 文档重灌/新上传才有 BM25 数据（FTS5 缺失或空索引自动降级纯 dense）。
  rerank_hardening:
    enabled: true             # 重排硬化（RAG 升级项3）：rerank 输入 passage 去噪 + MMR-lite 去雷同 + 降级链(0结果阈值×0.7重试/top-1 floor≥0.15)。dev 开启验证；prod 不配=OFF（关=重排逐位维持现状）。复合分/每库校准阈值后续迭代。
  kb_fallback:
    enabled: true             # KB 优雅兜底（RAG 升级项5）：检索为空时把"库里有什么+如实拒答"指令注入答案 prompt，不编造不死板拒答。dev 开启验证；prod 不配=OFF。与 answerability_gate 组合。
  doc2query:
    enabled: true             # doc2query（RAG 升级项4，破情境教练类天花板）：ingest 期给每块 LLM 生成"可回答的问题"追加进 EmbedText 一起嵌入，桥接情境提问↔答案片段字面鸿沟。dev 开启验证；prod 不配=OFF。仅影响新入库/重灌文档；每块一次 v4-flash 调用(userID=0 公司成本不扣用户)。
  provider_prompt_cache:
    enabled: true             # 供应商原生 prompt 缓存（Claude ephemeral / Gemini implicit）全局开关，dev 开启验证；prod 默认 OFF（不配=false）
  feishu_integration:
    enabled: true             # 飞书集成（per-user 自建应用 + OAuth + agent 工具），dev 开启验证；prod 不配=OFF

# 后台管理系统配置
admin:
  addr: :9099                # 后台管理系统监听地址

jwt:
  secret: Rtg8BPKNEf2mB4mgvKONGPZZQSaJWNLijxR42qRgq0iBb5 # JWT 签发密钥
  expire-hours: 24 # JWT 过期时间，单位：小时

# 安全密钥（feishu-integration）。两把独立密钥（泄露隔离）：
#   thirdparty_token_key —— AES-256-GCM 加密第三方凭据（飞书 user_access_token / app_secret），32 字节 base64。
#   feishu_state_key     —— HMAC-SHA256 签 OAuth callback 的 state（防 CSRF/重放），独立于上面的加密密钥。
# 禁硬编码进业务代码、禁进 config_prod.yaml（prod 由运维另注）。缺失/非法 → 启动 fail-fast。
security:
  thirdparty_token_key: ADelMwutNZ6zrhIsxW9k7h5Ht29YHyQI0I6ib60jnpM=
  feishu_state_key: HfG9iLmTU+6sj32w1iP6aq6zlKG8UW6+AegZIXISuKQ=

# 飞书集成（feishu-integration T7）。OAuth/连接服务的环境相关 URL + scope。
#   web_base_url —— 前端 base，callback 成功/失败后 302 回 ${web_base_url}/settings/connections。
#   redirect_uri —— 注册到飞书开放平台「重定向 URL 白名单」的 callback 地址（须与对外路径一致）。
#   authorize_url / scopes 留空时用代码默认（authen/v1/authorize + 首批全部 scope）。
# dev 走 youshu.asia/dev 反代（与 payment notify_url 同前缀）；端到端验证须先在飞书后台把
# redirect_uri 加进重定向白名单（见 plan S5 前置环境）。
feishu:
  web_base_url: "https://youshu.asia/dev"
  redirect_uri: "https://youshu.asia/dev/api/v1/feishu/oauth/callback"
  # authorize_url: ""   # 留空=默认 https://open.feishu.cn/open-apis/authen/v1/authorize
  # scopes: ""          # 留空=默认 "docx:document im:message bitable:app:readonly"

# MySQL 数据库相关配置
db:
  host: numind-mysql-dev:3306  # MySQL 机器 IP 和端口，连接服务器A本地MySQL
  username: root # MySQL 用户名(建议授权最小权限集)
  password: Numind2025 # MySQL 用户密码
  database: numind-dev # miniblog 系统所用的数据库名
  max-idle-connections: 100 # MySQL 最大空闲连接数，默认 100
  max-open-connections: 100 # MySQL 最大打开的连接数，默认 100
  max-connection-life-time: 10s # 空闲连接最大存活时间，默认 10s
  log-level: 4 # GORM log level, 1: silent, 2:error, 3:warn, 4:info

# 日志配置
log:
  disable-caller: false # 是否开启 caller，如果开启会在日志中显示调用日志所在的文件和行号
  disable-stacktrace: false # 是否禁止在 panic 及以上级别打印堆栈信息
  level: debug # 指定日志级别，可选值：debug, info, warn, error, dpanic, panic, fatal
  format: console # 指定日志显示格式，可选值：console, json
  output-paths: [./numind.log, stdout] # 指定日志输出位置，多个输出，用 `逗号 + 空格` 分开。stdout：标准输出，

