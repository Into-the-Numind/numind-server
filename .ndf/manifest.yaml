  description: 'Customer 上报 SOP 串步（2 次独立上报）：运行第 N 步, AI 产出第 N-1 步内容, 深度思考明确提到第 N-1 步指令。上次 session 误诊为压缩排序(sop-context-ordering-fix, 已部署 dev 未上 prod)——但 prod 取证证明 SOP 从不压缩(context_budget_event 30 天 0 个 compressed, 最大估算 96k tokens vs safe budget 835k)→压缩修复不可能是本 bug 起因。真因: Gateway 路径(executeViaGateway, prod 当 modelKey!="" 即用户选模型时走)把当前节点指令 node.Prompt 提升为顶部 system 消息, 当前输入作为末尾裸 user 消息; 而历史(sop.go:664-677)把每个前序步骤拼为 "nodePrompt+input"(含 "你现在切换为【X】" 角色切换指令)+其 assistant 输出。当前指令在最顶部远离生成点, 生成点前最近的指令是第 N-1 步的 persona-switch→模型间歇性遵从历史里最近的指令而串步。Legacy 路径(ExecuteNodeStreamWithThinking)无此 bug: 它把 node.Prompt+input 拼成末尾 user 消息(指令紧贴输入)。prod 复现确认: run 3039/node-run 8896 sort=3 创作节点产出 sort=2 爆款拆解(context_budget_event 2710 status=ok 21k/835k 无压缩; 实际模型 deepseek-v4-pro≠节点配置 deepseek-v3-2-251201 证 modelKey!="" 走 Gateway)。修=Gateway 节点执行(input!="")把 node.Prompt 并入末尾 user 消息(对齐 legacy); chat 场景(input=="")保留 system 不变。'
