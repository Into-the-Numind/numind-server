  description: '上次 agent-stream-tool-calls-pipeline hotfix 让 reasoning_delta + token_delta + tool_call_start events 都通了 SSE，但 user 报 "已运行 N 步后 UI 卡住"。完整 SSE 流：reasoning(29) + token_delta(30) + tool_call_start(1) + step_done(stop_reason=tool_calls) + terminal(step_count=1)，**0 个 tool_call_result**。Root cause 在 eino 的 default StreamToolCallChecker (react.go:218 firstChunkStreamToolCallChecker)：只看 stream 第一个非空 chunk，若是 content text 直接 return false → graph 走 END 跳过 tools node → react.Agent.Stream 在 emit 完 LLM call 后立刻 terminate，不 dispatch tool。Eino 自己文档(react.go:177)承认 "default does not work well with Claude, which typically outputs tool calls after text content" — deepseek-v4-pro thinking 模型同样行为。修复：在 react.AgentConfig 加 custom StreamToolCallChecker 扫整个 stream 找 ToolCalls 再决定 branch。'
