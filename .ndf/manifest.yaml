- id: deploy-container-name-conflict
  ndf_version: '3.0'
  description: 'Hotfix — scripts/cicd/deploy-remote.sh (三仓库近一致) 在 `docker run` 步骤可 exit 125 "Conflict. The container name /<name> is already in use"，尽管前面已 `docker stop` + `docker rm`（均无 -f）。2026-06-02 部署 numind-web-v3 到 dev 观测：deploy 报 exit 125 名字冲突，但容器最终 Up+healthy 跑在新镜像（develop-3521366，digest 已核）——终态正确但脚本返回失败，是良性但误导的竞态，且 prod 上 spurious failure 可能触发不必要 rollback。根因：容器 `--restart always`，`docker stop` 后 `docker rm`（无 -f）会与 restart policy / daemon 状态竞态，容器在 `docker run` 前重新抢占名字。Fix：把 stop+rm 替换为 remove_container() helper（`docker rm -f` 强制移除 + 轮询直到 `docker ps -aq -f name=^<name>$` 为空才 run），主部署路径与 prod rollback 路径共用。'
  track: hotfix
  stage: completed
  completed_at: '2026-06-02T00:00:00+08:00'
  classification_reason: 'Hotfix — (1) 无 DB schema 变更 (2) 无新 API 端点 (3) 无新外部服务 (4) 仅改 deploy 脚本（每仓库 deploy-remote.sh + 配套回归测试，纯 infra tooling 非 app code）(5) 不涉及支付/权限业务逻辑。跨 3 仓库因脚本近一致需同步修。User 2026-06-02 明确指定 Hotfix + 「deploy to dev twice」验证。Bug 为内部部署时观测（非客户报告），按 Rule 11 精神仍以失败复现测试打头（test(qa): reproduce 前缀，沿用既有 test-push-guard.sh 的 fake-docker-on-PATH 模式）。'
  last_updated_by: ai-h3-done
  last_updated_at: '2026-06-02T00:00:00+08:00'
  created_at: '2026-06-02T00:00:00+08:00'
  repos:
  - numind-server
  - numind-web-v3
  - numind-admin-web
  branches:
    numind-server: fix/deploy-container-name-conflict
    numind-web-v3: fix/deploy-container-name-conflict
    numind-admin-web: fix/deploy-container-name-conflict
  worktrees:
    numind-server: /private/tmp/wt-deploy-container-name-conflict-numind-server
    numind-web-v3: /private/tmp/wt-deploy-container-name-conflict-numind-web-v3
    numind-admin-web: /private/tmp/wt-deploy-container-name-conflict-numind-admin-web
  progress:
    total_tasks: 1
    completed_tasks: 1
    reviewed_tasks: 1
  decisions:
  - 'H1-D1 (ai 2026-06-02, fix 选型): 三选项评估 —— Option 2 `docker run --replace` 否决（--replace 是 Podman flag，Docker Engine 的 docker run 不支持，实机会硬报错）；Option 3 幂等「已在目标镜像即视为成功」否决（增加分支复杂度且可能掩盖真卡住的旧容器）；选 Option 1 `docker rm -f` + 轮询直到名字释放（直击根因：rm -f 一步 kill+remove，restart policy 无法在 stop/rm 间隙重抢名字；轮询兜底 daemon 在 rm 返回后稍晚才释放名字）。抽成 remove_container() helper 供主路径与 rollback 路径共用。'
  - 'H1-D2 (ai 2026-06-02, 自包含约束): deploy.sh 仅 scp 单个 deploy-remote.sh 到部署机 (/tmp/numind-deploy-remote.sh)，故 fix 必须自包含在该单文件内——禁止抽 sourced helper 到独立文件（部署机不会有它）。'
  - 'H1-D3 (ai 2026-06-02, 复现测试策略): 沿用 numind-server/scripts/cicd/test-push-guard.sh 的 fake-docker-on-PATH 模式，全脚本端到端跑 deploy-remote.sh：fake docker 建模 --restart-always 竞态（无 -f 的 docker rm 在容器存在时失败、docker rm -f 必成功、容器仍存在时 docker run exit 125 名字冲突）+ fake curl 让 health 通过。旧逻辑(stop+rm)下脚本因 125 经 set -e 退出=RED；新逻辑(remove_container)强制移除后 run 成功=GREEN。三仓库各自 scripts/cicd/ 加一份测试。'
  - 'H2-D4 (independent sonnet reviewer 2026-06-02): VERDICT=PASS_WITH_CONCERNS。确认 rm -f+poll 消除竞态、name=^X$ 双锚点防跨容器误删（numind-web-v3 prod 无后缀名也被正确排除）、bind-mount 数据不受 rm -f 影响、三仓库逐字一致、set -e 交互安全（local/算术赋值/[ ]/while 均不误触发，remove_container 返回 1 在主路径按预期 abort）。3 个 P2 全部当场修：(a) rollback 路径 remove_container 失败时加显式「❌ Rollback aborted」消息再 exit 1（否则 set -e 静默杀脚本，外层「Rollback also failed」不打印）；(b) 回归测试 fake docker 改为 name-aware，真正走 -f name=^X$ 过滤与按名行为（升级后仍 RED-on-old / GREEN-on-fixed 双向验证）；(c) 测试 TARGET=server 注释说明仅 server target 读取。'
  - 'H3-VERIFIED (ai 2026-06-02, 用户授权 deploy dev twice): numind-web-v3（bug 观测仓库）连续部署 dev 两次验证 fix —— #1 full(rsync 修复脚本+build+deploy，镜像 develop-0ecb9bf) 替换既有 dev 容器=干净成功；#2 --deploy-only 再次替换 #1 的容器（正是出 125 的连续替换场景）=干净成功（容器 2acfb116→03c57077，✅ Deploy success，exit 0，全程无 125/Conflict）。终态：numind-web-v3-dev Up(healthy) on develop-0ecb9bf，:9200/health=200。三仓库 deploy-remote.sh 逻辑一致 + 各自回归测试绿，server/admin 由相同逻辑+单测覆盖；其 dev 双部署未跑（用户聚焦 web-v3 观测场景；可按需补）。S7 prod tag 未做（用户授权仅 dev）。'
  blockers: []
  created_at: '2026-06-02T00:00:00+08:00'

- id: agent-security-hardening
  ndf_version: '3.0'
  description: 'Agent mode 安全门禁加固（go-live blocker，prod-readiness §0.1 BLK-1/BLK-3 + §3.1 安全）。三件事：(1) BLK-1 恢复门禁——permission gate.go:110 用 flag.Lookup("test.v") 嗅探环境后门（commit 14754a39），仅 go test 走真 7-validator pipeline，dev/prod 一律 ForceAllowAllGate 全放行 → 平台硬规则/租户黑名单/IsDestructive/bashvalidator 真实运行时全失效，单测因 test.v 走真管线而虚假全绿。修复已存在于 fix/remove-permission-backdoor（2 commit: test(qa) 复现 + fix 改 config 驱动 agent.permission.enforce 默认 true 全环境强制真管线，viper.SetDefault 兜底 prod 无需改 config_prod），落后 develop ~81 commit 未合并 → 重落当前 develop 解 gate.go 冲突。(2) 软拦截不中断——现命中 deny→HookActionPermissionDeny(hooks.go:19)→TerminalPermissionDenied(state.go:20)→整 run 终止；改为只挡这一次工具调用、给 LLM 返回"被安全策略拦截"工具结果、ReAct 循环继续（adapter_full_to_eino.go:106-109 deny 分支 return error 改 return tool-result+nil；runner.go:1231-1243 + runner_runstream applyHookOverride 对 PermissionDeny 跳过 terminal、Reset registry，硬停 Stop/BlockingStop/BudgetExceeded 仍 terminal）+ 防呆（同工具+同类输入连续 N 次拦截才 terminal，拦截文案明确禁止重试）。(3) BLK-3 平台级安全输入禁令第一批 1-4（平台级=第一个 B，硬编码对所有租户生效，绝不写按 parent_user_id 的 tenant_admin_rule）：①SSRF 内网/元数据(169.254.169.254/127.0.0.1/localhost/10.x/192.168.x/172.16-31.x)→web_fetch(复用现 validateFetchURL)+run_python downloadInputFile(无 SSRF 现补)+bash curl/wget；②毁灭命令 rm -rf //~/HOME、mkfs、dd of=/dev/、fork bomb、>/dev/sd*→bashvalidator;③下载即执行 curl|sh、base64 -d|sh→bashvalidator;④凭据文件 /etc/shadow、~/.ssh、~/.aws/credentials、.env、/proc/<pid>/environ→bash(file_read 已 COS-URL-only 结构安全无需改)。bash 类(②③④)同时补强 bashvalidator(8 检查器仅防混淆字符=BLK-3)。最重要约束：精准只锁危险形态，严禁误伤（rm 只禁毁灭形态非所有 rm；SSRF 只禁内网非所有联网；凭据只禁服务器敏感路径不影响 file_read 读 COS 上传文件；用户下载 agent 产物完全不受影响）。不禁用任何整工具(tool_blacklist 留空)。禁碰 prod，dev sandbox=docker 验证。'
  track: standard
