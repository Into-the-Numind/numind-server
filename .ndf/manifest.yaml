- id: b2b2c-student-agent-access
  ndf_version: '3.0'
  description: 'B2B2C 子账户无法使用父账户配置的 agent（go-live blocker，prod-readiness §0.1 附加红线 + §5.1 USR-CRIT）。现状：agent run 路径 3 个访问校验点全部要求 ad.ParentUserID==调用者userID — resolveDefinition (student_run_lifecycle.go:683, estimate/create/stream 入口)、agentRunner.Run (runner.go:470, 非流式)、agentRunner.RunStream (runner_runstream.go:134, 生产默认流式) — 子账户 id≠agent拥有者(父账户)id → 必然 ErrSkillNotFound。list 路径 AvailableForStudent (biz/skill/student_query.go:16) 已修复（含 parent/child/inactive 测试），子账户能看到但不能跑。Fix: 把访问规则从「调用者必须是 agent 的 ParentUserID 本人」改为「调用者属于该 agent 的租户」——caller 能用 ad ⟺ ad.ParentUserID==caller.id (父账户本人) OR ad.ParentUserID==caller.parent_user_id (该父账户的子账户)。R9 附加：子账户禁止跑 is_active=false 的 agent（父账户本人不变，保留试聊草稿）。共享 helper agentTenantAccess(ctx,userStore,callerID,ad) 三处复用。务必保持 run/session/feedback 归属严格 per-userID（只放开 agent 定义访问，绝不放开别人的 run/session）。不跨租户。计费：run 仍以子账户 userID 发起（不改），扣子账户积分池。'
  track: standard
  stage: S6
