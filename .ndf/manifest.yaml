- id: stream-emit-toolcall-events
  ndf_version: '3.0'
  description: 'agent-filegen-progress-ux 部署后 user 反馈生成 PPT/HTML/读网页时仍无文案、无计时器、连流式光标都没有，像卡死。按硬规则用 gstack browse 在 dev 实机诊断（非静态推理）：登录→跑 web_search 任务→hook window.fetch 抓 SSE 帧。决定性证据——后端跑了 web_search（4 步）但浏览器只收到 reasoning_delta/token_delta/assistant_message/step_done，零个 tool_call_*。Root cause: 真正生效的流式路径是 RunStream→runner_runstream.go 的 streamScanToolCallChecker，它只扫 model OUTPUT 流、emit token/reasoning/assistant/step，从不 emit tool_call_start/result/error。（老的 runner_stream.go 有 emit 但不是 controller 调的活路径。）所以前端永远不知道有工具在跑→无 tool-call 卡片、无 narration 文案、无计时器→invoke_skill 那 30-60s 就是干等。这也解释了为什么 agent-filegen-progress-ux 的计时器"看不到"——它挂在 tool-call-item 上，而 item 从不渲染。Fix: 在 tool adapter（fullToolEinoAdapter.InvokableRun）emit 这三个事件——start 在 StateUse 之后/Execute 之前，result/error 在 Execute 之后。adapter 每个工具调用恰好跑一次、拿得到真实 tool name+input、与模型如何流式 tool_calls 无关。toolCallID 用合成 UUID 在 start/result 间保持一致供前端关联。emit 从 ctx 取 SSE channel（WithStreamState），非流式 Run 路径与无 state 的测试里静默 no-op。'
  track: hotfix
  stage: H3
  classification_reason: 'Hotfix — (1) 无 DB (2) 无新 API (3) 无新外部服务 (4) 1 文件 adapter_full_to_eino.go + 测试 (5) 非高风险（新增 SSE emit，非流式路径 no-op，行为兼容）。Bug-from-customer：user 报"仍然像卡死"。Rule 11：用 gstack browse 抓 SSE 帧作为运行时复现证据（reasoning/token 有、tool_call 全无），并落 4 个回归测试（adapter 成功 emit start+result、失败 emit start+error、无 state no-op、input_preview 带 skill_name）。'
  last_updated_by: ai-h3-landed-dev-browser-verified
  last_updated_at: '2026-05-29T18:00:00+08:00'
