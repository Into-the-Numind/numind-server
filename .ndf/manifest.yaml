- id: fix-skill-output-mime
  ndf_version: '3.0'
  description: 'bump-eino-maxstep 部署后 user 终于完整跑通 Agent 生 PPT—但下载下来的 .pptx 是一个文件夹（[Content_Types].xml + _rels/ + docProps/ + ppt/slides/slide{1..5}.xml…），里面的内容其实是合法 PPTX 的 zip 内部结构。Root cause: pool_skill.go CollectOutputs 用 http.DetectContentType(data) 检测 MIME → Office Open XML（.pptx/.docx/.xlsx）字节层就是 zip → 检测结果 "application/zip" → COS 上传时这个 MIME 进 Content-Type 头 → macOS Safari 看见 application/zip 自动用 Archive Utility 解压 → 用户看到的"文件夹" = 被解开的 PPTX 内容。Fix: 新增 mimeTypeForOutput(filename, data) 按扩展名映射规范 MIME（.pptx → application/vnd.openxmlformats-officedocument.presentationml.presentation，.docx/.xlsx/.pdf 同理），未知扩展回退 http.DetectContentType。CollectOutputs 改调它而非裸 sniff。'
