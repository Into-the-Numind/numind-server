  - 'S2: Rejected abort-only and dual-button variants. The one input stop control invokes the existing run-cancel API plus client stream cleanup. It remains disabled until stream_start establishes a trustworthy run ID; cancellation failure never fabricates a cancelled state. User pre-authorized this locked design through Dev.'
  - 'S3: Five serial RED-GREEN tasks protect real cancellation first, then remove estimate/header duplication, simplify welcome and scroll controls, and run browser acceptance. The same files and E2E dependencies make parallel implementation unsafe.'
  - 'S3 review revision: input stop now covers active runs during SSE, 409 fallback polling, and reload; it guards cancelling to prevent duplicate posts. The RED E2E uses a browser-owned non-closing ReadableStream, all obsolete abort-bar assertions are removed, estimate removal has a fake-timer component test, and exact FirstRun/MessageList tests cover compact accessible rendering.'
  - 'S3 review revision 2: agent-streaming runs as a mocked-browser contract on VITE_AGENT_MOCK=false port 5174, with an init-script token and all dependencies route mocked, so POST cancel is observable. Separate reload/polling and pending-double-click browser cases verify the single input stop remains available outside SSE and issues at most one cancel request.'
  - 'S3 review revision 3: agent-streaming is excluded from the default VITE_AGENT_MOCK=true e2e project and runs only in the VITE_AGENT_MOCK=false 5174 mocked-browser contract, removing a second contradictory execution path.'
  - 'S3 gate: independent atomicity review PASS. All cancellation, mock isolation, fallback, duplicate-post, estimate, and visual-contract test boundaries are independently buildable and serially ordered.'
  - 'S4 T1-T2: first committed RED browser regression proved the input stop emitted only a local AbortController action and never POSTed /cancel. GREEN routes both input areas through one guard that covers SSE, polling fallback, and restored active runs. On stop it immediately closes local SSE/narration/polling, then calls the existing server cancel; a 5xx keeps the active run and restores the retry stop control after cancelling resets. Dual independent reviews PASS; full mocked agent-streaming Playwright suite exit 0 (7 passed, 1 expected skipped).'
  - 'S5 T3-T5: removed the Header cancel props/template/CSS and all InputArea estimate props/debounce/request/display; preserved the one input stop route. FirstRun has only welcome copy. The interrupted-scroll control is a 32px arrow-only circle with title/aria/focus ring. Two final reviewers PASS after fixing browser absence assertion timing and a stale skipped integration selector. QA gates: targeted components 5/5, mocked agent-streaming 8 passed + 1 expected skip, lint 0 errors (7 pre-existing warnings), vue-tsc clean.'
