- id: tcr-push-silent-success
  ndf_version: '3.0'
  description: '2026-05-29 dev 部署：release.sh 打印 ✅ Release complete 且 exit 0，但 docker push 实际被 TCR 拒绝（repo 满 100-tag 上限，denied: ...tag has reached its limit(100)...）。新镜像从未进 registry，dev 容器仍跑旧镜像，healthz 在旧容器上通过——静默 no-op 部署。根因：3 个仓库的 build-and-push.sh 里 `docker push` 是裸调用；TCR tag-limit 拒绝时 docker push 仍返回 exit 0，set -euo pipefail 抓不到 exit-0 失败。修复：在 build-and-push.sh 包一层 push_image()，既查真实 rc 又 grep 输出里的拒绝模式（denied/reached its limit/quota/unauthorized）→ 命中即非零退出 + 明确 TCR tag-limit 指引（清理 TCR 控制台旧 develop-<sha> tag）。release.sh/deploy.sh 已有 set -e 且 ssh 正确传递退出码，无需功能改动。'
