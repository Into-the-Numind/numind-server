- id: sop-stream-robustness
  ndf_version: '3.0'
  description: 'SOP（多步 AI 工作流）流式执行健壮性批次（6 问题，集中同批文件）。两条流式路径：生产主路 Gateway（modelKey!="" → executor.executeViaGateway → aiservice.ChatStream → adapter runOAIStream/bufio.Scanner）；兜底路（modelKey=="" → ExecuteNodeStreamWithThinking → callAli/callVolcDeepThinkingStream 裸 HTTP/bufio.Reader）。修复：(1)P1 断连解耦——LLM 调用跑请求 ctx，客户端断开→ctx 取消→调用被掐→节点判 Failed+退积分；改用 context.WithoutCancel 派生 detachStreamContext 把生成从 HTTP 生命周期剥离（保留 trace/billing/reservation 值），客户端断开只停推送不停生成+落库，重连复用 GET /sop/runs/:id/status（GetRunStatus 已返回 Output）拉结果，控制器 handler 改 clientGone 非中止模式。(2)P1 idle/整体超时——流式读取无 idle 保护(callAli/volc Timeout:0)；idle=连续4分钟无字节→掐(time.AfterFunc 关 body 解阻塞读/gateway select-over-channel+ctx cancel 传导+drain 防泄漏)，整体=可配置默认30分钟兜底(context deadline 非 http.Client.Timeout)，两路覆盖，超时 wrap DeadlineExceeded→classifyReason provider_timeout+errtranslate 友好化。(3)P2 心跳 helper——3 个 SSE handler 各抄~30行+冗余双 ctx 检查→抽 startSSEHeartbeat(mu+ticker+ctx)。(4)P2 done 双发——兜底路 executor [DONE] 发 handler done 透传+biz 返回后控制器又发；统一控制器单发，executor 不透传 done，ChatAfterRun message_id done 保留。(5)P2 再生清理非事务(3删各自 Warnw)→store CleanupDownstreamForRegeneration 事务包。(6)P2 状态更新失败被吞+内存先置 Running 跳二次兜底→updateRunStatusWithRetry 退避重试+成功才翻内存，全失败静默自愈(zombie-reset)。不动 config_prod.yaml；无前端；无 DB schema。'
