- id: agent-mode-billing
  ndf_version: '3.0'
  description: 'Agent run 不扣真实积分（go-live blocker，prod-readiness §0.1 BLK-2）。根因两处：(1) 真实扣费链路从未接通——平台唯一真实扣减积分（Reserve/Reconcile 两阶段，写 credit_reservation/credit_cycle/user_booster_balance/trial_grant）的入口是 aiservice 网关 ContextBudgetCredits 中间件（context_budget.go:398 第一行 len(ContextFragments)==0 即透传短路）；agent 适配器 convertToAiserviceRequest（adapter.go:191-253）只设 Messages/Tools 从不设 ContextFragments，run 入口（runner.go/runner_runstream.go）只 NewContextWithUserID 不注入 billing operation → 每次 agent LLM 调用被透传，不 Reserve 不 Reconcile，三池余额纹丝不动；工具内 aiservice.Chat（analyze_image/annotate_image/compaction）同样缺 ContextFragments；image_gen 裸 HTTP 打 DMXAPI 绕过 aiservice。(2) 内存 BudgetTracker 的 MaxCredits/MaxTurns 维度生产恒 0——budgetgate.WrapHooks（biz.go:343）没传 WithUsageLookup → usageLookup nil → RecordUsage(0)；adapter 在 runner 用 struct 字面量构造致 usageStore nil；RecordStep 全仓库无 caller；仅 wall_time 900s 兜底。Fix：方向 A（初判）让适配器设 ContextFragments + run 入口注入 billing operation ctx 使 ContextBudgetCredits 自动 Reserve/Reconcile per LLM call（工具内调用一并接通），vs 方向 B（runner 显式包 Reserve/Reconcile）——S2 二选一并论证；并接通 BudgetTracker（WithUsageLookup + 修 usageStore + RecordStep）。扣减对象=发起 run 的 agent_run.user_id（子账户跑扣子账户自己，对齐 b2b2c-student-agent-access），非 agent ParentUserID。难点：一 run 多次 LLM 调用 per-call 扣费、detached context.Background 致 HTTP cancel 不传播退款依赖 reservation_sweeper 兜底、Reserve 预扣 Reconcile 多退少补、余额不足优雅终止。待决：image_gen 收编 aiservice、admin 试聊 ReserveAgentTest/ReconcileAgentTest 是否纳入（S1/S2）。先例：credit-log-task-names 用 aismw.WithReservationRef 穿过同一网关，S2-D4 坑——billing.WithBilling 覆盖 BillingCtx 须用专用 ctx key。'
