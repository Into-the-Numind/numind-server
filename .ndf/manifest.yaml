- id: sandbox-copy-via-tar
  ndf_version: '3.0'
  description: '前几轮沙箱修复后 user 再跑 Agent 生 PPT，HTML 成功了但 PPT 仍"沙箱资源紧张 4 次重试失败"。dev 日志真错误：AcquireForSkill: copy skill files: docker cp to container: exit status 1, "Could not find the file /skills/pptx-author in container"。前一轮加 /skills tmpfs 后 mkdir 已通，这次 docker cp 拷文件进 tmpfs 又失败——同一个新错误。在 dev 直接复现：docker exec mkdir /skills/pptx-author 成功，但 docker cp host_file <CID>:/skills/pptx-author/SKILL.md 报"Could not find the file"。对 /workdir 同样失败（也是 tmpfs）。对 /tmp（read-only rootfs）报"read-only filesystem"——不同 daemon 路径。docker cp 反向（CollectOutputs）也坏，从 tmpfs 拷出 /workdir/output 同样报"Could not find the file"。结论：**Docker 28.x 的 docker cp 对 --read-only rootfs 下的 tmpfs mount 双向坏掉**，docker exec 用不同 daemon code path 正常。这是前几轮所有"沙箱不可用"事故的真正根因——前面的修复（liveness/skill image/walltime/tmpfs ownership）每个都是真 bug，但都掩盖了下面这一层。Fix: docker_client.go CopyToContainer 改用 `docker exec -i <CID> tar -xf - -C <dir>` + in-memory tar；CopyFromContainer 改用 `docker exec <CID> tar -cf - -C <p> <e>` → host tar -xf；保留 docker cp 的 /. 后缀语义。Dev e2e 已实跑 mkdir→stage skill.py→python3 生成 28273 字节 .pptx→tar 拷回 host，file 命令确认是 Microsoft PowerPoint 2007+ 真文件。'
  track: hotfix
  stage: H3
  classification_reason: 'Hotfix — (1) 无 DB (2) 无新 API (3) 无新外部服务 (4) 1 文件 docker_client.go + 测试 (5) 非高风险（架构层 I/O 原语替换，行为契约不变）。Bug-from-user：第 5 次跑 Agent 仍失败。本修复在前 4 个 hotfix 的所有「沙箱不可用」剧情下游——所有之前的 fix（liveness/skill image/walltime/tmpfs）都是真问题，但每个都解锁了下一层的 docker cp tmpfs 失败，直到这里才到根。'
