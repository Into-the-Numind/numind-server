  description: 'Agent Mode v2 第 3 个 feature（v2 三件套之末）— 把 Skill 跨租户流通起来。机构父账户可把自己设计的 Skill 脱敏发布到平台市场；其他父账户订阅后，副本拷贝进自己租户的 skill 表，再装载到 Agent 使用。本 feature 范围：(1) 新增 skill_marketplace + skill_subscription 2 张表 + FK + FULLTEXT(ngram) 索引；(2) biz/marketplace 子包（service / sanitize / clone / search / admin 5 文件）；(3) 用户端 /v1/marketplace/* 7 端点（sanitize-preview / publish / unpublish / list / detail / subscribe / unsubscribe / my-subscriptions）+ 管理端 /v1/admin/marketplace/:id/recommend 1 端点；(4) 脱敏管道：正则黑名单（PII + 已配置竞品名）+ aiservice.Chat deepseek-v4-pro via DMXAPI 实体识别（人名/机构/产品，原 spec qwen-turbo 因阿里云 free-tier-only 配额耗尽改用 DMXAPI 路由，见 ADR 0001）+ 前端 diff 人工 review gate 强制确认 + 后端 confirmed_sanitized_body 哈希校验防篡改；(5) 订阅复制语义：订阅时打快照写副本到订阅方 skill 表（独立副本不引用，发布方后续编辑不影响订阅方），cloned_skill_id + subscription 关联两边；(6) 前端 numind-web-v3 新增 /marketplace/* 4 view（Browse / Detail / Subscribed / Publish）+ SkillEditor 加"发布到市场"按钮 + SkillList 加"已发布"徽章 + 顶部菜单加"技能市场"入口。Out of scope: runtime 调用 Skill（v2 #2）；付费/收益分成；prod 部署；C 端学员看市场；Skill scripts 跨租户共享（v2.5）；版本同步推送；发布前 Skill 沙箱验证；管理端批量管理 UI；平台预置 Skill。'
