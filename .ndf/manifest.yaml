- id: agent-mode-v2-skill-invocation
  ndf_version: '3.0'
  description: 'Agent Mode v2 第 2 个 feature（v2 三件套之二）— 运行时让 Agent 真的能"调用" Skill。本 feature 范围：(1) 新增 platform tool use_skill(name string) 注册到 biz/agent/tool 系统，让 LLM 主动 emit tool-call 调用；(2) runner.go system prompt 扩展段位 [3] body 注入 "## 可用技能" 目录（不新增段位保 6 段 invariant，仅 name + description + when_to_use 元数据，节省 token，懒加载 body）；(3) use_skill 调用时载入 Skill.body_md 到 turn 上下文（具体 role 由 S2 拍板）；(4) turn-scope tool whitelist：runner 启动时预注册所有 binding 的 allowed_tools 并集 + 通过新机制默认拒绝非基础白名单工具（不新增 hook chain slot，S2 选 permission validator 或 EinoToolWrapper），use_skill 调用后把该 Skill 的 allowed_tools 加入 turn-scope 允许集合，下一个 user 输入到来撤销；(5) narration provider 加 skill_use SSE event，前端 chat 流渲染 "📚 调用技能：{name}" 气泡；(6) use_skill 计入 BudgetTracker，hard cap 3 次/turn；(7) dual-read 兜底：runtime 优先按 agent_skill_binding 走新路径；Agent 无任何 binding 时回退到 v1 行为读 agent_definition.generated_skill_body/custom_skill_body，保 v1 Agent 零回归。Out of scope: DB schema/CRUD/UI（全是 #1 的事）；marketplace（#3）；Skill scripts 子目录执行；删 deprecated 字段；prod 部署；admin-web 改动；意图分类器自动 routing（LLM 自主决策）。'
  track: standard
  stage: S6-dev-deployed
  classification_reason: 'Standard 触发 — (1) DB schema 变更：否（#1 已建表本 feature 只读） (2) 新增 API 端点：否（use_skill 是 Agent 内部工具不暴露 REST） (3) 新外部服务集成：否 (4) 影响文件数 >3（biz/agent/tool_use_skill.go 新建 + runner.go 改 + budgetgate hook 改 + narration provider 改 + 前端 ToolBubble 改 + 测试） (5) 高风险业务逻辑：是（动 runner.go 影响所有 Agent 运行；dual-read 写错 = 全平台 Agent 行为异常；tool 白名单 hook 写错 = 工具权限失控）。条件 4+5 触发 Standard 强制（高风险 runner.go 改造 Hotfix 不适用）。'
