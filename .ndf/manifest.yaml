- id: agent-stream-finalize-and-snapshot-race
  ndf_version: '3.0'
  description: 'Dev 用户测 agent-stream-firstbyte-and-userbubble hotfix 后报新 bug：发指令→用户气泡 ✓→AI thinking ✓→"页面刷新"→所有气泡消失→后续无反应；刷新页面看到空 session。两个 interlocking 根因：(A) Backend controller 在 SSE emit terminal/error event 后立刻 return → defer runCancel() → runCtx 取消 → RunStream goroutine 的 finalizeRun (WriteTurn 持久化 messages，UpdateState 写 status/ended_at) 失败 "context canceled" → agent_run.messages=[] 永远不入库。(B) Frontend SSE terminal → reconcileFromDB → store.currentRun set (含 real session_id) → AgentChatView watcher → router.replace(`/chat/<uuid>`) → props.sessionId 从 "new" 变 real-uuid → 另一个 watcher → store.loadSessionSnapshot 用空 backend snapshot 覆盖 store.messages → 用户看到气泡瞬间消失。修复：(1) Backend controller 加 terminalSeen flag，emit terminal 后进 drain mode 等 channel close 才 return；client disconnect 期间 drain 时 nil-out doneCh 防止重新触发 runCancel。(2) Frontend 抽 AgentChatView sessionId watcher 逻辑到 session-watchers.ts helper，handleSessionIdTransition 在 oldSessionId === "new" 时 skip loadSnapshot。Out of scope: drain timeout、frontend Playwright-first 规则、currentRun.session_id watcher 链路重设计。'
  track: hotfix
  stage: H1
  classification_reason: 'Hotfix Triage 5 条 — (1) 无 DB schema 变更 (2) 无新 API 端点 (3) 无新外部服务集成 (4) 影响 5 文件（be: controller + test，fe: AgentChatView + session-watchers + spec，含强制 reproducing tests）(5) 非支付/权限/会员高风险业务。Bug-from-customer：dev 用户验收上次 hotfix 时报告，Rule 11 强制第一个 commit 失败复现测试，两个仓库均满足。'
