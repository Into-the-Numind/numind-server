- id: tavily-api-key-env-binding
  ndf_version: '3.0'
  description: 'Dev 部署 agent-mode web_search 工具发现 Tavily API key 为空 — config_dev.yaml 的 web_search.tavily.api_key 是 "", 而 deploy-remote.sh 没注入 NUMIND_WEB_SEARCH_TAVILY_API_KEY env var。Root cause: viper 的 AutomaticEnv + EnvPrefix("NUMIND") + EnvKeyReplacer 在 helper.go 已设置好（能 pick up env var），但部署链路从未提供 env var → viper fall back 到 config 空字符串 → Tavily HTTP 401。修复（运维向，非 Go 代码）：deploy-remote.sh 加可选 /opt/numind/<env>/secrets.env (server target only) 通过 docker --env-file 注入；文件不存在 = no-op，prod 自动 fallback 不影响。同时把 viper binding setup 抽到 config.SetupViperEnvBindings 让 regression test 真正 guard 契约。'
  track: hotfix
  stage: completed
  merged_commit: 3aa1495c
  dev_image: develop-3aa1495c
  merged_at: '2026-05-22T18:30:00+08:00'
