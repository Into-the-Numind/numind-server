- id: cos-download-content-disposition
  ndf_version: '3.0'
  description: 'Bug-from-customer: 用户点击 agent 生成的文件下载时浏览器弹"不安全"警告。Root cause: sandbox.UploadOutputFile / tool_create_helpers.uploadGeneratedFile / tool_run_python 输出 artifact 时调用 util.GenerateSignedURL 生成 presigned URL，但既没在上传时设 Content-Disposition 也没在 URL query 注入 response-content-disposition，COS 默认 inline 服务文件，触发 Chrome cross-site-download safety heuristic ("无法验证此文件来源")。Fix: 新增 util.GenerateSignedDownloadURL helper 在 query 注入 response-content-disposition=attachment;filename*=UTF-8''<encoded>，filename 走 RFC 5987 percent-encode + CRLF strip (defense in depth)；切换 3 个 user-download call sites (sandbox/cos_upload.go, tool_create_helpers.go, tool_run_python.go) 到新 helper，剩余 8 个 inline-display / LLM 消费 call sites 保持原 GenerateSignedURL 不变（加 attachment 会破坏 inline 渲染）。'
  track: hotfix
  stage: H3
