    total_tasks: 3
    completed_tasks: 3
    reviewed_tasks: 3
    current_task: 'H3 完成。numind-server dev deploy 验证 cleanup 端到端：build cache 5.143GB / 2 images 都正确显示 Before/After docker system df 对比；docker builder prune + image prune 都跑了（Total: 0B because all < 72h, 按设计保留）；cleanup took 1s；deploy success healthy。3 仓库 ndf-done 完成，worktree 已删，本地分支已删，0 orphan。'
  decisions:
  - 'H2-D1: drop `| tail -3` 从两个 docker prune 调用。理由：reviewer P2 + nit 都指向这个问题——远端 `set -e` 在 pipeline 中只检查最后一个命令的 exit code，`| tail -3` 会吞 docker prune 的真实失败；且 docker prune 的 summary 行 "Total reclaimed space: X" 是最后一行，长输出时 tail -3 反而可能截掉它。drop 后远端 docker prune 失败 → set -e 立即终止 → ssh 返回非零 → 外层 if-then 警告分支接住（非 fatal），同时输出完整 prune 日志便于运维 debug。'
  - 'H2-D2: 不修 reviewer P1 (SSH_OPTS 不带引号词分裂风险)。理由：该惯例在所有 3 个仓库的 release.sh 全文件 12 处 SSH 调用 (do_rsync/do_build/do_deploy/do_cleanup_build_cache) 都这样写，是预先存在的全文件惯例，非本 hotfix 引入。修它需改 4 函数 × 3 文件 = 12 处，scope 超出 Hotfix。Reviewer 自己也标"not blocking for this hotfix"。记入 follow-up tech-debt——如未来 BUILD_SSH_KEY 路径含空格才会真正爆，目前路径 ~/.ssh/numind_build_server 无空格安全。'
  - 'H3-D1 (verification 救命): 第一次 dev deploy (commit b46a38a1) 暴露 P0 — `do_cleanup_build_cache` 的 `docker builder prune -af --filter "until=72h"` 行末 newline 在 Edit 工具 replace_all 删 ` | tail -3` 操作中丢失，导致下一行的 `echo` 被 docker 收为 positional arg，报 "accepts no arguments" 错。bash -n syntax check 通过（合法语法）+ spec/code-quality reviewer 只看 diff 也未发现（runtime issue）。只有真跑 deploy 才暴露。修复 b935cca1 / c96e14d / 3d0d002 把 newline 还原。第二次 deploy (commit b935cca1) 验证通过。教训：multi-line shell 改动后必须真跑，不能只靠 syntax check + diff review。'
  - 'H3-D2: 用户决策 "保持 72h time-based"（A 方案）。我列了 A/B/C/D 四个保留策略（72h / 24h / --keep-storage / 次数+混合）；用户选 A 保持不动。理由：原 51GB 撑满事故中 40GB 是 build cache、11GB 是 images，docker 不支持 cache 按次数保留（多次 build 共享同一 cache layer 是 buildx 核心优化）；只能 image 按次数（需 ~20 行脚本），但 image 不是大头问题。下次部署后观察 72h 实际节奏下 GB 体量再调。'
