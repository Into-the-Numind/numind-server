- id: fix-skills-bake-into-image
  ndf_version: '3.0'
  description: 'Dev 容器内 /opt/numind/skills 不存在 → biz.go:282 启动报 skills.NewRegistry failed → invoke_skill 工具拒登记 → Agent 调 pptx-author 静默失败 PPT 生成失败。Root cause: config_*.yaml 把 skills_root 写成宿主机路径 /opt/numind/skills + 部署机 bind-mount 只覆盖 /opt/numind/${ENV}（不含 skills），容器内根本看不到 skill 文件。Fix: skills/ 是代码工件不是部署机数据，COPY 进镜像 /app/skills 跟版本走；config_dev/local.yaml + sandbox.config.go DefaultConfig 都改成 /app/skills；.dockerignore 加 `!skills/**/*.md` 例外保 SKILL.md 进镜像；registry.go / sandbox/config.go 注释顺手更新避免误导后人。'
