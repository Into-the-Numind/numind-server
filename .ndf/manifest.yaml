  decisions:
  - '2026-05-18 (架构): 痛点诊断 — 老链路 DockerHub 跨境是瓶颈。两条出路：A 本地 Mac 构建 / B 腾讯云构建服务器。选 B（4C8G 成都新机）—— amd64 原生构建（不用 Mac arm64→amd64 QEMU 模拟），且专注职责。'
