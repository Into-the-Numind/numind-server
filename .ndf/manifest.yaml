  - 'S4 GREEN: server commit c98f378e aligns both authorization lifetimes to 10 minutes, keeps the CLI at 30 seconds inside the 60-second browser window, revalidates the durable operation/session/Agent link before decrypting the device code, and emits credential-free fixed diagnostics. Web commit 089b3d3 scopes only Feishu resume to 60 seconds and adds a real 31-second browser regression.'
  - 'S4 review revision: a detached 50-second active server deadline now bounds claim, reread, renew, CLI, reconciliation, finalization and synchronous original-operation dispatch; the browser 60-second limit retains headroom for the slowest 5-second durable cleanup and HTTP/network return. Operation-bound authorization now requires both a valid AgentRunID and ToolCallID; manual connection remains OperationID=nil.'
