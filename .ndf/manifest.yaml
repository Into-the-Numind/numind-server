  decisions:
  - 'S2 头脑风暴(2 轮 Opus 4.8 subagent): 收敛出「实时进展行 AgentRunPulse」——对话与输入框之间一条常驻行,是 RELAY 不是第4个竞争信号。流式时让文字光标当活信号(进展行隐藏),流式一停 0ms 硬切接棒(冷启 250ms 淡入);有活跃工具回显其旁白;空隙走诚实阶梯(按 stuckSince 真实静默 0 秒就亮: 处理中→仍在处理中→复杂调研可能需要几分钟→可随时停止,绝不假进度/ETA/步数);等用户回答时整行隐藏(反向撒谎最坏)。节点 ping-pong 来回弹(非左→右扫,扫会被误读成假进度条)。reduced-motion: 关弹跳+用时常显+光标常亮不闪。subagent 关键纠正: per-tool 计时器其实已做很多只是工具一完就死、waiting 必须抑制、光标其实是 --primary 翠绿非蓝。'
  - 'S4 决定不做后端 phase=composing(虽 User 在 mockup 里看过该状态): 深挖 ReAct 循环发现每次 LLM 生成要等生成完看有无 tool call 才知道是"写报告"还是"想下一步",生成开始那刻分不清 → 硬标"正在撰写报告"就是 leading-lie/假数据(User 最恨)。诚实做法: 那段用阶梯"处理中"兜,报告若由工具生成则进展行本就回显"正在生成文档"。组件预留读 phase 接口(forward-compat)但不自己编。结果: 纯前端、单仓库、低风险。User 拍板"就这样落地"。'
  - 'S5 review: 双 Sonnet。修 P1: (a) dwell 链式延迟(连续切换把提交一路推后)→ 改 leading+trailing 固定窗 throttle; (b) 完成 1.4s 内新 run 显示"已完成"→ 新 run 启动清 settling; (c) .run-pulse 一直 pointer-events:none → 时间 tab hover 死,.show 加 auto; (d) 双 script 块导出 silenceLadder → 移到 utils/agentRunPulse.ts。P2: 视觉隐藏 aria-live(dwell 限速每工具一次,给盲人活信号又不刷屏)、光标 fallback 改翠绿、rAF→可清理 timer、settle keyframe 去抖动、触屏显示用时、hsl 语法统一。Gate: vue-tsc0/eslint0/全量 80 文件 851 pass(+10 新)。'
