- id: docker-ml-base-image
  ndf_version: '3.0'
  description: 'numind-server Dockerfile runtime stage (FROM ubuntu:22.04) 的两个重型 pip 层——torch CPU (pytorch.org 跨境下载, 数 GB) + sentence-transformers/pymupdf/markitdown 等功能库——在构建机 (139.155.129.13, 成都) 上因 BuildKit 构建缓存按体积 LRU 淘汰大层而每次部署 cache miss 重新执行，torch 一度 8KB/s 跨境重下，单次部署多花约 3-5 min（2026-06-03 部署 v2.1.34 实测；小 apt 层 CACHED 但两个大 pip 层未命中）。Root cause: 大层是 GC 首要回收对象 + --no-cache-dir 无本地 wheel 缓存 → 重建即从网络重下。Fix（方案 A）：把这些重型且极少变的 ML/系统依赖固化成独立 base 镜像 ccr.ccs.tencentyun.com/youshunumind/numind-ml-base:<date> 推到 TCR；业务 Dockerfile runtime stage 改 FROM 该 base 并删除两个 pip 层。base 几乎不重建 → torch 永不跨境重下，业务构建只从 TCR 国内骨干网 pull 预构建层。Out of scope: prod 部署（先 dev 验证提速 + 服务正常再议）；不改 config_prod.yaml；不碰业务逻辑；方案 B(registry cache)/C(GC 调参) 已评估不选（见 decisions）。'
  track: hotfix
  stage: completed
