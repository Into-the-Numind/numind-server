  stage: H1
  classification_reason: 'Hotfix Triage 5 条 — (1) 无 DB schema (2) 无新 API (3) 无新外部服务 (4) 影响 5 文件（types.go + adapter.go + stream.go + biz/agent/adapter.go + 2 个 test files；超 hotfix ≤3 上限但属于 base feature 修复且 4 层都必须改才能完整工作；reviewer 共识 spirit-of-hotfix 满足）(5) 非支付/权限/会员高风险 — agent stream pipeline 是核心但不涉及计费。Bug-from-customer：dev 用户长 prompt 调研测试时报告，Rule 11 强制 reproducing test，已用 dmxapi raw stream fixture 复现。'
