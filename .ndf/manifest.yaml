- id: build-cache-cleanup
  ndf_version: '3.0'
  description: '构建机 (139.155.129.13, 成都) 在三仓库共享场景下 docker build cache + unused image 累积撑满磁盘 (51GB/59GB)。2026-05-22 dev 部署 agent-mode-p0-tools 时 rsync 报 "No space left on device" 中断；手工 docker builder prune -af + image prune -af 释放 51GB 恢复。Root cause: 部署机 deploy-remote.sh 有内置清理但构建机从未清理过。修复（3 仓库 release.sh）：在 do_build 成功后 SSH 进构建机跑 docker builder prune -af --filter "until=72h" + image prune -af --filter "until=72h"，保留 3 天 cache 避免每次从零下载基础镜像，前后 docker system df 对比日志。Out of scope: 构建机磁盘扩容 / 修改 deploy-remote.sh 部署机清理 / cron-based 清理 / prod 部署（用户明确禁止）。'
  track: hotfix
  stage: completed
  classification_reason: 'Hotfix Triage 5 条全满足 — (1) 无 DB schema 变更 (2) 无新 API 端点 (3) 无新外部服务集成（SSH 到已有构建机，docker daemon 已用） (4) 影响 3 文件（3 仓库各自 release.sh） (5) 非支付/权限/会员高风险业务，且 prod 不触发（用户明确 dev only）。Rule 11 不适用（非 customer bug，是运维 infra 改进，参考 tavily-api-key-env-binding 先例）。'
  last_updated_by: ai-h3-completed
  last_updated_at: '2026-05-22T19:30:00+08:00'
  completed_at: '2026-05-22T19:30:00+08:00'
