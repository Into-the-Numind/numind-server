  - 'H1-D3 (ai 2026-05-29): Seq 自增不加锁。tool 执行与 model-output 扫描在一步内是顺序的（model 流完→checker 返回→tools 节点跑），无真并发，沿用既有 emit 闭包的无锁约定。'
