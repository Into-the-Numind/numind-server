- id: remove-permission-backdoor
  ndf_version: '3.0'
  description: 'Security backdoor removal: internal/numind/biz/permission/gate.go:106-121 的 PermissionGate.Check 含硬编码生产后门（commit 14754a39 "feat(permission): force release all permissions globally"）。仅当 flag.Lookup("test.v")!=nil（即 go test 下）才跑真实 validator pipeline (g.pipeline.Check)；dev/prod 一律无条件返回 BehaviorAllow + DecisionReasonOther + ValidatorID="ForceAllowAllGate"。后果：biz.go:313-327 wire 的 7 个 validator（PlatformHardRule、SandboxOverride、TenantAdminRule L2 租户黑名单、WorkingDir、ToolFlag per-agent 工具开关、UserSessionRule、AutoModeLLMValidator）在生产全是死代码，每个 agent tool call 被无条件放行。现有 gate_test.go 6 个测试因走 test.v 分支跑 pipeline 而全绿，恰好掩盖 prod 行为。Fix: 删除 test.v 分支让 pipeline 在所有环境运行；保留全局 override 但改由显式 config flag agent.permission.enforce 控制（默认 true=enforce；viper.SetDefault 兜底使 prod 无需改 config_prod.yaml；enforce=false 时才走 force-allow override 且 loud-warn 日志）。'
  track: hotfix
  stage: superseded
  superseded_by: agent-security-hardening
