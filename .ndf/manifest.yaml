  description: 'TestCreate_MissingQuestionnaire_422 fails on develop: POST /v1/agent/skills with empty questionnaire_answers map returns 200 instead of expected 422. Root cause: biz/skill/service.Create never validates required Q6/Q7/Q12 fields. The Build() doc comment claims "q6/q7/q12 必填字段缺失 → ErrSkillBuilderFailed", but Build()''s unit tests (TestBuild_MissingQ6/Q7/Q12_succeedsAndOmitsSection, TestBuild_NilQuestionnaireAnswers_succeeds) deliberately enforce that Build is a pure transformer that succeeds and omits sections when fields are missing. So the validation business rule belongs in biz/skill/service.Create (creation-time check), not in Build. Fix: add validateRequiredQuestionnaire helper called from Create, returning errno.ErrSkillBuilderFailed (already HTTP 422, doc already says "如必填题缺失"). Update stale Build doc comment to match reality. Out of scope: Patch-time QA-downgrade validation (separate concern); Build() validation (would break 4 deliberate unit tests).'
