    completed_tasks: 1
    reviewed_tasks: 1
  decisions:
  - 'H1-D1 (ai 2026-05-29): emit 点选 tool adapter InvokableRun，而非给 streamScanToolCallChecker 补 emit。理由：(a) checker 只扫 model output，看得到 tool_call 但看不到 tool result（result 是 tools 节点产物，不在 model 输出流）；adapter 同时拿得到 start 时机和 result/error。(b) adapter 每工具一次、模型无关（不受 deepseek/Claude 先 content 后 tool_calls 的流式怪癖影响）。(c) 一处覆盖所有工具 + invoke_skill。'
