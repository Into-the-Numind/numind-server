  - 'S0 (ai 2026-06-17): 源于用户反馈 web_fetch 即便对普通网页也读不好(2026 年大量站点 JS 渲染 + Cloudflare 基础反爬) + xiaohongshu-mcp 自家账号爬小红书被禁言十天。评估 5 个开源候选(invisible_playwright/firecrawl/obscura/Scrapling/Webwright)后再评 crawl4ai: 选 crawl4ai 自托管(Apache-2.0 无 AGPL 商用包袱 + LLM-native markdown + Docker HTTP 服务接入贴合现 web_fetch)。需求拆两块: A=读好开放网页(本 feature, 低风险, 该做); B=平台数据(小红书, 排除, 换策略非换库)。'
  - 'S1 (ai 2026-06-17): 可行性高(web_fetch 姊妹模板+SSRF 函数复用+viper config+httpclient+Langfuse span 全现成)。关键技术决策=方案 B 替换+兜底(非上轮口头的并存): web_fetch Execute 改为优先走 crawl4ai 渲染, crawl4ai 未配置/超时/报错则自动退回现有裸 HTTP 路径(零回归)。理由: 直接修复用户痛点(默认工具变好, 不靠 LLM 学会何时升级), 无双工具混淆, 优雅降级。prod 约束: 禁改 config_prod.yaml→默认 base_url 空=跳过 crawl4ai 走裸 HTTP, 运维另加配置+部署服务后自动升级=安全灰度。工作量 2-3 天含容器部署。仅 numind-server。'
  - 'S2 (ai 2026-06-17): 核对 crawl4ai v0.8.6 真实契约(POST /crawl 同步, 端口 11235, shm 1g, JWT 默认关, markdown 字段跨版本两形态 string|{raw/fit_markdown} 须防御解析, title 取 metadata.title)。设计: 新 internal/pkg/crawl4ai 独立包(非 LLM 调用→不走 aiservice)+RenderMarkdown/Configured; web_fetch Execute 内部加 render→raw_fallback→raw_direct 三分支, 输入输出 struct 与工具元数据全不变(factory_platform.go 不动)。SSRF 两道防线: Go 侧 validateFetchURL pre-flight 复用 + crawl4ai 容器网络隔离(渲染路径 dial-time rebinding 防护真正控制, 部署 task 必落实)。软错误不变量: crawl4ai 任何失败只 fallback 或 returnSoftError 永不 (nil,error) 杀 run。prod 禁改 config_prod.yaml→base_url 默认空=纯裸 HTTP 零回归, 运维部署服务+加配置后自动升级。'
  - 'S3 (ai 2026-06-17): plan 切 3 个实现 task(T1 crawl4ai 客户端包 / T2 web_fetch Execute 集成+config+span / T3 部署清单+网络隔离) + T4 S5 验证策略(后端 TDD+一次性本地集成, 非支付权限按 Rule10 不要求 Playwright)。T1→T2 依赖, T3 Tier2 并行。独立 Sonnet 原子性 review = PASS_WITH_CONCERNS(0 真 P0/P1; 2 P1 一个是正向确认 factory 不需改另一个是 T2 体量但符合 Rule9)。9 P2 关键 4 条按 Rule7 已就地补进 spec/plan: ①httpclient MaxRetries 须设在 Request.RetryPolicy 否则 Do() 补默认3次(照 web_search.go:132) ②markdown 字段 json.RawMessage 两段解析(string|fit/raw) ③早退出 span 也带 fetch_path ④T3 网络隔离须实测 docker exec 打不通内网非仅文档; 另 Compose v2 deploy.resources.limits.memory 非 mem_limit + web_fetch Description 改必做明示 JS 渲染 + 重定向链风险靠隔离兜底已注。PRD 6 条验收标准 spec 全覆盖映射诚实。'
  - 'S4 T1 (ai 2026-06-17, worktree 71afeddd): internal/pkg/crawl4ai 客户端包完成。RenderMarkdown 调 POST /crawl, json.RawMessage 两段解析 markdown(string|{fit/raw}), 显式 Request.RetryPolicy{0}, 全失败路径 return error 不 panic, Configured() nil 安全。11 用例含 hijack 真实 body-read 中断, go test -race 净。双 Sonnet review 0 P0/P1(spec PASS / quality PASS_WITH_CONCERNS): 已就地修 5 P2 中关键 4(auth 测试 channel 同步消除 -race 竞争 / body-read 测试 goroutine 内 t.Fatal→t.Errorf 防假绿 / timeout 时序裕度 50→100ms vs 1000ms / truncateForErr rune 安全 + ConnectTimeout 钳不超总超时); 保留显式 Content-Type(与 Tavily 兄弟一致)。'
  - 'S4 完成 (ai 2026-06-17, worktree feature/crawl4ai-tool @ b44f752f): T1 crawl4ai 客户端(71afeddd) + T2 web_fetch 渲染集成+config+factory desc(f20a2ecc) + T3 部署 compose+README(2ba2b48c) + review P2 修复(b44f752f) 全部完成。每 task 并行双 Sonnet review 均 0 P0/P1(T1 PASS/PASS_WITH_CONCERNS, T2 双 PASS_WITH_CONCERNS, T3 compose docker-validated)。P2 已就地修: render 截断 UTF-8 安全 / raw_fallback span 补 crawl4ai_latency_ms / client TLS 超时钳制 / +render截断+nil renderer 测试 / dev config 注释澄清。门禁: go vet ./... 净; golangci-lint 改动包 0 问题(task lint 全量失败仅因 golangci-lint 不在 PATH 环境问题); crawl4ai+agent 包 go test -race 全绿无回归。注: 全量 go test ./... 有 salesrag/credit/agent-controller 预存 DB 依赖失败(0.00s 瞬失), 已在 baseline develop 565fc358 复核同样失败=非本改动引入。reviewed==completed==3。下一步 S5 本地验收需起 crawl4ai 容器(4GB/浏览器)。'
  - 'S5 本地验收 PASS (ai 2026-06-17): 起真实 crawl4ai:0.8.6 容器(/health ok)做一次性 live 集成。决定性验证: quotes.toscrape.com/js/ 裸 HTTP 抓 class=quote=0 条(空壳), crawl4ai 渲染后 markdown 含 JS 加载引用文本+11 署名=渲染升级真实有效。契约验真: curl /crawl 真实响应 markdown 是 object(raw/fit_markdown), example.com fit_markdown 空→raw 有→证明 fit→raw 兜底必要且正确; metadata.title/status_code 吻合解析器; 我的确切请求体被接受(200)。真实 Go 客户端 RenderMarkdown 全链路 throwaway gated test PASS(跑后删, 守 T4 无持久 live 测试)。fallback/raw_direct/SSRF 单测覆盖。Langfuse fetch_path 代码全路径已写=DESIGN-VERIFIED(本地无后端+langfuse未 live 目检)。网络隔离: crawl4ai 仅挂专网无其他容器=结构隔离生效, 跨容器 reachability 完整测试留 S6。go vet+golangci-lint(改动包)净, crawl4ai+agent 包 -race 绿无回归; 全量 go test 的 salesrag/credit 失败=baseline 预存非本改动。容器已 compose down 清理。待 S6: dev 部署容器+配 base_url+跨容器隔离实测+span 线上目检。'
  - 'S6 (ai 2026-06-17): ndf-done 已 merge feature/crawl4ai-tool → develop 并 push, 复核为真(origin/develop=354f40ea merge commit, internal/pkg/crawl4ai 在 origin, worktree+分支已删)。代码落主干, crawl4ai 默认 off(config_dev base_url 空=裸 HTTP 零回归)。下一步 dev 部署: 探查 dev 服务器 docker/RAM/镜像可达性(crawl4ai 镜像在 Docker Hub, dev 国内可能需 TCR 中转)→ 起 crawl4ai 容器 → 配 base_url → 部署后端 → dev 验收。'
