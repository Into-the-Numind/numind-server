- id: ui-error-friendly-mapping
  ndf_version: '1.1'
  description: 'P0 用户体验 bug：SOP 节点执行 / chatbot SSE / salesrag 出错时，UI 直接弹出完整 Go 调用栈（如 ''node execution failed: executeViaGateway: ChatStream: ContextBudgetCredits: credit: insufficient balance: requested
    50, available 0''）。所有 ErrInsufficientCredits / ErrSubscriptionExpired / 偶发 DB 异常都有同类泄漏。修复策略 B+A 双保险：(B 后端) 在 SOP node 执行 / chatbot SSE error frame / salesrag 三处 controller boundary 用 errors.Is 识别根因
    err，转 errno 错误码 + user-facing message；技术细节进 zap 日志不进 UI。(A 前端) src/api/request.ts axios interceptor 扩展 errno code → 友好文案映射；兜底匹配 response.data.message 含 ''insufficient balance'' 等关键词覆盖防御。Caveat: SOP
    node 有 retry/fallback，转换不要破坏 retry 判断（应在 retry exhausted 后才转友好文案）。'
