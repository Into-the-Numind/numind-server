  decisions:
  - '2026-05-18 (架构): 痛点诊断 — 老链路 DockerHub 跨境是瓶颈。两条出路：A 本地 Mac 构建 / B 腾讯云构建服务器。选 B（4C8G 成都新机）—— amd64 原生构建（不用 Mac arm64→amd64 QEMU 模拟），且专注职责。'
  - '2026-05-18 (架构): TCR 个人版只支持广州（不支持成都），accept 这个不对称 — 构建机在成都，TCR 在广州，部署机 dev 在北京 prod 在成都。跨地域走腾讯云骨干网（不收公网流量费），实测 10-30 MB/s 稳定，远好于 DockerHub 跨境的 < 1 MB/s。'
  - '2026-05-18 (并行 session 防御): 其他 session 的 git checkout 切了 24+ 次 HEAD，多次误删未提交工作树文件。改用 `git worktree add` 创建 locked worktree（每个 repo `.claude/worktrees/cicd-pipeline-setup`），完全隔离。'
  - '2026-05-19 (race condition 紧急止血): 并行 session push 到 develop 触发了老 GH Actions，把 dev 后端覆盖回 DockerHub 镜像。指导用户 GitHub Web UI 禁用 3 个 workflow（不删 yaml 保留作 fallback）。后续无再覆盖。'
  - '2026-05-19 (admin health check 调整): admin 启动需 ~60 秒（DB seeding + Redis config sync），但 deploy-remote.sh 给的 30 秒太短，部署期间 false negative 报错。改为 3 分钟 timeout（MAX_TRIES=36, SLEEP_INT=5）。'
  - '2026-05-19 (slash command 抽象): 创建 `/deploy-dev` 和 `/deploy-prod`（项目级，Codes/.claude/commands/），auto-detect 当前仓库 + 必要时 ask user target。底层透传给 release.sh 脚本。dev 直接跑，prod 强制人工确认。'
