- id: agent-stream-tool-calls-pipeline
  ndf_version: '3.0'
  description: 'Dev 用户测 Web 调研助手 (agent_id=100003) 长 prompt 调研问题时报「AI 回复气泡是空的」。Backend curl 直接打 dmxapi /chat/completions 抓 raw SSE，发现 LLM 输出 84 个 reasoning_content deltas + 73 个 tool_calls deltas，finish_reason=tool_calls，完整 web_search arguments — LLM 完美工作。但 backend stream pipeline 4 层 silently drop tool_calls + reasoning：(1) oaiStreamChunk.Choices[].Delta 只有 Content/ReasoningContent 字段，没 ToolCalls → JSON unmarshal 把 73 个 tool_calls deltas 全部丢弃；(2) runOAIStream 的 emit guard `if delta!="" || reasoningDelta!=""` 不处理 tool_calls；(3) aiservice.ChatChunk 没 ToolCalls 字段 → 没契约可传；(4) wrapChannelAsStreamReader (biz/agent/adapter.go) 只 forward chunk.Delta → schema.Message.Content，ReasoningDelta+ToolCalls+FinishReason 全都丢在 eino 边界，consumeEinoStream 永远看不到 step boundary → step_count=0 → 空气泡。修复 4 层：(a) 抽 oaiStreamChoice/oaiStreamChoiceDelta named types (避免 5 处 fixture inline literal 改动) + 加 oaiToolCallDelta 类型；(b) aiservice.ChatChunk 加 ToolCalls 字段；(c) runOAIStream 累积 per-index tool_calls.function.arguments，IsFinal chunk 按 Index 顺序 emit；(d) wrapChannelAsStreamReader forward ReasoningDelta/ToolCalls/FinishReason 到 schema.Message。Reproducing test 用 dmxapi raw stream fixture replay。前 4 次 hotfix（user bubble + first byte + finalize race + snapshot race + reconcile dedup + multi-run isolation）都是 agent-react-streaming feature 部分缺陷，本次发现 base feature 还有 tool_calls 流式从未实现 — 这是更深层的根因。'
