  - 'H1-D2 (ai 2026-05-29): tar via exec 而非 (a) 升级 docker daemon（infra 改动 + 全局影响）(b) 移除 read-only rootfs（重大安全回退）(c) 把 /workdir/skills 改成 named volume（持久化语义改变，跨容器隔离破坏）。docker exec tar 是接口层 drop-in 替换，调用方代码完全不动。'
