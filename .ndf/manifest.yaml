- id: bump-eino-maxstep
  ndf_version: '3.0'
  description: 'sandbox-copy-via-tar 部署后 user 又跑 Agent 生 PPT，沙箱真的好了——但前面那个用户报错 [GraphRunError] exceeds max steps 暴露出新约束：dev agent_run 76 整段日志（3 分钟、~30 个 web_search+web_fetch 调用、全程未到 invoke_skill）的根本原因是两个耦合 cap 都太紧：(1) eino react.AgentConfig.MaxStep 在 runner.go 和 runner_runstream.go 硬编码 30，比我们自己的 budget MaxTurns=50 还低 → eino 先 trip → 框架抛 GraphRunError「exceeds max steps」→ caller 把它当成 TerminalModelError，把"超预算"的信号完全丢了，DB state_reason 记成 model_error。(2) budget.DefaultLimits().MaxTurns=50 对一个 research-heavy + 双产物（HTML+PPT）的任务太紧。user 要 100，bump 双 cap：MaxTurns 50→100、eino MaxStep 30→120（保持严格 > MaxTurns，让权威终止理由始终走我们的 budget gate）。成本仍由 MaxCredits(800/run) 和 MaxDailyCredits(2000) 兜底，MaxWallTime(900s) 兜 stuck 任务。'
