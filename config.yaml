# Numind Server 配置文件
# 支持多环境配置：common, development, qa, production

# 公共配置 (所有环境共享)
common:
  app:
    name: "Numind Server"
    version: "1.0.0"
    description: "Numind API Server"

  server:
    port: 8000
    read_timeout: 30s
    write_timeout: 30s
    max_header_bytes: 1048576

  cors:
    allowed_origins:
      - "http://localhost:5173"
      - "https://llm-soup.xyz"
      - "http://47.108.85.126"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Authorization"
    allow_credentials: true
    max_age: 12h

  security:
    rate_limit_requests: 100
    rate_limit_window: 1m
    jwt_expire_hours: 24

  logging:
    level: "info"
    format: "json"
    output: "stdout"
    file_path: "./logs/numind.log"
    max_size: 100
    max_age: 30
    max_backups: 10
    compress: true

  monitoring:
    enabled: true
    metrics_port: 9090
    health_check_interval: 30s
    health_check_timeout: 5s

# 开发环境配置
development:
  environment: "development"

  database:
    host: "localhost"
    port: 3306
    user: "root"
    password: "123456"
    name: "numind"
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 1h

  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0
    pool_size: 10
    min_idle_conns: 5

  jwt:
    secret: "dev-secret-key-change-in-production"

  wechat:
    app_id: ""
    app_secret: ""

  oss:
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""
    bucket_name: ""

  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    timeout: 30s
    max_retries: 3

# QA 环境配置
qa:
  environment: "qa"

  database:
    host: "qa-db-host"
    port: 3306
    user: "numind"
    password: "qa-password"
    name: "wxtw_qa"
    max_open_conns: 20
    max_idle_conns: 10
    conn_max_lifetime: 1h

  redis:
    host: "qa-redis-host"
    port: 6379
    password: "qa-redis-password"
    db: 0
    pool_size: 20
    min_idle_conns: 10

  jwt:
    secret: "qa-secret-key"

  wechat:
    app_id: "qa-wechat-app-id"
    app_secret: "qa-wechat-app-secret"

  oss:
    endpoint: "qa-oss-endpoint"
    access_key_id: "qa-oss-access-key"
    access_key_secret: "qa-oss-secret"
    bucket_name: "qa-bucket"

  openai:
    api_key: "qa-openai-api-key"
    base_url: "https://api.openai.com/v1"
    timeout: 30s
    max_retries: 3

# 生产环境配置
production:
  environment: "production"

  server:
    port: 8000
    read_timeout: 60s
    write_timeout: 60s

  database:
    host: "prod-db-host"
    port: 3306
    user: "numind"
    password: "prod-password"
    name: "wxtw_prod"
    max_open_conns: 50
    max_idle_conns: 25
    conn_max_lifetime: 1h

  redis:
    host: "prod-redis-host"
    port: 6379
    password: "prod-redis-password"
    db: 0
    pool_size: 50
    min_idle_conns: 25

  jwt:
    secret: "prod-secret-key-must-be-very-long-and-secure"

  wechat:
    app_id: "prod-wechat-app-id"
    app_secret: "prod-wechat-app-secret"

  oss:
    endpoint: "prod-oss-endpoint"
    access_key_id: "prod-oss-access-key"
    access_key_secret: "prod-oss-secret"
    bucket_name: "prod-bucket"

  openai:
    api_key: "prod-openai-api-key"
    base_url: "https://api.openai.com/v1"
    timeout: 60s
    max_retries: 5

  logging:
    level: "warn"
    format: "json"
    output: "file"

  security:
    rate_limit_requests: 200
    rate_limit_window: 1m
