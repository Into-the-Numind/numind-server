# MySQL 数据库 — 连接 dev 服务器的 MySQL（与 dev 共享数据）
db:
  host: 49.233.219.254:13306
  username: root
  password: Numind2025
  database: numind-dev
  max-idle-connections: 100
  max-open-connections: 100
