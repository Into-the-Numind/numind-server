    image_section:
      background: "transparent"                # 图片区域透明背景
  
  content_card:
    safe_area_margin: 0                       # 内容安全区域边距
    max_content_height: 1360                  # 内容最大高度
    overflow_behavior: "create_new_card"      # 溢出行为：创建新卡片

# AI提示词配置
ai_prompts:
  text_processing: |
    # 角色
    你是一位资深的内容编辑与信息架构师，拥有强大的逻辑分析能力和对内容的高度敏感性。你的核心专长是将任何质量的原始文本，重构为一篇结构清晰、逻辑严密、极具可读性的精美文章，并为其构思核心视觉概念。

    # 整体目标 
    我将为你提供一段通过OCR技术从图片中识别出的原始文本。你的任务是并行完成以下两项核心工作，并将两项工作的结果，合并为一个单一的、纯净的JSON对象作为最终输出。
    工作一：文本结构化（输出为Markdown格式）
    工作二：根据内容写一段文生图的提示词

    # 核心原则
    忠于原文 : 用户的原始文本是核心和基础。
    逻辑补全，而非内容创作: 补充比例必须很小（补充内容不应超过原文总字数的10%），且只能是基于上下文的、必要的逻辑连接。
    可读性优先: 最终的格式化排版，必须以提升普通人的阅读体验为第一目标。
    杜绝无关信息: 必须彻底清除原始文本中可能存在的广告、水印、页码等"噪音"。

    # 边缘情况处理规则
    关于主标题 : 最终输出中必须有且仅有一个一级标题 (#)。如果原文中没有合适的，必须根据全文内容生成一个。
    关于文本过短: 如果净化后的核心文本内容少于50个字符，则结构化文本部分只返回一个普通段落或一个引用块。
    关于无明显结构: 如果文本是连续的长篇大论，不要强行创造二级标题 (##)。
    关于无法理解的文本: 如果文本内容是完全无意义的乱码，你应该返回一个空的image_prompt字段。
    关于文生图提示词：在遇到"文本过短"或"无法理解的文本"的边缘情况时，image_prompt字段返回空字符串。

    # 任务流程
    评估与预处理： 首先，根据"边缘情况处理规则"对输入文本进行评估和处理。
    执行文本结构化： 将净化后的文本分解为独立的逻辑块，并根据下文的"格式定义"，分配恰当的Markdown格式类型。
    执行视觉概念提炼： 在理解全文的基础上，构思一个能代表文章核心意境的画面，并根据下文的"文生图提示词生成规则"，生成一个字符串。
    最终封装： 将第二步生成的Markdown文本和第三步生成的视觉概念字符串，封装进一个JSON对象中作为最终输出。

    # 格式定义与选择规则
    你的所有输出都必须遵循标准的Markdown语法。
    * # (一级标题): 对应全文唯一的**主标题**。必须有且仅有一个。
    * ## (二级标题): 对应**副标题**。当文本出现明确的主题转换时使用。
    * 普通段落: 对应**正文**。段落之间必须有一个空行。
    * - 列表项: 对应**列表**。每个列表项都以- 开头，并单独占一行。
    * > 引用内容: 对应**引用**。在段落前加上> 。

    ⠀【重要】 你必须保持格式的纯净性，例如，不要使用### (三级标题)或其他非约定的Markdown语法。

    # 文生图提示词生成规则
    * 语言结构： 中文描述主体内容，末尾追加英文关键词提升画质和风格。
    * 目标画幅： 倾向于16:9的电影级宽屏横向构图。
    * 禁止项： 不能包含任何要求生成文字的指令。

    # 最终输出格式
    你的最终输出必须是一个**完整的JSON对象**，包含text和image_prompt两个字段。绝对不能在开头或结尾添加任何解释性文字，也不能使用代码块（```）将其包裹。
    **以下是标准案例：**
    {
      "text": "# 为什么高价值的信息几乎从不流向普通人？\n\n因为流不动，容易被误解，甚至被\"拒收\"。价值越高的东西，越考验人的理解能力。如果理解不了，就等于\"接收不到\"。记得几年前，知识付费行业刚开始蓄势的时候，一个好友劝我说：\"你知道吗？那个《灵魂有香气的女子》的作者，就靠卖女性成长类的内容，卖爆了。你要不也去做知识付费吧，未来肯定很火。\"因为我一直在影视行业工作，隔行如隔山，随口问了句，\"什么是知识付费？\"他当时就无语了。\n\n## 高深内容必须在简化之后，才能被普通人接受\n\n因为只有简单，才容易被\"传承\"，但同时，包着简单外壳的复杂信息，也很容易被误解。比如很多经典都是用文言文写的，但老百姓更倾向于传奇故事、谚语、俗语。\n- 《道德经》中的\"无为\"被解读成\"什么都不做\"，而不是\"顺应自然而为\"。\n- \"以德报怨\"，被误解为\"被人欺负要用爱心感化\"。但原文是：\"以德报怨，何以报德？以直报怨，以德报德。\"，孔子表达的是反对无原则宽容，主张公正回应。\n- \"人不为己，天诛地地\"被误解为\"人人都应该自私自利\"，但\"为\"读wéi，指的是\"修为\"，不修身则天地不容。\n\n> 《论语》中说：有朋自远方来，不亦乐乎？",
      "image_prompt": "一个抽象的画面，无数发光的信息流像瀑布一样从上方涌下，但大部分都在半空中消散成迷雾，只有极少数几股精准地落入下方几个微小的人形轮廓中，哲学概念艺术, cinematic lighting, 2k, masterpiece, ultra-detailed"
    }

    # 待处理的OCR文本: {content}
  image_generation: "基于以下文本生成一张精美的配图：{content}"

# JSON处理配置 - 控制JSON响应解析和字符过滤行为
json_processing:
  # 字符过滤配置
  character_filtering:
    # 是否启用严格的控制字符过滤
    strict_control_chars: true
    # 是否启用扩展ASCII字符过滤
    filter_extended_ascii: true
    # 是否启用Unicode替换字符过滤
    filter_unicode_replacement: true
    # 允许的控制字符列表（除了换行符和制表符）
    allowed_control_chars: ["\n", "\t"]
    # 允许的Unicode范围
    allowed_unicode_ranges:
      # 中文字符范围
      chinese: [0x4E00, 0x9FFF]
      # 中文标点符号范围
      chinese_punctuation: [0x3000, 0x303F]
      # 全角字符范围
      fullwidth: [0xFF00, 0xFFEF]
      # 拉丁字母扩展范围
      latin_extended: 
        - [0x00C0, 0x00FF]
        - [0x0100, 0x017F]
        - [0x0180, 0x024F]
      # 阿拉伯文范围
      arabic: [0x0600, 0x06FF]
      # 西里尔文范围
      cyrillic: [0x0400, 0x04FF]
      # 希腊文范围
      greek: [0x0370, 0x03FF]
      # 希伯来文范围
      hebrew: [0x0590, 0x05FF]
      # 泰文范围
      thai: [0x0E00, 0x0E7F]
      # 韩文范围
      korean: [0xAC00, 0xD7AF]
      # 日文平假名范围
      japanese_hiragana: [0x3040, 0x309F]
      # 日文片假名范围
      japanese_katakana: [0x30A0, 0x30FF]
  
  # JSON修复配置
  json_repair:
    # 是否启用深度JSON修复
    enable_deep_repair: true
    # 是否启用字段优先提取
    enable_field_based_extraction: true
    # 是否启用保守修复策略
    enable_conservative_fix: true
    # 最大修复尝试次数
    max_repair_attempts: 3
    # 是否启用日志记录
    enable_logging: true
  
  # 响应处理配置
  response_processing:
    # 是否检查Content-Length
    check_content_length: true
    # 是否尝试恢复不完整响应
    enable_response_recovery: true
    # 响应超时时间
    timeout: "30s"
    # 最大响应大小（字节）
    max_response_size: 1048576  # 1MB

# HTML转换器配置 - 现在从card配置中继承，保留特定配置项
