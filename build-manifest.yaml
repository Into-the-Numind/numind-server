        为何用系统性方案：逐 feature 打 polyfill 治标不治本，下一个库升级用上 structuredClone / Promise.any 还会复发。browserslist + plugin-legacy 是 Vue 3 商业项目行业标准（Element Plus、Naive UI 等均采用），一次配置永久根治
