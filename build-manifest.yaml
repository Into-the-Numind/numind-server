  - id: "sop-chatbot-visibility-scope"
    ndf_version: "1.1"
    description: "SOP / 智能体（chatbot）可见范围权限（实体视角）。父账户在 SOP 模板或 chatbot 编辑页内联新增「可见范围」开关：默认 allow-all（全部子用户可见）；可打开「仅指定子用户可见」从弹窗勾选白名单。未在白名单的子用户在工作区列表看不到该实体；已开始的运行/历史不受影响（仅列表过滤）。后期新增子用户默认看不到受限实体（白名单语义）。范围限定 SOP + chatbot，不含销售知识库；仅 C 端父账户配置，不含管理端。"
    track: "standard"
    stage: "S4"
    classification_reason: "Triage 5 条全触发 — (1) DB schema：需在 sop_template / chatbot_config 加 visibility_restricted 字段 + 新增独立白名单表 (2) 新 API：4 个新端点（PUT/GET visibility × 2 资源）+ 2 个既有端点行为变更（列表过滤注入）(3) 无外部服务 (4) 跨 numind-server + numind-web-v3 两仓约 23-27 文件 (5) 新增权限维度，与现有运行权限叠加，错误会导致子用户漏看/误看资源。Standard Track 必然。"
    last_updated_by: "ai-s4-phase1-done"
    last_updated_at: "2026-05-13T00:00:00+08:00"
    repos:
      - numind-server
      - numind-web-v3
    branches:
      numind-server: "feature/sop-chatbot-visibility-scope"
    artifacts:
      requirement: "numind-server/requirements/sop-chatbot-visibility-scope.md"
      proposal: "numind-server/proposals/sop-chatbot-visibility-scope-proposal.md"
      spec: "numind-server/docs/superpowers/specs/2026-05-13-sop-chatbot-visibility-scope-design.md"
      plan: "numind-server/docs/superpowers/plans/2026-05-13-sop-chatbot-visibility-scope-plan.md"
    progress:
      total_tasks: 23
      completed_tasks: 15
      reviewed_tasks: 15
      current_task: "S4 Phase 5 done (Tasks 14-15 EC-6 reviewed PASS; Task 13 DeleteSubUser deferred — 子用户删除流程不存在). Phase 6 next (Task 16 单元测试集中补全)"
    rollback: null
    last_verified: null
    decisions:
      - "2026-05-13 (Triage): 用户描述'SOP/chatbot 增加显示权限'。AI 发现已存在 child-run-permission（运行权限 / 用户视角 / deny-all）。用户确认两套语义并存：本需求 = 可见范围（列表过滤 / 实体视角 / allow-all 默认）；现有 = 运行权限（403 gate / 用户视角 / deny-all）。两层 gate 串行：可见范围 → 运行权限。"
      - "2026-05-13 (Triage 范围锁定): 仅 SOP + chatbot，不含 SalesRAG 销售知识库；配置入口 = 实体编辑页内联；配置者 = 父账户；子用户范围 = 当前父账户名下所有子账户；撤回行为 = 仅列表展示过滤，不影响进行中/历史；新子用户 = 默认看不到（白名单语义）"
      - "2026-05-13 (S1 D1): 数据表选独立新表 sop_visibility_grant + chatbot_visibility_grant。理由：用户视角 deny-all 与实体视角 allow-all 语义完全不同，复用现有表 + source 字段会让查询按 source 分支耦合"
      - "2026-05-13 (S1 D2): API 端点选独立端点 PUT/GET /v1/sop/templates/:id/visibility + PUT/GET /v1/chatbot/:id/visibility。理由：解耦 visibility 与实体其他字段，错误隔离"
      - "2026-05-13 (S1 D3): 开关关闭时保留名单数据。避免误操作丢失配置；重新打开恢复同一名单"
      - "2026-05-13 (S1 D4): 子用户级联删除时同事务清理 4 张表（2 visibility + 2 run-permission）"
      - "2026-05-13 (S1 D5): sop_template/chatbot_config 各加 visibility_restricted bool 字段做短路判断，避免无关 SOP 查询都 JOIN grant 表"
      - "2026-05-13 (S1 D6): 不引入通用 entity_type 字段。仅 SOP+chatbot 两类，通用化是过度抽象"
      - "2026-05-13 (S1 D7): 启用 GORM 软删除（与 user_template_permission 一致，便于审计撤回历史）"
      - "2026-05-13 (S2 ST1): 列表过滤选延续 O(N) 本地过滤模式（与 child-run-permission 一致），不引入 SQL JOIN"
      - "2026-05-13 (S2 ST2): PUT visibility 保存策略选全删全插（single transaction），不做 diff 增量"
      - "2026-05-13 (S2 ST3): 子用户选择弹窗提取为可复用组件 SubUserMultiSelectDialog"
      - "2026-05-13 (S2 EC-6): SOP/chatbot 删除时同事务清理 visibility grant 表（不推迟为 tech debt）"
      - "2026-05-13 (S2 review 3 轮): Round 1 发现 4 P0 + 2 P1 + 2 P2 → 全修；Round 2 发现 1 P0-NEW + 1 P1-NEW + 1 P2-NEW（Round 1 修复中遗漏 §7.1 migration DDL 同步 + Cleanup 函数层级模糊 + visibilityDirty store 字段未声明）→ 全修；Round 3 PASS（0 P0 + 0 P1，2 P2 顺手清理）"
      - "2026-05-13 (S2 锁定 P0-2 双路径删除): UpdateVisibility 路径用 Unscoped() 物理删（避免唯一索引含 deleted_at 的 MySQL NULL 共存问题）；DeleteSubUser/Entity 路径用软删做审计；唯一索引 (sub_user_id, entity_id) 不含 deleted_at"
      - "2026-05-14 (S4 Phase 5 Task 13 deferred): plan 假设有 DeleteSubUser 流程, 实际 grep 后代码库零此路径 (无 DELETE /v1/customers/sub-users/:user_id 路由, 无 customer.DeleteSubUser biz). spec §5 '现有删除路径' 描述错误. store.CleanupBySubUser 已实现备用 API, 未来加 DeleteSubUser 功能时 1 行接入即可. 用户确认跳过, 不增加无效代码"
    related_features:
      - "child-run-permission (已上线，共存互补，本需求是其前置 gate)"
      - "sales-agent-child-permission (已上线，作用于销售智能体运行权限，与本需求无重叠)"
    blockers: []
    created_at: "2026-05-13T00:00:00+08:00"
    completed_at: null

