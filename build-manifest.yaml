      diagnosis: |
        dev 环境 POST /v1/sop/runs 返回 500。server 日志 22:00:51 显示：
          warn sop/sop.go:270 User cannot run SOP
          {"user_id":28, "user_tier":"free", "reason":"免费用户无法运行SOP，请升级为会员"}
        业务拦截正确（free tier 不能跑 SOP），但响应 HTTP 是 500。
        根因：
        - biz/sop/sop.go::CreateRun 等级拒绝 (line 275) 和模板无权 (line 290)
          返回 errors.New/fmt.Errorf 无类型 error
        - controller/v1/sop/sop.go::CreateRun (line 564) 把所有 biz err 用
          errno.InternalServerError.SetMessage("%s", err.Error()) 包装
        - 结果：任何业务拒绝（free / 过期 / 次数耗尽 / 模板无权）统统报 500，
          前端无法区分"服务器坏了"和"你要升级会员"
