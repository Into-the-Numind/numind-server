      method: "前端 npm run lint + npm run type-check PASS（只有 KnowledgeBaseDetail.vue 一条 pre-existing warning）；后端 gofmt + go vet + go build ./... 全绿。Prod 部署后需验证：(1) Wade 349 再次触发 sop/chat/stream 应看到真实 reason（非 'HTTP 403:'）且弹出 InsufficientCreditsDialog；(2) prod docker logs grep 'API error response' 能看到结构化 4xx/5xx warn"
    decisions:
      - "2026-04-21 (Triage): Wade 349 用户报错 HTTP 403 事件中发现两个盲区：用户端 toast 对业务错误无信息量；后端对拒绝响应无结构化日志。用户原本以为是 provider 余额问题，代码追溯证伪（provider 4xx 走 fmt.Errorf → SSE event:error HTTP 200，不会走 useSSEStream HTTP 403 toast 路径）。真凶是 Wade 的 credits 模式下 tier 早已过期（2026-04-08）、balance=0 被预检拒绝"
      - "2026-04-21 (方案选型): 讨论 L1(前端 body 解析) vs L2(后端结构化日志) vs L3(errno 契约 category/action 重构)。L3 体量大、隐性契约多（几百处 SetMessage）、category 分类有歧义、前后端上线时序耦合，渐进 Strangler 需 2-3 周不适合 hotfix。用户拍板 L1+L2"
      - "2026-04-21 (默认约定): 关键字白名单复用 axios interceptor（积分/额度/充值）；日志级别 warn（与'Credits pre-check: zero balance' 约定一致）；日志跳过 401/404 噪声"
      - "2026-04-21 (波及面): WriteResponse 和 WriteCompressedResponse 都走 errno.Decode，统一通过 logErrorResponse helper 记录，避免复制粘贴"
