  - id: "credits-trial-grant-bypass-fix"
    ndf_version: "1.1"
    description: "P0 prod bug：用户 trial_grant 有 200 积分且未到期（expires_at=2026-05-19），但设置页显示 0、操作时报『积分不足』。根因两处：(后端) isEffectiveLegacy() 的 HasActiveMembership() fallback 让 billing_mode=credits 但 user_tier != free 的用户被路由到 legacy CanRunSOP 次数制路径，完全绕过 trial_grant；以及 sop.go CreateRun 的余额预检 sum 漏加 TrialRemain。(前端) CreditBalanceCard.vue 只读 sub_remain / booster_remain，从未读 trial_remaining；并且 cardState 判定不计 trial → trial-only 用户被误判 free 显示『请联系您的管理员开通会员』。"
    track: "hotfix"
    stage: "H3"
    classification_reason: "Hotfix Triage — (1) 无 schema (2) 无新端点 (3) 无外部集成 (4) 3 文件改动（credit_service.go 删 fallback / sop.go 删二次拦截+补 TrialRemain / CreditBalanceCard.vue 加 trial 行+修 cardState）(5) 产品方向已明：legacy 全废弃 credits 唯一。用户拍板快车道直接 prod 止损。"
    last_updated_by: "ai-hotfix-deploy"
    last_updated_at: "2026-05-18T00:00:00+08:00"
    repos:
      - numind-server
      - numind-web-v3
    branches:
      numind-server: "fix/credits-trial-grant-bypass"
      numind-web-v3: "fix/credits-trial-grant-bypass"
    progress:
      total_tasks: 3
      completed_tasks: 3
      reviewed_tasks: 0
      current_task: "H3 prod tag v2.1.22 + v1.0.22"
    decisions:
      - "2026-05-18 (用户拍板): legacy 体系完全废弃，trial_grant 必须在所有路径被读取。最小修复优先止损，彻底清理（删 legacyTierImpl / CanRunSOP 调用 / payment.go:142 等 19 处）留作后续 standard track。"
      - "2026-05-18 (节奏): 直接 prod 不经 dev 验证，v2.1.22 (server) + v1.0.22 (web-v3) 同时打 tag。"
      - "2026-05-18 (Prod deploy 异常 + 手动恢复): CI deploy_product 阶段 docker.io 直连 + Tencent mirror DNS + 1ms.run mirror 均超时；set -e 让脚本在 pull 失败后退出，老 v2.1.21 容器未被 stop（无 outage 风险）。手动恢复：SSH prod 用 dockerproxy.net mirror 拉到镜像 retag 后 stop+rm 老容器并启新 v2.1.22 容器，healthz 185s 内 green。后端实际中断约 3 分钟（container swap 期）。GitHub Actions UI 上 deploy_product job 仍显示 failure。"
    related_features:
