      - "2026-04-21 (补充测试 commit 85a0f16): (1) L2 dev curl 烟雾测试 — POST /v1/web/login 无效 body 触 400 产生完整结构化 warn（http_code/errno/message/path/method/client_ip 齐全），GET /v1/users/me 无 token 触 401 被过滤，GET /v1/nonexistent-xyz 触 404 被过滤，符合设计。(2) 抽出 buildErrorLogFields 纯函数 + 新增 core_test.go 5 test / 14 子断言全 PASS：200/302/401/404 skip；400/403/405/422/500/502 log；current_user 附加/缺失/类型错三条防御路径。(3) L1 浏览器手测留作用户 action（需要积分耗尽账号密码，AI 不自行改用户数据）"
