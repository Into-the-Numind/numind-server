  - id: "hotfix-error-surface-L1-L2"
    ndf_version: "1.1"
    description: "客户 toast 显示无意义的 'HTTP 403:'（statusText 空字符串），且后端对 4xx/5xx 拒绝响应无结构化日志，运维无法定位'谁/哪个端点/什么原因被拒'。根因：(L1 前端) useSSEStream.ts:120 只用 response.status + response.statusText，忽略后端 JSON body 里的 message；(L2 后端) core.WriteResponse 直接 c.JSON 输出，未记录结构化上下文。hotfix 两层联动：L1 前端解析 body.message + 对 402/403(含积分/额度/充值关键字) 派发 insufficient-credits 事件，与 axios interceptor 行为对齐；L2 后端 WriteResponse/WriteCompressedResponse 追加 logErrorResponse helper，跳过 401/404 噪声，warn 级别记录 user_id/path/method/errno/message/client_ip"
    track: "hotfix"
    stage: "H3"
    classification_reason: "两仓 2 文件改动，无 DB schema、无 API 契约变更、无业务逻辑变更。L1+L2 联动修 UX 盲区 + 运维盲区，用户在 L3（errno 重构）与 L1+L2 二选一讨论中确认走 L1+L2（L3 作为渐进 Strangler 长期 debt）"
    last_updated_by: "ai-hotfix"
    last_updated_at: "2026-04-21T14:30:00+08:00"
    repos:
