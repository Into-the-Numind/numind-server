      completed_tasks: 2
      reviewed_tasks: 2
      current_task: null
    rollback: "git revert 两仓各自的 hotfix commit；numind-server 删 tag v2.1.10 并回滚 prod 到 v2.1.9；numind-web-v3 走 develop revert push，CI 自动回滚 prod web 镜像"
