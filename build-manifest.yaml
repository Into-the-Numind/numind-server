      spec: "numind-server/docs/superpowers/specs/2026-05-13-chatbot-session-rename-pin-design.md"
      plan: null
    progress:
      total_tasks: 0
      completed_tasks: 0
      reviewed_tasks: 0
      current_task: "S2 gate — 等待用户确认设计方向 (硬门禁)"
    rollback: null
    last_verified: null
    decisions:
      - "2026-05-13 (Triage): 用户原话'某个 chatbot 页面左边对话记录列表支持改名+置顶'。AI 澄清 4 关键范围：目标页 = 用户端 chatbot 对话页（不含 SalesView）；置顶规则 = 可多置顶按 pinned_at DESC；交互 = hover 显示「…」菜单；轨道 = Standard"
      - "2026-05-13 (Triage 范围锁定): 复用现有 title 字段做改名（无需新字段）；新增 pinned_at TIMESTAMP NULL 而非 pinned bool + pinned_at 双字段（避免冗余）；改名/置顶不更新 updated_at（metadata 操作不影响活跃排序，建议 S1 锁定）"
      - "2026-05-13 (S0 reviewer subagent 审查): PASS_WITH_CONCERNS — 0 P0 + 3 P1 + 2 P2。3 个 P1 已全部写入 requirement card 'S1 必决策项' 节：①置顶/排序作用域 per-chatbot vs cross-chatbot（关键，主控漏掉的视角；后端 ListSessions 当前是 cross-chatbot 混排+前端 client filter）②改名/置顶不更新 updated_at 应 S1 锁定而非 S2 ③置顶数量上限应 S1 决策。Reviewer 还肯定了 4 条主控判断正确：单字段 pinned_at 优于双字段 / 范围锁定不含 SalesView / 零 data migration 风险声明 / 与 sop-chatbot-visibility-scope 的耦合分析准确"
      - "2026-05-13 (S1 office-hours Phase 3 前提挑战): 用户拒绝 P1 (rename+pin 是 MVP / search v2 预留) — 用户认为原意就是 rename+pin，PRD 不预留 search 未来意图；用户接受 P2 (per-chatbot scope + 顺带修 ListSessions perf bug)；用户接受 P3 (MVP 压缩到 1-1.5 天，推迟置顶硬上限/菜单组件抽离/错误码集中到 v2)"
      - "2026-05-13 (S1 office-hours Phase 4 方案对比): 3 个 distinct approaches 评估 — A 极简 MVP (1-1.5d, Completeness 8/10) / B 健壮版即 S0 原方案 (2-2.5d, Completeness 10/10) / C 三 icon hover (1.5d, Completeness 6/10)。用户选 A — 严格落实 P3 MVP 压缩边界 + 隐藏价值是顺带修 ListSessions cross-chatbot perf bug (相当于免费搭车 bug fix)"
      - "2026-05-13 (S1 PRD D1 锁定): per-chatbot scope + 后端 ListSessions 加 chatbot_id 可选 query param (向后兼容：缺参数保持 cross-chatbot 行为)，前端调用方主动传入启用新行为；client-side filter 在新 chatbot_id 参数下可移除但保留为 dedupe 防御"
      - "2026-05-13 (S1 PRD D2 锁定): 改名 + 置顶 + 取消置顶均用 GORM UpdateColumn 显式列更新，绕开 updated_at 自动刷新；S6 验收时验证：操作前后查 updated_at 应相等"
      - "2026-05-13 (S1 PRD D3 锁定): v1 不设置顶硬上限。理由：用户基数小滥用风险极低；省 ~0.5d 工作量（无 ErrPinLimitExceeded errno + 无前端边界 UI）；如未来 UI 出现真实拥挤再 v2 加硬上限 + 折叠组"
      - "2026-05-13 (S2 spec written): 写出 ~1200 行 spec 含 10 节：§0 背景边界 + §1 数据模型 (migration forward+rollback DDL + GORM model 改动) + §2 后端 API 契约 (rename + pin + ListSessions 改造) + §3 store/biz/controller 实现要点 + §4 排序 SQL 兼容性验证 (MySQL 8) + §5 前端设计 (api/store/Vue 改造 + inline RenameModal) + §6 17 条边界 case 全清单 + §7 测试策略 + §8 范围外列表 + §9 S3 待答 + §10 现有 feature 关联"
      - "2026-05-13 (S2 review Round 1): Sonnet reviewer 报告 PASS_WITH_CONCERNS — 2 P0 (ConfirmModal slot 不存在 + v-model:visible 错误) + 4 P1 (filter 标题/fetchSessions 迁移漏 sendMessage/optimistic 误称/分页参数不一致) + 3 P2 (CSS class 无样式/v-click-outside 标题误导/pinned_at 格式未明确)。AC Coverage Matrix 验证 11/11 PRD AC 全覆盖"
      - "2026-05-13 (S2 review Round 1 fixes): 2 P0 + 4 P1 + 4 P2 全修。关键修复：P0-1 改为 ChatbotChat.vue 内联 inline RenameModal 仅参考 sales/RenameSessionModal.vue 模板模式不 import（避免跨模块依赖 + MVP 不抽组件），复用 sales-modal.css 视觉一致；P1-2 store 加 currentChatbotId ref + 列出 3 处 store 内部 fetchSessions 调用迁移；P1-4 分页参数全统一为 offset/limit"
      - "2026-05-13 (S2 review Round 2): Sonnet reviewer 验证 Round 1 全部修复 ✅，0 P0 + 1 P1-NEW (Vitest 测试描述 optimistic/pessimistic 用词矛盾) + 2 P2-NEW (chatbotId watcher 缺失需 S4 新增 + sales/RenameSessionModal 复用语义需澄清)。3 条全修。最终 spec PASS 进入 S2 gate"
