  - id: "ai-service-deprecated-field-cleanup"
    ndf_version: "1.1"
    description: "ai_service 表当前同时存在 deprecated_at 和 is_active 两个字段，语义重叠且不联动：前端 ServicesList.vue 把 deprecated_at 直接当'已删除'展示（getServiceStatus: deprecated_at→'deleted'），但路由层完全不看 deprecated_at，只看 is_active。后果：UI 显示'已删除'的服务，路由器仍可能转流量过去 → ErrContextConfigInvalid。本 feature 重构为 GORM 标准 soft-delete 模式：废弃 deprecated_at 字段；新增/复用 deleted_at 软删字段；保留 is_active 作为'临时启停'语义。前端列表查询自动 WHERE deleted_at IS NULL（GORM 默认行为），删除按钮设 deleted_at=NOW()。is_active 切换 = 暂停（管理端仍可见）；deleted = 永久删除（管理端列表不显示，但历史 usage_record/credit_reservation/Langfuse trace 的 service_id 仍能 join 到表里查名字，外键完整）。"
    track: "standard"
    stage: "backlog"
    classification_reason: "Triage 5 条评估 — (1) 涉及 schema 变更（删 deprecated_at 字段或迁移到 deleted_at）(2) 涉及后端 store/biz 查询（默认过滤已删除）(3) 涉及前端管理页 UI（删除按钮语义、列表筛选）(4) 跨 numind-server + numind-admin-web 两仓 (5) 影响 ai_service 这个核心配置表，所有 LLM 调用路由依赖。Standard Track。"
    last_updated_by: "ai-backlog-record-2026-04-28"
    last_updated_at: "2026-04-28T22:00:00+08:00"
