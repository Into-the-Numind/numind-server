  - id: "billing-cost-cents-underbilling-fix"
    ndf_version: "1.1"
    description: "修复 usage_record.cost_cents 对 aihubmix 四模型（claude/gpt-5.4/gemini/deepseek）被低估的 bug。Root cause：billingStore.GetPricingRule 用 Order(gorm.Expr(\"CASE...END\", args...)) 做 3 级优先级排序，但 GORM v2 First() 静默丢弃参数化 Order 表达式，只剩 ORDER BY id LIMIT 1。全局兜底行（provider='',model='')id 小于精确行 id 时，始终返回兜底 ¥3/¥10，claude 被低估 ~5x，gemini ~6x。修复：Find + Go 端按优先级选最精确行。"
