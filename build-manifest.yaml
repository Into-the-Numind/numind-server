  - id: "ui-error-friendly-mapping"
    ndf_version: "1.1"
    description: "P0 用户体验 bug：SOP 节点执行 / chatbot SSE / salesrag 出错时，UI 直接弹出完整 Go 调用栈（如 'node execution failed: executeViaGateway: ChatStream: ContextBudgetCredits: credit: insufficient balance: requested 50, available 0'）。所有 ErrInsufficientCredits / ErrSubscriptionExpired / 偶发 DB 异常都有同类泄漏。修复策略 B+A 双保险：(B 后端) 在 SOP node 执行 / chatbot SSE error frame / salesrag 三处 controller boundary 用 errors.Is 识别根因 err，转 errno 错误码 + user-facing message；技术细节进 zap 日志不进 UI。(A 前端) src/api/request.ts axios interceptor 扩展 errno code → 友好文案映射；兜底匹配 response.data.message 含 'insufficient balance' 等关键词覆盖防御。Caveat: SOP node 有 retry/fallback，转换不要破坏 retry 判断（应在 retry exhausted 后才转友好文案）。"
    track: "hotfix"
    stage: "H3"
    classification_reason: "Hotfix Triage 5 条 — (1) 无 schema 变更 (2) 无新增 API 端点 (3) 无外部服务集成 (4) 跨 2 仓 ~5 文件（边界，但每文件改动模式相同：err.Error() 替换为 errno 映射）(5) 错误处理本身不涉及计费/权限逻辑，但 SOP retry 边界是关联风险点。用户拍板 Hotfix（边界判断上移）。"
    last_updated_by: "ai-h3-merged"
    last_updated_at: "2026-05-15T13:00:00+08:00"
    repos:
      - numind-server
      - numind-web-v3
