      numind-web-v3: "fix/ui-error-friendly-mapping (merged to develop via f1bf8f1)"
    progress:
      total_tasks: 8
      completed_tasks: 8
      reviewed_tasks: 8
      current_task: "等 dev CI 部署 + 人工验收"
    decisions:
      - "2026-05-15 (Triage): 严格按 NDF 规则应推 Standard（5 文件 + 跨 2 仓 + SOP retry 关联风险触发边界条款）。用户拍板 Hotfix 理由：单一目的修复、每文件改动模式相同（err.Error() → errno 映射）、零业务逻辑变更、零 schema、零端点。判断力上移到用户。"
      - "2026-05-15 (架构定调): B+A 双保险 — 后端 controller boundary 做权威错误码映射，前端 axios interceptor 做兜底关键词匹配。后端单点失误时前端仍能挡住裸 Go error。"
